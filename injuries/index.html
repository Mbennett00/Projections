<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injuries - Projex</title>
    <style>
        /* Base Projex Workspace Theme Overrides */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #11141b; 
            color: #727b8e; 
            padding: 16px; 
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper { max-width: 950px; margin: 0 auto; }
        
        /* Model Boards Hierarchy Label Elements */
        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #4a5468;
            margin-bottom: 14px;
            margin-left: 4px;
        }

        /* Clean Header Utility Hub Container */
        .control-row { 
            display: flex; 
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px; 
            background: #181d26; 
            padding: 16px; 
            border-radius: 14px; 
            border: 1px solid #222936; 
        }
        h1 { margin: 0; color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        
        .actions { display: flex; gap: 10px; width: 100%; }
        input, select { 
            background: #11141b; 
            color: #ffffff; 
            border: 1px solid #222936; 
            padding: 10px 12px; 
            border-radius: 10px; 
            outline: none;
            font-size: 13px;
            flex: 1;
            min-width: 0; /* Prevents input overflow on small screens */
        }
        select { flex: 0 0 110px; } /* Gives selection elements stable mobile sizing */
        input::placeholder { color: #3e4859; }

        /* Mobile-First Grid System */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr; /* Single column on phones */
            gap: 12px;
        }

        /* Projex Model Block Design Structure */
        .injury-card {
            background: #181d26;
            border: 1px solid #222936;
            border-radius: 14px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
        }

        /* Upper Row Context Elements */
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .league-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #4a5468;
        }
        .league-label span { color: #52a3ff; margin-right: 4px; }

        /* Status Dot Indicator Placement */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-danger { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
        .dot-warn { background: #eab308; box-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }

        /* Center Content Typography - Scaled Down for Mobile Devices */
        .player-headline {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 2px 0;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Adds dot-dot-dot if text hits edge */
        }
        .meta-description {
            font-size: 13px;
            color: #4b5569;
            margin-bottom: 12px;
        }

        /* Bottom Row Diagnostics block */
        .card-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #1f2735;
        }
        .diagnostic-text { font-size: 12px; color: #727b8e; font-weight: 500; }
        .status-string { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #4a5468; }

        /* Handling Empty Pipeline States */
        .alert-panel {
            grid-column: 1 / -1;
            text-align: center;
            padding: 32px 16px;
            background: #181d26;
            border-radius: 14px;
            border: 1px solid #222936;
            color: #4b5569;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Responsive Tablet and Desktop Breakpoints */
        @media (min-width: 600px) {
            body { padding: 24px; }
            .control-row { flex-direction: row; padding: 14px 20px; }
            .actions { width: auto; }
            input, select { font-size: 13px; }
            select { flex: none; width: 130px; }
            input { width: 220px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; }
            .player-headline { font-size: 22px; }
            .injury-card { padding: 20px; min-height: 125px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="section-label">Model Boards</div>
    <div class="control-row">
        <h1>Injuries</h1>
        <div class="actions">
            <select id="leagueSelector" onchange="applyFilters()">
                <option value="all">All</option>
                <option value="nfl">NFL</option>
                <option value="nba">NBA</option>
                <option value="nhl">NHL</option>
                <option value="mlb">MLB</option>
            </select>
            <input type="text" id="queryBox" placeholder="Search name or team..." onkeyup="applyFilters()">
        </div>
    </div>

    <!-- Mobile-optimized view layout grid -->
    <div id="datasetGrid" class="card-grid"></div>
</div>

<script>
    let rawDataset = [];

    async function loadDataset() {
        try {
            const res = await fetch('/data/injuries_slate.json');
            rawDataset = await res.json();
            applyFilters();
        } catch(e) {
            document.getElementById('datasetGrid').innerHTML = `
                <div class="alert-panel">
                    Missing structured data slate.<br>Run your updated data_pipeline.py locally to generate injuries_slate.json.
                </div>`;
        }
    }

    function applyFilters() {
        const sportType = document.getElementById('leagueSelector').value;
        const textFilter = document.getElementById('queryBox').value.toLowerCase();
        const output = document.getElementById('datasetGrid');

        let elements = rawDataset.filter(item => {
            const matchesSport = (sportType === 'all' || item.sport === sportType);
            const matchesText = item.name.toLowerCase().includes(textFilter) || item.team.toLowerCase().includes(textFilter);
            return matchesSport && matchesText;
        });

        if (elements.length === 0) {
            output.innerHTML = `<div class="alert-panel">No active player variables reported for this selection.</div>`;
            return;
        }

        output.innerHTML = elements.map(item => {
            const lowerStat = item.injury_status.toLowerCase();
            const useDanger = (lowerStat.includes('out') || lowerStat.includes('ir') || lowerStat.includes('reserve'));
            const dotClass = useDanger ? 'dot-danger' : 'dot-warn';
            
            return `
                <div class="injury-card">
                    <div class="card-header-row">
                        <div class="league-label"><span>•</span> ${item.sport} — Slate</div>
                        <span class="status-dot ${dotClass}"></span>
                    </div>
                    <div>
                        <div class="player-headline">${item.name}</div>
                        <div class="meta-description">${item.team} • ${item.position}</div>
                    </div>
                    <div class="card-footer-row">
                        <span class="diagnostic-text">${item.injury_detail}</span>
                        <span class="status-string">${item.injury_status}</span>
                    </div>
                </div>
            `;
        }).join('');
    }
    window.onload = loadDataset;
</script>
</body>
</html>
