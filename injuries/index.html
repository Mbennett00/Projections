<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injuries - Projex</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 24px; }
        .wrapper { max-width: 950px; margin: 0 auto; }
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
        h2 { margin: 0; color: #38bdf8; font-size: 20px; }
        .actions { display: flex; gap: 12px; }
        input, select { background: #0f172a; color: white; border: 1px solid #475569; padding: 10px; border-radius: 6px; outline: none; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #38bdf8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
        .sport-tag { font-size: 10px; font-weight: bold; background: #475569; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .status-danger { background: #7f1d1d; color: #fca5a5; }
        .status-warn { background: #78350f; color: #fde68a; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="control-row">
        <h2>App Projection Pipeline</h2>
        <div class="actions">
            <select id="leagueSelector" onchange="applyFilters()">
                <option value="all">All Leagues</option>
                <option value="nfl">NFL</option>
                <option value="nba">NBA</option>
                <option value="nhl">NHL</option>
            </select>
            <input type="text" id="queryBox" placeholder="Search name or team..." onkeyup="applyFilters()">
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Player</th>
                <th>Team & Position</th>
                <th>Status</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody id="datasetGrid"></tbody>
    </table>
</div>

<script>
    let rawDataset = [];

    async function loadDataset() {
        try {
            // Points cleanly to your Python output file
            const res = await fetch('injuries_slate.json');
            rawDataset = await res.json();
            applyFilters();
        } catch(e) {
            document.getElementById('datasetGrid').innerHTML = `<tr><td colspan="5" style="text-align:center;">Missing dataset. Execute data_pipeline.py locally.</td></tr>`;
        }
    }

    function applyFilters() {
        const sportType = document.getElementById('leagueSelector').value;
        const textFilter = document.getElementById('queryBox').value.toLowerCase();
        const output = document.getElementById('datasetGrid');

        let rows = rawDataset.filter(item => {
            const matchesSport = (sportType === 'all' || item.sport === sportType);
            const matchesText = item.name.toLowerCase().includes(textFilter) || item.team.toLowerCase().includes(textFilter);
            return matchesSport && matchesText;
        });

        output.innerHTML = rows.map(item => {
            const lowerStat = item.injury_status.toLowerCase();
            const badgeClass = (lowerStat.includes('out') || lowerStat.includes('ir') || lowerStat.includes('reserve')) ? 'status-danger' : 'status-warn';
            return `
                <tr>
                    <td><span class="sport-tag">${item.sport}</span></td>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.team} (${item.position})</td>
                    <td><span class="badge ${badgeClass}">${item.injury_status}</span></td>
                    <td>${item.injury_detail}</td>
                </tr>
            `;
        }).join('');
    }
    window.onload = loadDataset;
</script>
</body>
</html>
