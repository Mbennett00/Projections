<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Injuries - Projex</title>
    <style>
        :root {
            --bg: #17181B; --panel: #1E2023; --panel-hi: #26282C; --line: #323438;
            --g1: #93E06E; --g2: #5FA34A; --grad: linear-gradient(135deg,var(--g1),var(--g2));
            --ink: #F2F3EF; --mute: #8A8D93; --faint: #55585E;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--ink); padding: 16px; margin: 0;
            max-width: 520px; margin: 0 auto;
        }
        
        .kicker-row { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; margin-top: 10px; }
        .kicker { font-size: 10.5px; font-weight: 700; color: var(--mute); letter-spacing: .14em; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; }
        .kicker-line { height: 1px; flex: 1; background: linear-gradient(90deg, var(--line), transparent); }

        .control-row { 
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; 
            background: var(--panel); padding: 14px; border-radius: 14px; border: 1px solid var(--line); 
        }
        .header-title-block { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; color: var(--ink); font-size: 18px; font-family: 'Sora', sans-serif; font-weight: 800; }
        .back-btn { text-decoration: none; color: var(--g1); font-size: 12px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
        
        .actions { display: flex; gap: 8px; width: 100%; }
        input, select { 
            background: var(--bg); color: var(--ink); border: 1px solid var(--line); 
            padding: 10px; border-radius: 10px; outline: none; font-size: 13px; flex: 1; min-width: 0;
        }
        select { flex: 0 0 100px; }
        input::placeholder { color: var(--faint); }

        .card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

        .injury-card {
            background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .league-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--mute); font-family: 'IBM Plex Mono', monospace; }
        .league-label span { color: var(--g1); margin-right: 3px; }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-danger { background: #FF6B5E; box-shadow: 0 0 8px #FF6B5E; }
        .dot-warn { background: #EAB308; box-shadow: 0 0 8px #EAB308; }

        .player-headline { color: var(--ink); font-size: 17px; font-weight: 700; font-family: 'Sora', sans-serif; margin-bottom: 2px; }
        .meta-description { font-size: 12px; color: var(--mute); margin-bottom: 10px; }

        .card-footer-row { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
        .diagnostic-text { font-size: 11px; color: var(--mute); font-family: 'IBM Plex Mono', monospace; }
        .status-string { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--faint); }

        .alert-panel { text-align: center; padding: 32px 16px; background: var(--panel); border-radius: 14px; border: 1px solid var(--line); color: var(--mute); font-size: 13px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="kicker-row">
        <div class="kicker">Model Boards</div>
        <div class="kicker-line"></div>
    </div>
    
    <div class="control-row">
        <div class="header-title-block">
            <h1>Injuries</h1>
            <a href="../" class="back-btn">← HUB</a>
        </div>
        <div class="actions">
            <select id="leagueSelector" onchange="applyFilters()">
                <option value="all">All</option>
                <option value="nfl">NFL</option>
                <option value="nba">NBA</option>
                <option value="nhl">NHL</option>
                <option value="mlb">MLB</option>
            </select>
            <input type="text" id="queryBox" placeholder="Search name or team..." onkeyup="applyFilters()">
        </div>
    </div>

    <div id="datasetGrid" class="card-grid"></div>
</div>

<script>
    let rawDataset = [];

    async function loadDataset() {
        try {
            // Absolute path ensures Cloudflare points straight to the root data repository folder
            const res = await fetch('/data/injuries_slate.json');
            rawDataset = await res.json();
            applyFilters();
        } catch(e) {
            document.getElementById('datasetGrid').innerHTML = `
                <div class="alert-panel">
                    No active slate metrics found.<br>Verify your automated pipeline run successfully generated the file.
                </div>`;
        }
    }

    function applyFilters() {
        const sportType = document.getElementById('leagueSelector').value;
        const textFilter = document.getElementById('queryBox').value.toLowerCase();
        const output = document.getElementById('datasetGrid');

        let elements = rawDataset.filter(item => {
            const matchesSport = (sportType === 'all' || item.sport === sportType);
            const matchesText = item.name.toLowerCase().includes(textFilter) || item.team.toLowerCase().includes(textFilter);
            return matchesSport && matchesText;
        });

        if (elements.length === 0) {
            output.innerHTML = `<div class="alert-panel">No active entries match this criteria.</div>`;
            return;
        }

        output.innerHTML = elements.map(item => {
            const lowerStat = item.injury_status.toLowerCase();
            const useDanger = (lowerStat.includes('out') || lowerStat.includes('ir') || lowerStat.includes('reserve'));
            const dotClass = useDanger ? 'dot-danger' : 'dot-warn';
            
            return `
                <div class="injury-card">
                    <div class="card-header-row">
                        <div class="league-label"><span>•</span> ${item.sport}</div>
                        <span class="status-dot ${dotClass}"></span>
                    </div>
                    <div>
                        <div class="player-headline">${item.name}</div>
                        <div class="meta-description">${item.team} • ${item.position}</div>
                    </div>
                    <div class="card-footer-row">
                        <span class="diagnostic-text">${item.injury_detail}</span>
                        <span class="status-string">${item.injury_status}</span>
                    </div>
                </div>
            `;
        }).join('');
    }
    window.onload = loadDataset;
</script>
</body>
</html>
