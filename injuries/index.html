<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Injuries — Slate</title>
<meta name="theme-color" content="#141510">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141510; --panel:#1B1D15; --panel-hi:#24271C; --line:#33372A;
  --volt:#D8FF4D; --ink:#F4F3E9; --mute:#8B8F7A; --faint:#5C6050;
  --red:#FF6B5E; --orange:#D97A3D; --amber:#F2C14E;
  --r:20px; --r-sm:13px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh; max-width:520px; margin:0 auto; position:relative;
  padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(560px 320px at 10% -6%, rgba(216,255,77,.09), transparent 60%),
             radial-gradient(480px 300px at 108% 4%, rgba(217,122,61,.07), transparent 60%);
}
header{display:flex; align-items:center; gap:11px; padding:4px 2px 20px}
.back{
  width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);text-decoration:none;font-weight:700;flex:none;
  transition:transform .16s ease;
}
.back:active{transform:scale(.9)}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;flex:1;color:var(--ink)}
.refresh{
  width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;flex:none;color:var(--mute);padding:0;font-size:15px;
  transition:transform .2s, color .2s;
}
.refresh:active{transform:scale(.9)}
.refresh:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.refresh.spin{animation:spin .7s linear infinite;pointer-events:none;color:var(--volt)}
@keyframes spin{to{transform:rotate(360deg)}}
.updated{font-size:11.5px;font-weight:600;color:var(--faint);margin:-10px 0 16px 2px}

.tabs{display:flex;gap:7px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--mute);
  background:var(--panel);border:1px solid var(--line);border-radius:99px;
  padding:7px 15px;cursor:pointer;user-select:none;transition:all .15s;line-height:1.3;
}
.tab:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.tab.on{color:#161616;background:linear-gradient(135deg,#D8FF4D,#FFC93C);border-color:transparent;font-weight:800}

.team-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 15px; margin-bottom:11px; animation:rise .28s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.team-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.team-logo{width:24px;height:24px;object-fit:contain;flex:none}
.team-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;flex:1;color:var(--ink)}
.team-name .lg{color:var(--faint);font-weight:600;font-family:'Inter',sans-serif}
.team-count{
  font-family:'Archivo',sans-serif;font-style:italic;font-weight:800;font-size:13px;color:var(--volt);
  background:var(--panel-hi);border:1px solid var(--line);border-radius:99px;padding:3px 10px;
}

.p-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:9px 0;border-top:1px dashed var(--line)}
.p-row:first-of-type{border-top:none}
.p-left{min-width:0}
.p-name{font-weight:600;font-size:13.5px;color:var(--ink)}
.p-name .pos{color:var(--faint);font-weight:500}
.p-meta{font-size:11.5px;color:var(--mute);margin-top:2px}
.status{flex:none;font-size:10px;font-weight:800;letter-spacing:.04em;padding:4px 9px;
  border-radius:99px;white-space:nowrap;margin-top:1px}
.status.out{color:var(--red);background:rgba(255,107,94,.12);border:1px solid rgba(255,107,94,.3)}
.status.doubtful{color:var(--orange);background:rgba(217,122,61,.14);border:1px solid rgba(217,122,61,.32)}
.status.questionable, .status.day-to-day{color:var(--amber);background:rgba(242,193,78,.14);border:1px solid rgba(242,193,78,.32)}
.status.ir, .status.out-for-season{color:var(--red);background:rgba(255,107,94,.18);border:1px solid rgba(255,107,94,.4)}
.status.default{color:var(--mute);background:rgba(139,143,122,.14);border:1px solid rgba(139,143,122,.3)}

.empty{text-align:center;color:var(--mute);font-size:13px;padding:40px 10px}

@media (prefers-reduced-motion:reduce){
  .back, .refresh, .tab{transition:none}
  .team-card{animation:none}
  .refresh.spin{animation:none}
}
</style>
</head>
<body>
<header>
  <a class="back" href="../">←</a>
  <h1>Injuries</h1>
  <button class="refresh" id="refresh" aria-label="Refresh" title="Refresh">↻</button>
</header>
<div class="updated" id="updated">syncing…</div>

<div class="tabs" id="tabs">
  <div class="tab on" data-league="all">All</div>
  <div class="tab" data-league="nfl">NFL</div>
  <div class="tab" data-league="nba">NBA</div>
  <div class="tab" data-league="mlb">MLB</div>
  <div class="tab" data-league="nhl">NHL</div>
</div>

<div id="list"></div>

<script>
const rel = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
};

function statusClass(status){
  const s = (status || '').toLowerCase();
  if (s.includes('out for season') || s.includes('ir')) return 'out-for-season';
  if (s === 'out') return 'out';
  if (s.includes('doubtful')) return 'doubtful';
  if (s.includes('questionable')) return 'questionable';
  if (s.includes('day-to-day') || s.includes('day to day')) return 'day-to-day';
  return 'default';
}

let DATA = null;
let activeLeague = 'all';

function render(){
  const list = document.getElementById('list');
  if (!DATA){ list.innerHTML = '<div class="empty">No data yet.</div>'; return; }

  const leagues = activeLeague === 'all'
    ? DATA.leagues
    : DATA.leagues.filter(l => l.key === activeLeague);

  const teams = [];
  for (const lg of leagues) {
    for (const t of (lg.teams || [])) teams.push({ ...t, leagueLabel: lg.label });
  }

  if (!teams.length){
    list.innerHTML = '<div class="empty">No injuries reported right now.</div>';
    return;
  }

  list.innerHTML = teams.map(t => `
    <div class="team-card">
      <div class="team-head">
        ${t.logo ? `<img class="team-logo" src="${t.logo}" loading="lazy" onerror="this.remove()">` : ''}
        <div class="team-name">${t.team}${activeLeague === 'all' ? ` <span class="lg">· ${t.leagueLabel}</span>` : ''}</div>
        <div class="team-count">${t.players.length}</div>
      </div>
      ${t.players.map(p => `
        <div class="p-row">
          <div class="p-left">
            <div class="p-name">${p.name}${p.position ? ` <span class="pos">· ${p.position}</span>` : ''}</div>
            <div class="p-meta">${[p.location, p.detail].filter(Boolean).join(' — ') || '—'}</div>
          </div>
          <div class="status ${statusClass(p.status)}">${p.status || 'Unknown'}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function load(){
  fetch(`../data/injuries_slate.json?t=${Date.now()}`)
    .then(r => r.json())
    .then(d => {
      DATA = d;
      document.getElementById('updated').textContent =
        d.generated_at ? `Updated ${rel(d.generated_at)} · ${d.total_players ?? 0} players` : 'no data yet';
      render();
    })
    .catch(() => {
      document.getElementById('updated').textContent = 'no data yet';
      document.getElementById('list').innerHTML = '<div class="empty">Couldn\'t load injury data.</div>';
    });
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  tab.classList.add('on');
  activeLeague = tab.dataset.league;
  render();
});

const refreshBtn = document.getElementById('refresh');
refreshBtn.onclick = () => {
  refreshBtn.classList.add('spin');
  load();
  setTimeout(() => refreshBtn.classList.remove('spin'), 700);
};

load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');
</script>
</body>
</html>
