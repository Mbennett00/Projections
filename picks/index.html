<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projex — Bet Slip</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Neon on near-black, Sleeper-adjacent.

   The base is not flat: two low-opacity washes (violet top-left, teal
   bottom-right) sit over a near-black field so the page has depth without
   ever competing with content. Sharp where it counts -- the gradient is
   confined to the base and two hero elements, and everything else is quiet.

   Every outcome owns one neon hue and carries it through rail, badge and
   stat. Neon here means a saturated ink on a low-alpha bed of the same hue,
   plus a tight outer glow -- not a flood fill, which would smear at this
   density and cost legibility.
   --------------------------------------------------------------------------- */
:root{
  --void:#07080D; --panel:#101219; --panel-hi:#161923; --line:#242836;

  --win:#3DF08B; --loss:#FF4E6A; --push:#FFC65C; --pending:#3DD9F0;
  --violet:#7C5CFF;

  --ink:#F4F5F8; --mute:#8E93A3; --faint:#565C6E;
  --r:18px; --r-sm:12px;

  /* the one gradient the page is built around */
  --sheen:linear-gradient(115deg, var(--win) 0%, var(--pending) 48%, var(--violet) 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{
  background:var(--void); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh; display:flex; flex-direction:column; position:relative;
  padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}
/* Fixed so the wash never scrolls with content and stays a backdrop. */
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(680px 420px at -10% -10%, rgba(124,92,255,.22), transparent 62%),
    radial-gradient(620px 460px at 112% 4%,  rgba(61,217,240,.14), transparent 60%),
    radial-gradient(760px 520px at 50% 118%, rgba(61,240,139,.10), transparent 66%);
}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 16px;flex:none}
.head-left{display:flex;align-items:center;gap:11px}
.back-btn{
  width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);font-size:15px;text-decoration:none;flex:none;
}
.back-btn:active{transform:scale(.9)}
.wordmark{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1}
/* Gradient text needs a solid fallback: without one, a browser that can't
   clip a background to glyphs renders `color:transparent` literally and the
   text disappears. Colour first, gradient only where it's supported. */
.wordmark span{color:var(--win)}
.head-actions{display:flex;align-items:center;gap:6px}
.clear-btn{
  font-size:10.5px;font-weight:600;color:var(--faint);background:transparent;border:1px solid var(--line);
  border-radius:99px;padding:8px 11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;
}
#backup-btn{color:var(--pending);border-color:rgba(61,217,240,.32)}
.clear-btn:active{transform:scale(.95)}

/* record — one of only two places the gradient is allowed to show itself */
.record{
  position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 16px 14px; margin-bottom:14px; flex:none; overflow:hidden;
}
.record::before{
  content:''; position:absolute; inset:0 0 auto 0; height:2px; background:var(--sheen);
}
.record-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.rec-num{
  font-family:'Sora',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.035em;
  line-height:.95;font-variant-numeric:tabular-nums;color:var(--ink);
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .wordmark span, .rec-num{
    background:var(--sheen); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
}
.rec-lab{font-size:9.5px;color:var(--faint);font-weight:600;text-transform:uppercase;
  letter-spacing:.14em;font-family:'IBM Plex Mono',monospace;margin-top:7px}
.rec-stats{display:flex;gap:16px;text-align:right}
.rstat b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:16px;
  line-height:1.1;font-variant-numeric:tabular-nums}
.rstat span{font-size:8.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.rstat.pct b{color:var(--win); text-shadow:0 0 14px rgba(61,240,139,.45)}
.rstat.push b{color:var(--push); text-shadow:0 0 14px rgba(255,198,92,.4)}
.rstat.pend b{color:var(--pending); text-shadow:0 0 14px rgba(61,217,240,.4)}

/* Form strip: last results, oldest to newest, the way a form guide reads.
   A record of 12-9 hides a six-loss run; this doesn't. */
.form{display:flex;align-items:center;gap:4px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.form-lab{font-size:8px;color:var(--faint);font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin-right:4px;flex:none}
.form-dots{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;flex:1}
.fd{
  max-width:17px;height:17px;border-radius:5px;flex:1 1 0;display:grid;place-items:center;
  font-size:8px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--void);
}
.fd.win{background:var(--win); box-shadow:0 0 10px rgba(61,240,139,.5)}
.fd.loss{background:var(--loss); box-shadow:0 0 10px rgba(255,78,106,.45)}
.fd.push{background:var(--push); box-shadow:0 0 10px rgba(255,198,92,.42)}
.fd.pending{background:transparent;border:1px dashed var(--line);color:var(--faint);box-shadow:none}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;
  scrollbar-width:none;flex:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:11px;font-weight:600;color:var(--mute);white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 12px;
  cursor:pointer;font-family:'IBM Plex Mono',monospace;
}
.chip .n{color:var(--faint);margin-left:5px;font-size:10px}
.chip.on{
  color:var(--void); border-color:transparent; background:var(--sheen); font-weight:700;
  box-shadow:0 0 16px rgba(61,217,240,.28);
}
.chip.on .n{color:rgba(7,8,13,.62)}

/* day grouping */
/* ---- the ticket -----------------------------------------------------------
   A day's plays are one ticket. The notches and the perforated rule are the
   whole reason this reads as a slip rather than a list -- they sit exactly on
   the line dividing the legs from the stub, the way a real ticket tears.
   --------------------------------------------------------------------------- */
.ticket{
  position:relative; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; margin-bottom:14px; overflow:hidden;
}
.ticket-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px 10px; border-bottom:1px solid var(--line);
}
.ticket-date{
  font-size:9.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--mute); font-family:'IBM Plex Mono',monospace;
}
.ticket-count{
  font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--faint); font-family:'IBM Plex Mono',monospace;
}

/* legs, separated by perforations */
.leg{cursor:pointer; position:relative}
.leg + .leg{border-top:1px dashed var(--line)}
.leg::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--line);
}
.leg.win::before{background:var(--win); box-shadow:0 0 14px rgba(61,240,139,.55)}
.leg.loss::before{background:var(--loss); box-shadow:0 0 14px rgba(255,78,106,.5)}
.leg.push::before{background:var(--push); box-shadow:0 0 14px rgba(255,198,92,.45)}
.leg.pending::before{background:var(--pending); box-shadow:0 0 14px rgba(61,217,240,.45)}
.leg.open{background:var(--panel-hi)}
.leg-row{display:flex; align-items:center; gap:10px; padding:11px 13px 11px 15px}
.p-sport{
  font-size:8.5px;font-weight:700;letter-spacing:.07em;color:var(--mute);
  font-family:'IBM Plex Mono',monospace;text-transform:uppercase;flex:none;
  border:1px solid var(--line);border-radius:5px;padding:3px 5px;min-width:34px;text-align:center;
}
.p-main{flex:1;min-width:0}
.p-label{font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-detail{font-size:11px;color:var(--mute);line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* The price is the thing a slip is built around, so it gets the weight. */
.p-price{
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em; color:var(--ink); white-space:nowrap;
}
.p-price.plus{color:var(--win); text-shadow:0 0 12px rgba(61,240,139,.35)}
.p-price.minus{color:var(--ink)}
.p-proj{font-size:10.5px;color:var(--mute);font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}

.p-result{
  font-size:8.5px;font-weight:800;letter-spacing:.09em;font-family:'IBM Plex Mono',monospace;
  border-radius:5px;padding:3px 7px;text-transform:uppercase;border:1px solid;
}
.p-result.win{color:var(--win);background:rgba(61,240,139,.10);border-color:rgba(61,240,139,.45);
  box-shadow:0 0 12px rgba(61,240,139,.25), inset 0 0 10px rgba(61,240,139,.06)}
.p-result.loss{color:var(--loss);background:rgba(255,78,106,.10);border-color:rgba(255,78,106,.45);
  box-shadow:0 0 12px rgba(255,78,106,.22), inset 0 0 10px rgba(255,78,106,.06)}
.p-result.push{color:var(--push);background:rgba(255,198,92,.10);border-color:rgba(255,198,92,.45);
  box-shadow:0 0 12px rgba(255,198,92,.22), inset 0 0 10px rgba(255,198,92,.06)}
.p-result.pending{color:var(--pending);background:rgba(61,217,240,.09);border-color:rgba(61,217,240,.4);
  box-shadow:0 0 12px rgba(61,217,240,.2), inset 0 0 10px rgba(61,217,240,.05)}

.p-actions{display:none;gap:6px;padding:0 13px 11px 15px;align-items:center}
.leg.open .p-actions{display:flex}
.act{
  flex:1;font-size:10.5px;font-weight:700;padding:8px 0;border-radius:8px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;border:1px solid var(--line);background:transparent;color:var(--mute);
}
.act.win-a.on{background:rgba(61,240,139,.14);border-color:rgba(61,240,139,.5);color:var(--win);
  box-shadow:0 0 14px rgba(61,240,139,.25)}
.act.loss-a.on{background:rgba(255,78,106,.14);border-color:rgba(255,78,106,.5);color:var(--loss);
  box-shadow:0 0 14px rgba(255,78,106,.22)}
.act.push-a.on{background:rgba(255,198,92,.14);border-color:rgba(255,198,92,.5);color:var(--push);
  box-shadow:0 0 14px rgba(255,198,92,.22)}
.act:active{transform:scale(.97)}
.del{width:32px;height:32px;flex:none;border-radius:8px;background:transparent;border:1px solid var(--line);
  color:var(--faint);font-size:13px;cursor:pointer;display:grid;place-items:center}
.del:active{transform:scale(.9)}

/* the tear-off stub */
.stub{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 14px 13px; border-top:1px dashed var(--line); background:rgba(255,255,255,.012);
}
.stub::before, .stub::after{
  content:''; position:absolute; top:-9px; width:16px; height:16px; border-radius:50%;
  background:var(--void); border:1px solid var(--line);
}
.stub::before{left:-9px}
.stub::after{right:-9px}
.stub-l{font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);font-family:'IBM Plex Mono',monospace}
.stub-r{display:flex;align-items:baseline;gap:7px}
.stub-lab{font-size:8.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);font-family:'IBM Plex Mono',monospace}
.stub-odds{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;
  background:var(--sheen); -webkit-background-clip:text; background-clip:text; color:var(--pending);
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .stub-odds{color:transparent}
}
.stub-none{font-size:9.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace}

.empty{text-align:center;padding:56px 20px;color:var(--mute);flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px}
.empty .ico{font-size:32px;opacity:.45}
.empty .msg{font-size:13.5px;font-weight:600}
.empty .sub{font-size:11.5px;color:var(--faint);line-height:1.5;max-width:280px}
.empty a,.empty b{color:var(--win);text-decoration:none;font-weight:700}

.list{flex:1;margin-bottom:12px}
footer{margin-top:auto;text-align:center;font-size:10px;color:var(--faint);padding:6px 0 2px;
  font-family:'IBM Plex Mono',monospace;flex:none}

*:focus-visible{outline:2px solid var(--pending); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<header>
  <div class="head-left">
    <a class="back-btn" href="../" aria-label="Back to boards">←</a>
    <div class="wordmark">Bet <span>Slip</span></div>
  </div>
  <div class="head-actions">
    <button class="clear-btn" id="backup-btn" title="Download a backup of every play">Backup</button>
    <button class="clear-btn" id="restore-btn" title="Restore from a backup file">Restore</button>
    <button class="clear-btn" id="clear-btn">Clear</button>
  </div>
  <input type="file" id="restore-file" accept="application/json,.json" hidden>
</header>

<div class="record">
  <div class="record-top">
    <div>
      <div class="rec-num" id="rec-num">0–0</div>
      <div class="rec-lab">Settled record</div>
    </div>
    <div class="rec-stats">
      <div class="rstat pct"><b id="rec-pct">—</b><span>Win %</span></div>
      <div class="rstat push"><b id="rec-push">0</b><span>Push</span></div>
      <div class="rstat pend"><b id="rec-pending">0</b><span>Open</span></div>
    </div>
  </div>
  <div class="form" id="form-strip"></div>
</div>

<div class="filters" id="filters"></div>
<div class="list" id="list"></div>

<footer>Slip is stored on this device only</footer>

<script src="../picks.js"></script>
<script>
// If picks.js didn't load or parse, this page has no store to read. Say so
// plainly rather than showing an empty tracker, which reads as "no plays yet"
// and would have someone hunting for data that was never unavailable.
if (typeof Picks === 'undefined') {
  document.addEventListener('DOMContentLoaded', () => {
    const l = document.getElementById('list');
    if (l) l.innerHTML = '<div class="empty"><div class="ico">\u26a0\ufe0f</div>' +
      '<div class="msg">Tracker unavailable</div>' +
      '<div class="sub">picks.js failed to load \u2014 your saved plays are safe, ' +
      'this page just can\'t read them right now.</div></div>';
  });
  throw new Error('picks.js unavailable');
}

let activeFilter = 'all';
let openId = null;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function dayLabel(iso){
  const d = new Date(iso);
  if (isNaN(d)) return 'Earlier';
  const today = new Date(), y = new Date(Date.now() - 864e5);
  const same = (a,b) => a.toDateString() === b.toDateString();
  if (same(d,today)) return 'Today';
  if (same(d,y)) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function renderForm(all){
  const el = document.getElementById('form-strip');
  if (!all.length){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  // Oldest to newest left-to-right, matching how a form guide reads.
  const recent = all.slice(0, 15).reverse();
  el.innerHTML = '<span class="form-lab">Form</span><div class="form-dots">' +
    recent.map(p => {
      const r = p.result || 'pending';
      const ch = r === 'win' ? 'W' : r === 'loss' ? 'L' : r === 'push' ? 'P' : '·';
      return `<span class="fd ${r}" title="${esc(p.label)}">${ch}</span>`;
    }).join('') + '</div>';
}

function renderFilters(all){
  const counts = {
    all: all.length,
    pending: all.filter(p => p.result === null).length,
    win: all.filter(p => p.result === 'win').length,
    loss: all.filter(p => p.result === 'loss').length,
    push: all.filter(p => p.result === 'push').length,
  };
  const defs = [['all','All'],['pending','Open'],['win','Won'],['loss','Lost'],['push','Push']];
  document.getElementById('filters').innerHTML = defs.map(([k,label]) =>
    `<div class="chip ${activeFilter===k?'on':''}" data-filter="${k}">${label}<span class="n">${counts[k]}</span></div>`
  ).join('');
}

// A slip is built around prices, so pull the American odds out of the line
// when there is one. Game markets store "-126 · FanDuel · 54% model"; player
// props store a projection like "1.62" and have no price at all.
function priceOf(p){
  const m = /^\s*([+-]\d{3,4})\b/.exec(p.line || '');
  return m ? parseInt(m[1], 10) : null;
}
function projOf(p){
  return priceOf(p) === null ? (p.line || '') : '';
}
// Still needed for the leg price even though the parlay stub is gone -- it
// went out with the parlay helpers on the first pass and broke the page.
const fmtAm = a => (a > 0 ? '+' : '') + a;
// A book shows you who you backed, not just the words. Picks logged from a
// game card carry a team logo; player props don't, so those fall back to
// initials on a tinted disc rather than an empty slot.
function initials(name){
  return String(name||'').trim().split(/\s+/).slice(0,2)
    .map(w => w[0] || '').join('').toUpperCase() || '?';
}
function legArt(p){
  const sport = esc((p.sport||'').toUpperCase());
  if (p.logo){
    return `<span class="leg-art"><img src="${esc(p.logo)}" alt="" loading="lazy"
             onerror="this.parentNode.className='leg-art leg-ini';this.parentNode.textContent='${esc(initials(p.label))}'"></span>
            <span class="p-sport">${sport}</span>`;
  }
  return `<span class="leg-art leg-ini">${esc(initials(p.label))}</span>
          <span class="p-sport">${sport}</span>`;
}

function render(){
  const all = Picks.all();
  const s = Picks.stats(all);

  document.getElementById('rec-num').textContent = `${s.wins}\u2013${s.losses}`;
  document.getElementById('rec-pct').textContent = s.pct === null ? '\u2014' : `${s.pct}%`;
  document.getElementById('rec-push').textContent = all.filter(p => p.result === 'push').length;
  document.getElementById('rec-pending').textContent = all.filter(p => p.result === null).length;
  renderForm(all);
  renderFilters(all);

  const list = document.getElementById('list');
  const filtered = activeFilter === 'all' ? all
    : activeFilter === 'pending' ? all.filter(p => p.result === null)
    : all.filter(p => p.result === activeFilter);

  if (!filtered.length){
    list.innerHTML = `
      <div class="empty">
        <div class="ico">${all.length ? '\u{1F50E}' : '\u{1F9FE}'}</div>
        <div class="msg">${all.length ? 'Nothing here yet' : 'Slip is empty'}</div>
        <div class="sub">${all.length
          ? 'Try another filter above.'
          : 'Tap the <b>+</b> on any player row or game card to add a leg.'}</div>
      </div>`;
    return;
  }

  // One ticket per day: the legs you took together, with a stub underneath.
  const days = [];
  for (const p of filtered){
    const d = dayLabel(p.loggedAt);
    if (!days.length || days[days.length-1].day !== d) days.push({day:d, legs:[]});
    days[days.length-1].legs.push(p);
  }

  list.innerHTML = days.map(({day, legs}) => {
    const rec = {
      win: legs.filter(l => l.result === 'win').length,
      loss: legs.filter(l => l.result === 'loss').length,
    };
    const legHtml = legs.map(p => {
      const r = p.result || 'pending';
      const price = priceOf(p), proj = projOf(p);
      const open = p.id === openId;
      return `
      <div class="leg ${r} ${open?'open':''}" data-id="${esc(p.id)}">
        <div class="leg-row">
          ${legArt(p)}
          <div class="p-main">
            <div class="p-label">${esc(p.label)}</div>
            ${p.detail ? `<div class="p-detail">${esc(p.detail)}</div>` : ''}
          </div>
          <div class="p-right">
            ${price !== null
              ? `<span class="p-price ${price > 0 ? 'plus':'minus'}">${fmtAm(price)}</span>`
              : (proj ? `<span class="p-proj">${esc(proj)}</span>` : '')}
            <span class="p-result ${r}">${r === 'pending' ? 'Open' : esc(r)}</span>
          </div>
        </div>
        <div class="p-actions">
          <button class="act win-a ${r==='win'?'on':''}" data-result="win">Won</button>
          <button class="act loss-a ${r==='loss'?'on':''}" data-result="loss">Lost</button>
          <button class="act push-a ${r==='push'?'on':''}" data-result="push">Push</button>
          <button class="del" aria-label="Remove leg">\u2715</button>
        </div>
      </div>`;
    }).join('');

    return `
      <div class="ticket">
        <div class="ticket-head">
          <span class="ticket-date">${esc(day)}</span>
          <span class="ticket-count">${legs.length} leg${legs.length>1?'s':''} \u00b7 ${rec.win}\u2013${rec.loss}</span>
        </div>
        ${legHtml}

      </div>`;
  }).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeFilter = chip.dataset.filter;
  openId = null;
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const row = e.target.closest('.leg');
  if (!row) return;
  const id = row.dataset.id;

  const btn = e.target.closest('[data-result]');
  if (btn){
    const cur = Picks.all().find(p => p.id === id);
    Picks.setResult(id, cur && cur.result === btn.dataset.result ? null : btn.dataset.result);
    openId = null;           // settling closes the row; the job is done
    render();
    return;
  }
  if (e.target.closest('.del')){
    Picks.remove(id);
    openId = null;
    render();
    return;
  }
  openId = (openId === id) ? null : id;
  render();
});

// Backup / restore. Picks survive a deploy, but not a website-data clear --
// and clearing is the standard fix for a stuck service worker. Without an
// export, routine maintenance costs you the history.
document.getElementById('backup-btn').addEventListener('click', () => {
  const n = Picks.count();
  if (!n){ alert('Nothing to back up yet.'); return; }
  const blob = new Blob([Picks.exportAll()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `projex-picks-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
});

document.getElementById('restore-btn').addEventListener('click', () =>
  document.getElementById('restore-file').click());

document.getElementById('restore-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const r = Picks.importAll(String(reader.result || ''));
    if (!r.ok){ alert(r.error); return; }
    openId = null;
    render();
    alert(r.added
      ? `Restored ${r.added} play${r.added===1?'':'s'}.` +
        (r.skipped ? ` ${r.skipped} already here.` : '') +
        `\nSlip now holds ${r.total}.`
      : 'Everything in that file was already on your slip.');
  };
  reader.onerror = () => alert("Couldn't read that file.");
  reader.readAsText(file);
  e.target.value = '';       // let the same file be picked again
});

document.getElementById('clear-btn').addEventListener('click', () => {
  if (!Picks.all().length) return;
  if (confirm('Clear the whole slip? This can\u2019t be undone \u2014 use Backup first if you want to keep the record.')){
    Picks.clearAll();
    openId = null;
    render();
  }
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js');
</script>
</body>
</html>
