<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slate — Projections</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07080D; --surface:#101219; --surface-2:#161923; --line:#242836;
  --green:#3DF08B; --cyan:#3DD9F0; --violet:#7C5CFF; --amber:#FFC65C; --red:#FF4E6A;
  --ink:#F4F5F8; --mute:#8E93A3; --faint:#7C8296;
  --nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{
  background:var(--void);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh;max-width:560px;margin:0 auto;position:relative;
  padding:max(12px,env(safe-area-inset-top)) 14px
          calc(var(--nav-h) + max(16px,env(safe-area-inset-bottom)));
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at -10% -10%, rgba(124,92,255,.20), transparent 62%),
    radial-gradient(620px 460px at 112% 4%, rgba(61,217,240,.13), transparent 60%),
    radial-gradient(760px 520px at 50% 118%, rgba(61,240,139,.09), transparent 66%);
}

/* ── top bar ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 16px}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--green),var(--cyan) 55%,var(--violet));
  font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:var(--void)}
.brand h1{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em}
.top-actions{display:flex;align-items:center;gap:7px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-size:14px;cursor:pointer;text-decoration:none;flex:none}
.icon-btn:active{transform:scale(.9)}
.league{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:99px;padding:8px 12px;cursor:pointer}

/* ── shared ── */
h2{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:20px 0 10px;display:flex;
  align-items:center;justify-content:space-between}
h2 a{color:var(--cyan);text-decoration:none;font-size:9.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.muted{color:var(--mute)}

/* ── explore list ── */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
  color:var(--mute);background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.f.on{color:var(--void);border-color:transparent;background:var(--violet);font-weight:800}

/* Row is stacked, not a table -- a real phone gives a name maybe 130px if it
   has to share a line with an avatar, a projection AND a confidence ring.
   Only the confidence ring shares the top line with the name; everything
   else gets its own row so nothing is ever squeezed into a corner. */
.row{padding:11px 13px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.row:active{background:var(--surface-2)}

.row-top{display:flex;align-items:center;gap:10px}
.who-mkt{color:var(--faint)}

.row-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.row-tags .tag{font-size:7.5px;padding:2px 5px}

.row-foot{display:flex;align-items:center;gap:8px;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.row-foot .pv{flex:1;display:flex;align-items:baseline;gap:5px}
.row-foot .pv b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.row-foot .pv span{font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;margin-top:1px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;color:var(--cyan)}
.av img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who-n{font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-m{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mute);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-n{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14.5px;
  font-variant-numeric:tabular-nums}
.pv-l{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--faint);margin-top:2px}
.eg{flex:none}
.cf{flex:none}
.cf-r{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;
  border:2px solid var(--c,var(--green));color:var(--c,var(--green))}
.star{width:26px;flex:none;text-align:center;font-size:14px;color:var(--line);cursor:pointer;line-height:1}
.star.on{color:var(--amber);text-shadow:0 0 10px rgba(255,198,92,.5)}

/* ── detail sheet ── */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(7,8,13,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
  background:var(--void);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--line);padding:8px 14px max(20px,env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-av{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--cyan)}
.sh-av img{width:100%;height:100%;object-fit:cover}
.sh-n{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.sh-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:3px}
.sh-score{margin-left:auto;text-align:center;flex:none;padding:8px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--c,var(--green)) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--green)) 38%,transparent)}
.sh-score b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:21px;color:var(--c,var(--green))}
.sh-score span{font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.hero{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;
  background:linear-gradient(160deg,rgba(124,92,255,.12),rgba(61,217,240,.05) 60%,transparent);
  border:1px solid var(--line);margin-bottom:9px}
.hero-n{font-family:'Sora',sans-serif;font-weight:800;font-size:32px;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hero-l{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.hero-c{text-align:center;flex:none;min-width:54px}
.hero-c b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums}

.cells{display:flex;gap:6px;margin-bottom:9px}
.cell{flex:1;min-width:0;text-align:center;padding:10px 5px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line)}
.cell b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums}
.cell span{display:block;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

.rings{display:flex;gap:6px}
.ring{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative}
.ring-v{position:absolute;top:24px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px}
.ring-l{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.notes{padding:12px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;line-height:1.6;color:var(--mute)}
.notes b{color:var(--ink);font-weight:600}

/* ── bottom nav ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:70;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,14,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;align-items:stretch}
.nav-in{max-width:560px;margin:0 auto;width:100%;display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;cursor:pointer;color:var(--faint);font-family:inherit;padding:0}
.nb i{font-style:normal;font-size:17px;line-height:1}
.nb span{font-size:9px;font-weight:600;letter-spacing:.02em}
.nb.on{color:var(--green)}
.nb.on i{filter:drop-shadow(0 0 7px rgba(61,240,139,.55))}

/* ── logos ──
   Team marks sit inline with text at cap height. Every one degrades to its
   abbreviation rather than a broken-image icon, because a slate with four
   missing logos should still read cleanly. */
.tm{display:inline-block;vertical-align:-2px;object-fit:contain;flex:none}
.tm-t{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  color:var(--faint);letter-spacing:.03em}

.who-m .vs{color:var(--faint);font-size:9.5px;margin:0 1px}

.sh-m .vs{color:var(--faint)}

.av-logo{width:22px;height:22px;object-fit:contain}

.league .lg{object-fit:contain;flex:none}
.upd-badge img{object-fit:contain}

/* ── run status ── */
.run-status{max-height:0;overflow:hidden;opacity:0;transition:max-height .2s,opacity .2s;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-align:center;
  color:var(--green);border-radius:10px}
.run-status.show{max-height:60px;opacity:1;padding:9px 11px;margin-bottom:11px;
  background:rgba(61,240,139,.10);border:1px solid rgba(61,240,139,.35)}
.run-status.bad{color:var(--amber);background:rgba(255,198,92,.10);border-color:rgba(255,198,92,.35)}
#refresh.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pr-mb{flex:none;min-width:52px;padding:5px 8px}
.pr-mb .mb-l{font-size:9px}
.pr-mb .mb-p{font-size:11.5px}

.gc-edge{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace}
.gc-edge i{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.gc-edge b{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.gc-badges .gc-edge{margin-left:auto}
.gt{display:flex;align-items:center;gap:9px;padding:6px 0}
.gc-bar{height:5px;border-radius:99px;overflow:hidden;margin:8px 0 11px;background:var(--violet)}
.gc-bar div{height:100%;border-radius:99px}
.gc-stats span[title]{cursor:help;border-bottom:1px dotted var(--line)}

/* ── market badges: every priced side, one clean row ── */
.mkts{display:flex;gap:6px;flex-wrap:wrap;padding-top:11px;margin-top:2px;border-top:1px solid var(--line)}
.mb{flex:1 1 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 9px;border-radius:9px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.mb-l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.03em;
  color:var(--mute);white-space:nowrap}
.mb-p{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.mb.on{background:var(--green);border-color:var(--green)}
.mb.on .mb-l,.mb.on .mb-p{color:var(--void)}
.mb:active{transform:scale(.96)}

/* ── nfl advanced chips ── */
.adv-row{display:flex;align-items:stretch;gap:5px;flex-wrap:nowrap;margin-bottom:9px}
.adv-chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:7px 4px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line)}
.adv-chip i{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.adv-chip b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--cyan)}
.adv-factor{flex:none;align-self:stretch;display:flex;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:11px;padding:0 10px;
  border-radius:8px;color:var(--mute);background:var(--surface);border:1px solid var(--line)}
.adv-factor.up{color:var(--green);background:rgba(61,240,139,.11);border-color:rgba(61,240,139,.42)}
.adv-factor.dn{color:var(--red);background:rgba(255,78,106,.11);border-color:rgba(255,78,106,.42)}

/* ── tags, edge pills, distribution, game cards ── */
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.06em;
  padding:2px 5px;border-radius:4px;border:1px solid;white-space:nowrap;
  box-shadow:0 0 9px -3px currentColor}
.sheet-tags{margin:0 0 9px}

.epill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:10.5px;
  padding:3px 6px;border-radius:5px;border:1px solid;font-variant-numeric:tabular-nums}
.thead .c3{width:56px;text-align:right}

.dist{padding:11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
.dist-svg{width:100%;height:90px;display:block}
.fmc{display:flex;gap:6px;margin-top:10px}
.fmc-c{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:var(--surface-2)}
.fmc-c b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums}
.fmc-c span{display:block;margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;
  font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.gc{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px;margin-bottom:9px}
.gc.dim{opacity:.42}
.gc.live{border-color:rgba(255,78,106,.30)}
.gc-h{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}
.gc-m{display:flex;align-items:center;gap:5px;font-family:'Sora',sans-serif;font-weight:700;font-size:13px}
.gc-m .vs{color:var(--faint);font-weight:600}
.gc-state{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.07em;
  padding:4px 9px;border-radius:6px;border:1px solid;white-space:nowrap}
/* Header now carries only the state pill; tier + edge moved to a shared
   row at the bottom of the card, side by side, each with its team's logo. */
.gc-badges{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.tier-pill{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace}
.tier-pill b{font-size:11px;font-weight:800;letter-spacing:.06em}

.gt-n{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--mute)}
.gt-n.fav{color:var(--ink);font-weight:700}
.gt-s{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;width:42px;text-align:right}
.gt-w{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mute);
  width:38px;text-align:right;font-variant-numeric:tabular-nums}

.gc-bar div{height:100%;background:var(--green);border-radius:99px}
.gc-stats{display:flex;gap:14px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.gc-stats span{display:flex;align-items:baseline;gap:5px}
.gc-stats i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.gc-stats b{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.gc-meta{margin-top:9px;font-size:10.5px;color:var(--faint);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.empty .i{font-size:30px;opacity:.4;margin-bottom:9px}
.empty .m{font-size:13px;font-weight:600}
.empty .s{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5}
.view{display:none}
.view.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="mark">S</div>
    <h1>Slate</h1>
  </div>
  <div class="top-actions">
    <button class="league" id="league-btn">MLB ▾</button>
    <a class="icon-btn" href="./how/" aria-label="How the models work">?</a>
    <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
  </div>
</div>

<div class="run-status" id="run-status"></div>
<div class="view" id="v-explore"></div>
<div class="view on" id="v-games"></div>

<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<nav><div class="nav-in">
  <button class="nb on" data-v="games"><i>◍</i><span>Games</span></button>
  <button class="nb" data-v="explore"><i>⌕</i><span>Props</span></button>
  <a class="nb" href="./how/"><i>?</i><span>How</span></a>
</div></nav>

<script src="./picks.js"></script>
<script>
// picks.js is still loaded for RUN_TRIGGER_URL, which the refresh button uses
// to kick off a fresh model run. The bet-slip store it also defines is no
// longer used here -- this app is projections and props only.

// ── team identity ──────────────────────────────────────────────────────────
// Lifted verbatim from the boards, where these maps are already proven against
// live data. MLB needs a club id for its logo CDN; the other three key off the
// abbreviation directly.
const MLB_TEAMID = {"ARI":109,"ATH":133,"ATL":144,"BAL":110,"BOS":111,"CHC":112,"CWS":145,"CIN":113,"CLE":114,"COL":115,"DET":116,"HOU":117,"KC":118,"LAA":108,"LAD":119,"MIA":146,"MIL":158,"MIN":142,"NYM":121,"NYY":147,"PHI":143,"PIT":134,"SD":135,"SF":137,"SEA":136,"STL":138,"TB":139,"TEX":140,"TOR":141,"WSH":120};

function teamLogo(sp, abbr){
  if (!abbr) return '';
  if (sp === 'mlb'){
    const id = MLB_TEAMID[abbr];
    return id ? `https://www.mlbstatic.com/team-logos/${id}.svg` : '';

  return path ? `https://a.espncdn.com/i/teamlogos/${path}/500/${abbr.toLowerCase()}.png` : '';
}

// A logo that degrades to the abbreviation rather than a broken image icon.
function teamMark(sp, abbr, size){
  const src = teamLogo(sp, abbr);
  const sz = size || 16;
  return src
    ? `<img class="tm" src="${src}" alt="${esc(abbr)}" loading="lazy" width="${sz}" height="${sz}"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'tm-t',textContent:'${esc(abbr)}'}))">`

/* ── watchlist ─────────────────────────────────────────────────────────────
   Kept separate from the bet slip on purpose. A watchlist is "show me this
   again"; the slip is "I backed this". Merging them would make the record
   meaningless. */
const WKEY = 'slate_watchlist_v1';
const watch = {
  all: () => { try { return JSON.parse(localStorage.getItem(WKEY)) || []; } catch(e){ return []; } },
  has: k => watch.all().includes(k),
  toggle(k){
    const a = watch.all(), i = a.indexOf(k);
    if (i >= 0) a.splice(i,1); else a.push(k);
    try { localStorage.setItem(WKEY, JSON.stringify(a)); } catch(e){}
    return i < 0;
  },
};

/* ── market definitions per sport ── */
const MARKETS = {
  mlb: [
    ['H+R+RBI', p=>p.expected_hrr, 2], ['Total Bases', p=>p.expected_tb, 2],
    ['Hits', p=>p.expected_hits, 2], ['Home Runs', p=>p.expected_hr, 2],
    ['RBI', p=>p.expected_rbi, 2], ['Runs', p=>p.expected_runs, 2],
  ],
  nfl: [
    ['Rec Yds', p=>p.rec_yds, 0], ['Rush Yds', p=>p.rush_yds, 0],
    ['Targets', p=>p.targets, 1], ['Anytime TD', p=>p.td_prob, 2],
  ],
  nhl: [
    ['Shots', p=>p.shots_pg, 1], ['Points', p=>p.pts_pg, 2], ['Goals', p=>p.goal_prob, 2],
  ],
  nba: [
    ['Points', p=>p.pts, 1], ['Rebounds', p=>p.reb, 1],
    ['Assists', p=>p.ast, 1], ['3-Pointers', p=>p.tpm, 1],

const POOLS = {

  nhl: ['away_skaters','home_skaters'], nba: ['away_players','home_players'],

function headshot(sp, p){
  if (!p.player_id) return '';
  if (sp === 'mlb') return `https://midfield.mlbstatic.com/v1/people/${p.player_id}/spots/60`;
  const path = {nfl:'nfl', nhl:'nhl', nba:'nba'}[sp];
  return `https://a.espncdn.com/i/headshots/${path}/players/full/${p.player_id}.png`;
}
const initials = n => String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';

// Headshot first, then the team logo, then initials. A missing portrait
// shouldn't leave a grey disc where every other row has a face.
function avatar(sp, p, cls){
  const src = headshot(sp, p);
  const logo = teamLogo(sp, p._tab || teamAbbr(sp, p._team));
  const fallback = logo
    ? `<img src='${logo}' alt='' loading='lazy' class='av-logo'>`
    : initials(p.name);
  return src
    ? `<span class="${cls}"><img src="${src}" alt="" loading="lazy"
         onerror="this.outerHTML=&quot;${fallback.replace(/"/g,'&quot;')}&quot;"></span>`
    : `<span class="${cls}">${fallback}</span>`;
}

/* ── player tags ───────────────────────────────────────────────────────────
   The same archetypes the classic boards assign, on the same thresholds, so a
   player reads identically in both places. Each keeps its own hue -- the tag
   colour IS the information, which is why they aren't flattened to one accent. */
function tagsFor(p){
  const t = [];
  if (p._sp === 'mlb'){
    if ((p.hr_prob ?? 0) >= .07) t.push(['HR THREAT','#FF6B84']);
    if ((p.xwoba ?? 0) >= .380) t.push(['BARREL KING','#FFE24A']);
    if ((p.offense_quality ?? 0) >= 75) t.push(['HARD HIT','#FF9A3D']);
    if ((p.k_rate ?? 1) <= .15) t.push(['CONTACT','#3DE8D0']);
    if ((p.order ?? 9) === 4) t.push(['CLEANUP','#9B7CFF']);
    if ((p.order ?? 9) <= 2 && (p.hit_rate ?? 0) >= .26) t.push(['TABLE SETTER','#3DF08B']);
  } else if (p._sp === 'nfl'){
    if ((p.td_prob ?? 0) >= .45) t.push(['RED ZONE','#FF6B84']);
    if ((p.targets ?? 0) >= 7) t.push(['TARGET HOG','#3DD9F0']);
    if ((p.rush_att ?? 0) >= 15) t.push(['BELLCOW','#FF9A3D']);
    if ((p.rec_yds ?? 0) >= 70) t.push(['WR1','#3DF08B']);
    if ((p.opp_factor ?? 1) >= 1.05) t.push(['HIGH USAGE','#FFE24A']);
  } else if (p._sp === 'nhl'){
    if ((p.goal_prob ?? 0) >= .45) t.push(['SNIPER','#FFE24A']);
    if ((p.shots_pg ?? 0) >= 3.5) t.push(['VOLUME','#FF9A3D']);
    if ((p.pts_pg ?? 0) >= 1.0) t.push(['TOP LINE','#3DF08B']);
  } else if (p._sp === 'nba'){
    if ((p.pts ?? 0) >= 25) t.push(['BUCKET GETTER','#3DF08B']);
    if ((p.reb ?? 0) >= 10) t.push(['GLASS CLEANER','#3DE8D0']);
    if ((p.ast ?? 0) >= 7) t.push(['FLOOR GENERAL','#9B7CFF']);
    if ((p.tpm ?? 0) >= 3) t.push(['SNIPER','#FFE24A']);
    if ((p.min ?? 0) >= 34) t.push(['WORKHORSE','#FF9A3D']);
  }
  if (p.matchup_grade && /^A/.test(p.matchup_grade)) t.push(['SMASH SPOT','#3DF08B']);
  return t;
}
const tagHtml = t => t.map(([l,c]) =>
  `<span class="tag" style="color:${c};background:${c}18;border-color:${c}55">${l}</span>`).join('');

/* ── edge vs the market ────────────────────────────────────────────────────
   Only computed against a REAL book price. MLB carries prop lines when FanDuel
   has posted them; everything else has no market to measure against, and an
   edge against an assumed price is a number nobody should act on. */
const PROP_LABEL = {
  'H+R+RBI':'H+R+RBI', 'Total Bases':'Total Bases', 'Hits':'Hits',
  'Home Runs':'Home Run', 'RBI':'RBI',
};
function edgeOf(p){
  const g = p._game, want = PROP_LABEL[p._market];
  if (!g || !want) return null;
  for (const pl of (g.prop_plays || []))
    if (pl.name === p.name && pl.market === want && pl.book_src === 'FanDuel')
      return { edge: pl.edge, line: pl.line, side: pl.side, odds: pl.book_odds };
  return null;
}
const APP_EDGE_BANDS = [
  [2,   '#8A8D93', 'inside the noise'],
  [4,   '#3DF08B', 'plausible size for a real edge'],
  [8,   '#FFC65C', 'unusually big \u2014 worth a look'],
  [1e9, '#FF4E6A', 'implausible \u2014 likely a stale line'],
];
// Named apart from picks.js's edgeBand so neither shadows the other. Same
// bands, but this one returns the note too, for the pill tooltip.
function appEdgeBand(v){
  const a = Math.abs(v || 0);
  return APP_EDGE_BANDS.find(b => a < b[0]) || APP_EDGE_BANDS[APP_EDGE_BANDS.length-1];
}
function edgePill(e){
  if (!e || e.edge == null) return '';
  const [, col, note] = appEdgeBand(e.edge);
  return `<span class="epill" style="color:${col};background:${col}1A;border-color:${col}55"
    title="${note}">${e.edge > 0 ? '+' : ''}${e.edge.toFixed(1)}%</span>`;
}

/* ── distribution: floor, median, ceiling ──────────────────────────────────
   A single projection hides its own uncertainty. Counting stats behave close
   enough to Poisson to draw a real distribution; continuous ones (yards,
   points) use a normal with a sport-typical spread. The curve is the honest
   part -- two players can share a median and have completely different floors. */
function poisPmf(k, l){
  if (l <= 0) return k === 0 ? 1 : 0;
  let lf = 0; for (let i = 2; i <= k; i++) lf += Math.log(i);
  return Math.exp(-l + k * Math.log(l) - lf);
}
function distribution(p){
  const v = p._val;
  const counting = p._dp >= 2 || v < 12;
  const pts = [];
  if (counting){
    const max = Math.max(4, Math.ceil(v * 3));
    for (let k = 0; k <= max; k++) pts.push([k, poisPmf(k, v)]);
  } else {
    const sd = Math.max(1, v * 0.42);
    for (let i = -3; i <= 3; i += 0.25){
      const x = v + i * sd;
      if (x < 0) continue;
      pts.push([x, Math.exp(-0.5 * i * i)]);
    }
    const tot = pts.reduce((a,b)=>a+b[1],0) || 1;
    pts.forEach(pt => pt[1] /= tot);
  }
  // percentiles off the cumulative curve
  let cum = 0; const q = {};
  for (const [x, pr] of pts){
    const prev = cum; cum += pr;
    for (const t of [0.25, 0.5, 0.9]) if (q[t] == null && cum >= t && prev < t) q[t] = x;
  }
  return { pts, floor: q[0.25] ?? 0, med: q[0.5] ?? v, ceil: q[0.9] ?? v };
}
function distChart(p){
  const d = distribution(p);
  const maxP = Math.max(...d.pts.map(x => x[1])) || 1;
  const W = 300, H = 90;
  const xs = d.pts.map(x => x[0]);
  const lo = Math.min(...xs), hi = Math.max(...xs) || 1;
  const sx = x => ((x - lo) / (hi - lo || 1)) * W;
  const sy = pr => H - (pr / maxP) * (H - 8);
  const line = d.pts.map(([x,pr],i) => `${i?'L':'M'}${sx(x).toFixed(1)},${sy(pr).toFixed(1)}`).join(' ');
  const area = `${line} L${W},${H} L0,${H} Z`;
  const mark = (x, col, w) =>
    `<line x1="${sx(x).toFixed(1)}" y1="4" x2="${sx(x).toFixed(1)}" y2="${H}"
       stroke="${col}" stroke-width="${w}" stroke-dasharray="${w>1?'':'3 3'}" opacity="${w>1?1:.7}"/>`;
  const fmt = n => p._dp >= 2 ? n.toFixed(1) : n.toFixed(0);
  return `<div class="dist">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="dist-svg">
      <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3DD9F0" stop-opacity=".38"/>
        <stop offset="100%" stop-color="#3DD9F0" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#dg)"/>
      <path d="${line}" fill="none" stroke="#3DD9F0" stroke-width="2" stroke-linejoin="round"/>
      ${mark(d.floor, '#FF9A3D', 1)}${mark(d.med, '#3DF08B', 2)}${mark(d.ceil, '#9B7CFF', 1)}
    </svg>
    <div class="fmc">
      <div class="fmc-c"><b style="color:#FF9A3D">${fmt(d.floor)}</b><span>Floor</span></div>
      <div class="fmc-c"><b style="color:#3DF08B">${fmt(d.med)}</b><span>Median</span></div>
      <div class="fmc-c"><b style="color:#9B7CFF">${fmt(d.ceil)}</b><span>Ceiling</span></div>
    </div>
  </div>`;
}

/* ── build a flat, ranked list of every projection for a sport ── */
function players(sp){
  const d = DATA[sp];
  if (!d || !d.games) return [];
  const defs = MARKETS[sp] || [];
  const m = defs.find(x => x[0] === market) || defs[0];
  if (!m) return [];
  const out = [];
  for (const g of d.games){
    if (g.game_state === 'Final') continue;
    for (const pool of POOLS[sp]){
      const away = pool.startsWith('away');
      const team = sp === 'mlb' || sp === 'nfl'
        ? (away ? g.away_team : g.home_team) : (away ? g.away_abbr : g.home_abbr);
      const opp = sp === 'mlb' || sp === 'nfl'
        ? (away ? g.home_team : g.away_team) : (away ? g.home_abbr : g.away_abbr);
      for (const p of (g[pool] || [])){
        const v = m[1](p);
        if (v == null || isNaN(v)) continue;
        out.push({...p, _sp:sp, _team:team, _opp:opp,
                  _tab:teamAbbr(sp, team), _oab:teamAbbr(sp, opp),
                  _market:m[0], _val:v, _dp:m[2],
                  _key:`${sp}|${m[0]}|${p.name}`, _game:g});
      }
    }
  }
  out.sort((a,b) => b._val - a._val);
  return out;
}

/* Confidence: a transparent composite, not a black box. Percentile within the
   slate, nudged by the matchup grade the model already assigns. */
function confOf(p, arr){
  const i = arr.indexOf(p);
  const pct = arr.length > 1 ? 1 - (i / (arr.length - 1)) : 1;
  let s = 45 + pct * 45;
  const g = (p.matchup_grade || '')[0];
  if (g === 'A') s += 8; else if (g === 'B') s += 3; else if (g === 'D') s -= 6;
  return Math.max(1, Math.min(99, Math.round(s)));
}
const confColor = s => s >= 80 ? '#3DF08B' : s >= 65 ? '#3DD9F0' : s >= 50 ? '#FFC65C' : '#FF4E6A';

function ring(v, pct, label, color, size){
  const sz = size || 52, r = sz/2 - 4, c = 2*Math.PI*r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<div class="ring">
    <svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 ${sz/2} ${sz/2})"/>
    </svg>
    <div class="ring-v" style="color:${color}">${v}</div>
    <div class="ring-l">${label}</div>
  </div>`;
}

/* ── EXPLORE ── */
// Same pill treatment as the game-card markets: label above price, one
// clean control instead of a bare "+". Only ONE side is ever available here
// -- the model logs whichever side (over or under) it found value on, not
// both -- so this shows that real side and price rather than inventing the
// other one.
// A real book line (side + price) earns the full pill -- it's new information
// worth the space. With no market to show, the badge was repeating the SAME
// projection number already on the row, padded out to a big empty-looking
// box just to hold a "+". Now it's a small icon-only control instead, sized
// to match the confidence ring rather than a market pill.
function propBadge(p, e){
  const hasMarket = e && e.line != null;
  const label = hasMarket ? `${(e.side||'')[0]||''} ${e.line}`.trim() : p._val.toFixed(p._dp);
  const price = e && e.odds != null ? fmtOdds(e.odds) : '';

  if (hasMarket){
    return `<span class="mb pr-mb">
      <span class="mb-l">${esc(label)}</span>
      ${price ? `<span class="mb-p">${esc(price)}</span>` : ''}
    </span>`;
  }
  return '';
}

// Two lines instead of one crowded row. Top: identity and the number that
// matters (projection, confidence). Bottom: everything supporting that
// number (tags, edge) with the bet control at the end where a thumb expects
// it. Five flex columns fighting for a phone's width was the actual mess.
// Tags now sit as a small line above the name -- they're the fastest-scanned
// part of a row (colour before text), so they lead rather than trail. Bet
// control and edge live in their own row at the bottom with room to breathe,
// so neither the tags nor the price ever truncate.
// Real widths, not jsdom's. Three fixed-width side columns (avatar, proj,
// confidence) were squeezing the name down to ~130px on an actual phone --
// jsdom has no layout engine, so testing never caught it; it just reported
// the CSS as valid. Name now gets its own line with only the confidence ring
// beside it, which is the one thing worth keeping on that line.
function rowHtml(p, arr){
  const c = confOf(p, arr), col = confColor(c);
  const e = edgeOf(p);
  const tags = tagsFor(p).slice(0, 2);
  return `<div class="row" data-key="${esc(p._key)}">
    <div class="row-top">
      ${avatar(p._sp, p, 'av')}
      <div class="who">
        <div class="who-n">${esc(p.name)}</div>
        <div class="who-m">${teamMark(p._sp, p._tab, 13)}<span>${esc(p._tab)}</span>
          <span class="vs">vs</span>${teamMark(p._sp, p._oab, 13)}<span>${esc(p._oab)}</span>
          <span class="who-mkt">\u00b7 ${esc(p._market)}</span></div>
      </div>
      <div class="cf"><div class="cf-r" style="--c:${col}">${c}</div></div>
    </div>
    ${tags.length ? `<div class="row-tags">${tagHtml(tags)}</div>` : ''}
    <div class="row-foot">
      <div class="pv"><b>${p._val.toFixed(p._dp)}</b><span>proj</span></div>
      ${edgePill(e)}
      ${propBadge(p, e)}
    </div>
  </div>`;
}
function renderExplore(){
  const arr = players(sport);
  const defs = MARKETS[sport] || [];
  const chips = defs.map(m =>
    `<div class="f ${(market||defs[0][0])===m[0]?'on':''}" data-market="${esc(m[0])}">${esc(m[0])}</div>`).join('');
  $('v-explore').innerHTML = `
    <div class="filters">${chips}</div>
    ${arr.length ? arr.slice(0,120).map(p=>rowHtml(p,arr)).join('')
      : `<div class="empty"><div class="i">◎</div><div class="m">Nothing on the slate</div>
         <div class="s">${sport.toUpperCase()} has no games right now.</div></div>`}`;
}

/* ── GAMES ──
   Everything the classic board showed on a game card: projected score, win
   probabilities, the total, and the matchup context line. Nothing from the old
   view should be missing here just because the shell changed. */
function gameScore(sp, g){
  if (sp === 'mlb') return [g.away_runs, g.home_runs];
  if (sp === 'nfl') return [g.away_pts, g.home_pts];
  if (sp === 'nba') return [g.away_points, g.home_points];
  return [g.away_goals, g.home_goals];
}
function gameMeta(sp, g){
  const bits = [g.venue];
  if (sp === 'mlb' && g.away_pitcher) bits.push(`${g.away_pitcher} vs ${g.home_pitcher}`);
  if (sp === 'nhl' && g.away_goalie) bits.push(`${g.away_goalie} vs ${g.home_goalie || 'TBD'}`);
  if (sp === 'nfl' && g.away_qb) bits.push(`${g.away_qb} vs ${g.home_qb}`);
  return bits.filter(Boolean).join(' \u00b7 ');
}
function stateLabel(g){
  const st = g.game_state;
  if (st === 'Final') return ['FINAL', '#8E93A3'];
  if (st === 'Live') return [`LIVE${g.inning ? ' ' + (g.inning_half === 'Top' ? '\u25b2' : '\u25bc') + g.inning : ''}`, '#FF4E6A'];
  const t = g.game_time ? new Date(g.game_time) : null;
  return [t ? t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '—', '#8E93A3'];
}
// The edge belongs to a side, so it says which. A bare "+6.6%" leaves you
// working out who it's on from the rest of the card.
// Every priced market on the game, as one clean row of badges: both
// moneylines, both sides of the spread, both sides of the total. Same
// American-odds format the sportsbooks use. Nothing here is invented -- a
// market only gets a badge when FanDuel has actually posted it, via _lines
// (spread/total/moneyline together) or the older standalone `moneylines`.
function fmtOdds(v){ return v == null ? '' : (v > 0 ? '+' + v : String(v)); }
function marketBadges(sp, g){
  const L = g._lines || {};
  const ml = g.moneylines || (L.ml_away != null ? {away:L.ml_away, home:L.ml_home, book:L.book} : null);
  const aAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
  const hAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
  const gkey = `${aAb}@${hAb}|${g.game_time||''}`;
  const live = g.game_state !== 'Final';
  if (!live) return '';

  const badge = (label, price) => {
    return `<span class="mb">
      <span class="mb-l">${esc(label)}</span>
      <span class="mb-p">${price!=null?fmtOdds(price):'\u2014'}</span>
    </span>`;
  };

  const parts = [];
  if (ml){
    parts.push(badge(`${aAb} ML`, ml.away));
    parts.push(badge(`${hAb} ML`, ml.home));
  }
  if (L.spread != null){
    parts.push(badge(`${aAb} ${(-L.spread>0?'+':'')}${(-L.spread)}`, L.spread_away_price));
    parts.push(badge(`${hAb} ${(L.spread>0?'+':'')}${L.spread}`, L.spread_home_price));
  }
  if (L.total != null){
    parts.push(badge(`O ${L.total}`, L.over_price));
    parts.push(badge(`U ${L.total}`, L.under_price));
  }
  if (!parts.length) return '';
  return `<div class="mkts">${parts.join('')}</div>`;
}

// The edge object's `team` field is always a full team name (all four sports
// agree on that), but NHL and NBA's OWN game fields already use abbreviations
// everywhere else. Rather than hardcode a second 60-team name map and risk it
// drifting from the real one, this resolves against the SAME game object's
// away_team/home_team so it can never disagree with what the card already shows.
function resolveTeamAbbr(sp, g, name){
  if (!name) return '';
  const aFull = sp==='mlb'||sp==='nfl' ? g.away_team : (g.away_team || g.away_abbr);
  const hFull = sp==='mlb'||sp==='nfl' ? g.home_team : (g.home_team || g.home_abbr);
  if (name === aFull) return teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
  if (name === hFull) return teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
  return teamAbbr(sp, name);   // fallback: static map (mlb/nfl) or best-effort
}

// LEAN / STRONG / ELITE / PASS -- the model's own read on how strong a signal
// this game is, independent of the numeric edge. Shown as its own pill so a
// LEAN-tier edge doesn't read with the same weight as an ELITE one.
const TIER_COLOR = { ELITE:'#3DF08B', STRONG:'#3DD9F0', LEAN:'#FFC65C', PASS:'#7C8296' };
function tierPill(sp, g, favAb){
  const t = (g.tier || '').toUpperCase();
  if (!t || t === 'PASS') return '';
  const c = TIER_COLOR[t] || '#7C8296';
  return `<span class="tier-pill" style="color:${c}">
    ${favAb ? teamMark(sp, favAb, 13) : ''}<b>${esc(t)}</b>
  </span>`;
}

function edgeTeamPill(sp, g, edge){
  if (!edge || edge.edge_pct == null || g.game_state === 'Final') return '';
  const team = edge.team || '';
  const ab = resolveTeamAbbr(sp, g, team);
  const col = appEdgeBand(edge.edge_pct)[1];
  const v = Number(edge.edge_pct);
  return `<span class="gc-edge" style="color:${col}">
    ${teamMark(sp, ab, 13)}<i>Edge</i><b>${v>0?'+':''}${v.toFixed(1)}%</b>
  </span>`;
}

function renderGames(){
  const d = DATA[sport], sp = sport;
  const games = (d && d.games) || [];
  if (!games.length){
    $('v-games').innerHTML = `<div class="empty"><div class="i">◎</div>
      <div class="m">No games on the slate</div>
      <div class="s">${sp.toUpperCase()} is out of season.</div></div>`;
    return;
  }
  const order = {Preview:0, Live:1, Final:2};
  const sorted = [...games].sort((a,b) =>
    (order[a.game_state] ?? 1) - (order[b.game_state] ?? 1) ||
    String(a.game_time||'').localeCompare(String(b.game_time||'')));

  $('v-games').innerHTML = sorted.map(g => {
    const aAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
    const hAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
    const [as, hs] = gameScore(sp, g);
    const [lab, lcol] = stateLabel(g);
    const aw = g.away_win_pct, hw = g.home_win_pct;
    const total = (as != null && hs != null) ? (as + hs) : null;
    const dim = g.game_state === 'Final' ? 'dim' : g.game_state === 'Live' ? 'live' : '';
    const aCol = teamColor(sp, aAb, '#3DF08B'), hCol = teamColor(sp, hAb, '#7C5CFF');
    const favAb = (aw != null && hw != null) ? (aw >= hw ? aAb : hAb) : null;
    const edge = g.edge;
    const row = (ab, name, score, win, fav) => `
      <div class="gt">
        ${teamMark(sp, ab, 22)}
        <span class="gt-n ${fav?'fav':''}">${esc(name)}</span>
        <span class="gt-s">${score != null ? Number(score).toFixed(sp==='mlb'||sp==='nhl'?1:0) : '–'}</span>
        <span class="gt-w">${win != null ? Math.round(win*100)+'%' : '–'}</span>
      </div>`;
    return `<div class="gc ${dim}">
      <div class="gc-h">
        <span class="gc-m">${teamMark(sp,aAb,15)}${esc(aAb)} <span class="vs">@</span> ${teamMark(sp,hAb,15)}${esc(hAb)}</span>
        <span class="gc-state" style="color:${lcol};border-color:${lcol}44;background:${lcol}14">${lab}</span>
      </div>
      ${row(aAb, sp==='mlb'||sp==='nfl' ? g.away_team : aAb, as, aw, aw>hw)}
      ${row(hAb, sp==='mlb'||sp==='nfl' ? g.home_team : hAb, hs, hw, hw>aw)}
      ${marketBadges(sp, g)}
      ${aw != null ? `<div class="gc-bar" style="background:${hCol}">
        <div style="width:${(aw*100).toFixed(0)}%;background:${aCol}"></div></div>` : ''}
      <div class="gc-stats">
        ${total != null ? `<span><i>Total</i><b>${total.toFixed(1)}</b></span>` : ''}
        ${g.p_over_8_5 != null ? `<span><i>O8.5</i><b>${Math.round(g.p_over_8_5*100)}%</b></span>` : ''}
        ${g.p_over_total != null ? `<span><i>Over</i><b>${Math.round(g.p_over_total*100)}%</b></span>` : ''}
        ${g.p_over_6_5 != null ? `<span><i>O6.5</i><b>${Math.round(g.p_over_6_5*100)}%</b></span>` : ''}
        ${g.target_score != null
          ? `<span title="Scoring environment, 0\u2013100. Blends projected runs, the over probability, and how likely both sides are to score. High = a good game for overs and hitter props.">
              <i>Scoring env</i><b>${g.target_score}</b></span>` : ''}
      </div>
      ${(tierPill(sp, g, favAb) || edgeTeamPill(sp, g, edge)) ? `<div class="gc-badges">${tierPill(sp, g, favAb)}${edgeTeamPill(sp, g, edge)}</div>` : ''}
      ${gameMeta(sp,g) ? `<div class="gc-meta">${esc(gameMeta(sp,g))}</div>` : ''}
    </div>`;
  }).join('');
}

/* ── DETAIL SHEET ── */
function openSheet(key){
  let found = null, arr = [];
  for (const sp of SPORTS){
    const a = players(sp);
    const p = a.find(x => x._key === key);
    if (p){ found = p; arr = a; break; }
  }
  if (!found) return;

// nflverse advanced metrics -- EPA+CPOE for passers, WOPR/target share for
// receivers. Existed on the old NFL board and was dropped when the app
// replaced it; the model still emits it, this just displays it again.
function nflAdvHtml(p){
  if (p._sp !== 'nfl' || !p.adv) return '';
  const a = p.adv, isQB = p._market === undefined ? false : (p.pass_yds != null || p._market === 'Pass Yds');
  const qb = a.dakota != null;
  const items = qb
    ? [['EPA+CPOE', a.dakota.toFixed(3)], ['PASS EPA', (a.pass_epa??0).toFixed(1)], ['SACKS', (a.sacks_taken??0).toFixed(1)]]
    : [['WOPR', (a.wopr??0).toFixed(2)], ['TGT%', ((a.target_share??0)*100).toFixed(0)],
       ['EPA', (a.rec_epa??0).toFixed(1)], ['AIR', (a.air_yards??0).toFixed(0)]];
  const f = qb ? p.eff_factor : p.opp_factor;
  const dir = f > 1.001 ? 'up' : f < 0.999 ? 'dn' : '';
  const chips = items.map(([l,v]) => `<span class="adv-chip"><i>${l}</i><b>${v}</b></span>`).join('');
  const fx = f == null ? '' : `<span class="adv-factor ${dir}">${f>1?'+':''}${((f-1)*100).toFixed(1)}%</span>`;
  return `<h2>Advanced \u00b7 nflverse ${a.weeks}w</h2><div class="adv-row">${chips}${fx}</div>`;
}
  const p = found, c = confOf(p, arr), col = confColor(c);
  const sheetEdge = edgeOf(p), sheetTags = tagsFor(p);
  const g = p._game, ctx = g && g._context;

  const cells = [];
  if (p._sp === 'mlb'){
    if (p.pa != null) cells.push(['PA', p.pa.toFixed(1)]);
    if (p.xwoba != null) cells.push(['xwOBA', p.xwoba.toFixed(3)]);
    if (p.hr_prob != null) cells.push(['HR/PA', (p.hr_prob*100).toFixed(1)+'%']);
    if (p.k_rate != null) cells.push(['K%', (p.k_rate*100).toFixed(0)+'%']);
  } else if (p._sp === 'nfl'){
    if (p.targets != null) cells.push(['TGT', p.targets.toFixed(1)]);
    if (p.rec != null) cells.push(['REC', p.rec.toFixed(1)]);
    if (p.td_prob != null) cells.push(['TD%', (p.td_prob*100).toFixed(0)+'%']);
    if (p.fpts != null) cells.push(['FPTS', p.fpts.toFixed(1)]);
  }

  let rings = '';
  if (ctx){
    const away = g && (g.away_team === p._team);
    const pq = away ? ctx.pitcher_quality : ctx.opp_pitcher_quality;
    const pen = away ? ctx.bullpen_home : ctx.bullpen_away;
    const r = [];
    if (pq != null) r.push(ring(pq, pq/100, 'Pitcher', '#3DF08B'));
    if (pen != null) r.push(ring(pen.toFixed(2), (pen-0.85)/0.3, 'Bullpen', '#FFC65C'));
    if (ctx.park_run_factor != null) r.push(ring(Math.round(ctx.park_run_factor*100), (ctx.park_run_factor-0.9)/0.28, 'Park', '#7C5CFF'));
    if (ctx.weather_hr_factor != null) r.push(ring((ctx.weather_hr_factor>1?'+':'')+Math.round((ctx.weather_hr_factor-1)*100)+'%', Math.abs(ctx.weather_hr_factor-1)/0.25, 'Weather', '#3DD9F0'));
    if (r.length) rings = `<h2>Matchup analysis</h2><div class="rings">${r.join('')}</div>`;
  }

  const notes = [];
  if (p.matchup_grade) notes.push(`Matchup graded <b>${esc(p.matchup_grade)}</b> against ${esc(p._opp)}.`);
  if (p._sp==='mlb' && p.order) notes.push(`Batting <b>${p.order}${p.order===1?'st':p.order===2?'nd':p.order===3?'rd':'th'}</b>.`);
  if (ctx && ctx.park_run_factor && ctx.park_run_factor !== 1)
    notes.push(`Park plays <b>${ctx.park_run_factor > 1 ? 'up' : 'down'}</b> at ${Math.round(Math.abs(ctx.park_run_factor-1)*100)}%.`);
  if (ctx && ctx.umpire) notes.push(`Home plate: ${esc(ctx.umpire)}.`);
  notes.push(`Confidence is this projection's rank within today's ${esc(p._market)} board, adjusted for matchup grade \u2014 not a hit-rate.`);

  $('sheet-in').innerHTML = `
    <div class="grab"></div>
    <div class="sh-head">
      ${avatar(p._sp, p, 'sh-av')}
      <div><div class="sh-n">${esc(p.name)}</div>
        <div class="sh-m">${teamMark(p._sp, p._tab, 15)}<span>${esc(p._team)}</span>
          <span class="vs">vs</span>${teamMark(p._sp, p._oab, 15)}<span>${esc(p._opp)}</span></div></div>
      <div class="sh-score" style="--c:${col}"><b>${c}</b><span>Confidence</span></div>
    </div>
    <div class="hero">
      <div style="flex:1">
        <div class="hero-n">${p._val.toFixed(p._dp)}</div>
        <div class="hero-l">Projected ${esc(p._market)}</div>
      </div>
      ${sheetEdge && sheetEdge.line != null ? `<div class="hero-c"><b>${esc(String(sheetEdge.line))}</b><div class="hero-l">Line</div></div>` : ''}
      ${sheetEdge && sheetEdge.edge != null ? `<div class="hero-c"><b style="color:${appEdgeBand(sheetEdge.edge)[1]}">${sheetEdge.edge>0?'+':''}${sheetEdge.edge.toFixed(1)}%</b><div class="hero-l">Edge</div></div>` : ''}
    </div>
    ${sheetTags.length ? `<div class="tags sheet-tags">${tagHtml(sheetTags)}</div>` : ''}
    ${cells.length ? `<div class="cells">${cells.map(([l,v])=>`<div class="cell"><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}
    ${nflAdvHtml(p)}
    <h2>Range of outcomes</h2>
    ${distChart(p)}
    ${rings}
    <h2>Model notes</h2>
    <div class="notes">${notes.join(' ')}</div>`;
  $('sheet').classList.add('on');
}

/* ── wiring ── */
function render(){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+view));
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if (view === 'explore') renderExplore();
  else if (view === 'games') renderGames();
  $('league-btn').innerHTML = `<img class="lg" src="${LEAGUE_LOGO[sport]}" alt="" width="15" height="15"
      onerror="this.remove()">${sport.toUpperCase()} \u25be`;
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('.nb');
  if (!b) return;
  view = b.dataset.v; render(); window.scrollTo({top:0});
});
$('league-btn').addEventListener('click', () => {
  sport = SPORTS[(SPORTS.indexOf(sport)+1) % SPORTS.length];
  try { localStorage.setItem('slate_sport', sport); } catch(e){}
  market = null; render();
});
document.body.addEventListener('click', e => {
  const cat = e.target.closest('[data-market]');
  if (cat){ market = cat.dataset.market; view = 'explore'; render(); return; }
  const goto = e.target.closest('[data-goto]');
  if (goto){ e.preventDefault(); view = goto.dataset.goto; render(); return; }
  const k = e.target.closest('[data-key]');
  if (k){ openSheet(k.dataset.key); return; }
});
$('sheet').addEventListener('click', e => {
  if (e.target === $('sheet')) $('sheet').classList.remove('on');
});
// The refresh button only re-fetched the JSON, which never changes between
// Action runs -- so it looked like it did nothing. It now asks the Cloudflare
// Worker to dispatch the workflow, then re-polls while the run completes.
// RUN_TRIGGER_URL lives in picks.js.
let runTimer = null;
function runStatus(msg, bad){
  const el = $('run-status');
  el.textContent = msg;
  el.className = 'run-status show' + (bad ? ' bad' : '');
  clearTimeout(runTimer);
  runTimer = setTimeout(() => el.classList.remove('show'), 9000);
}
async function triggerRun(){
  let url = '';
  try { url = (typeof RUN_TRIGGER_URL === 'string' && RUN_TRIGGER_URL) || ''; } catch (e){}
  if (!url) return { skipped: true };
  try {
    const r = await fetch(url, { method: 'POST' });
    // A Worker without CORS headers throws here, which used to look identical
    // to "nothing configured" -- i.e. a button that silently does nothing.
    return r.ok ? { ok: true } : { ok: false, reason: 'HTTP ' + r.status };
  } catch (e){
    return { ok: false, reason: 'blocked \u2014 check the Worker\u2019s CORS headers' };
  }
}
$('refresh').addEventListener('click', async () => {
  const btn = $('refresh');
  btn.classList.add('spin');
  const res = await triggerRun();
  await load();
  if (res.skipped){
    runStatus('Reloaded. Set RUN_TRIGGER_URL in picks.js to run the models.', true);
  } else if (res.ok){
    runStatus('Run started \u2014 new numbers in 1\u20132 min.');
    [20, 45, 75, 110].forEach(s => setTimeout(load, s * 1000));
  } else {
    runStatus('Couldn\u2019t start a run: ' + res.reason, true);
  }
  btn.classList.remove('spin');
});

async function load(){
  await Promise.all(SPORTS.map(async sp => {
    try {
      const r = await fetch(`./data/${sp}_slate.json?t=${Date.now()}`);
      DATA[sp] = await r.json();
    } catch(e){ DATA[sp] = {games:[]}; }
  }));
  render();
}
load();
setInterval(load, 10*60*1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
