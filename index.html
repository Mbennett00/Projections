/* ── SIMULATION LAB ───────────────────────────────────────────────────────
   The Sim tab's player cards are the quick-scan summary. Tapping one opens
   this -- the full instrument panel: pick a distribution, pick a trial
   count, nudge the projection with a matchup/home-away/sensitivity toggle,
   and see the whole probability picture redraw, not just a floor/ceiling.
   Every number on this panel comes from the same samples; nothing here is
   a separate hardcoded formula re-deriving what the histogram already
   shows. */

// ── odds / EV / Kelly ──
function probToAmerican(p){
  if (p == null || p <= 0 || p >= 1) return null;
  return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p);
}
// Decimal payout per $1 staked, from an American price. Used for both EV and Kelly.
function americanToDecimal(price){
  if (price == null) return null;
  return price > 0 ? 1 + price/100 : 1 + 100/Math.abs(price);
}
function evPer100(prob, price){
  const dec = americanToDecimal(price);
  if (dec == null || prob == null) return null;
  return Math.round((prob * (dec - 1) * 100 - (1 - prob) * 100) * 10) / 10;
}
function kellyPct(prob, price){
  const dec = americanToDecimal(price);
  if (dec == null || prob == null) return null;
  const b = dec - 1;
  const f = (prob * b - (1 - prob)) / b;
  return Math.max(0, Math.round(f * 1000) / 10); // %, floored at 0 -- negative Kelly just means "no bet"
}

// ── volatility rating (transparently modeled, not measured) ──
// There's no per-player historical game log in this data to measure real
// week-to-week variance from, so this uses the same CV assumption the rest
// of the app's distribution already runs on (~42% of the mean for a
// continuous stat, exact for Poisson/NegBinom). Labeled "modeled" rather
// than "historical" in the UI on purpose -- it would overclaim otherwise.
function volatilityRating(cv){
  if (cv < 0.25) return ['LOW', 'var(--green)'];
  if (cv < 0.45) return ['MODERATE', 'var(--cyan)'];
  if (cv < 0.70) return ['HIGH', 'var(--amber)'];
  return ['EXTREME', 'var(--red)'];
}

let simLab = null; // { key, trials, dist, seed, ha:'auto'|'home'|'away', mu:'auto'|'easy'|'tough', adjPct, controlsOpen }

function runLabSim(p, opts){
  const rand = (opts.seed !== '' && opts.seed != null && !isNaN(opts.seed))
    ? mulberry32(Number(opts.seed) >>> 0) : Math.random;
  let mean = p._val;
  let mult = 1 + (opts.adjPct || 0) / 100;
  if (opts.ha === 'home') mult *= 1.03;
  if (opts.ha === 'away') mult *= 0.97;
  if (opts.mu === 'easy') mult *= 1.08;
  if (opts.mu === 'tough') mult *= 0.92;
  mean = Math.max(0.05, mean * mult);
  const sd = Math.max(0.5, mean * 0.42);
  const trials = opts.trials || 5000;
  const samples = new Array(trials);
  for (let i = 0; i < trials; i++) samples[i] = sampleFor(opts.dist, mean, sd, rand);
  samples.sort((a,b) => a-b);
  return { samples, mean, sd, trials };
}

function labSummary(sim){
  const { samples, mean, sd } = sim;
  const n = samples.length;
  const sampleMean = samples.reduce((a,b)=>a+b,0) / n;
  const variance = samples.reduce((a,b)=>a+(b-sampleMean)*(b-sampleMean),0) / n;
  const sampleSd = Math.sqrt(variance);
  // Mode via the same bucketing the histogram uses -- most-populated bin's midpoint.
  const lo = samples[0], hi = samples[n-1], bins = 16;
  const w = Math.max(1e-6, (hi-lo)/bins);
  const counts = new Array(bins).fill(0);
  for (const x of samples) counts[Math.max(0, Math.min(bins-1, Math.floor((x-lo)/w)))]++;
  let maxI = 0; for (let i=1;i<bins;i++) if (counts[i] > counts[maxI]) maxI = i;
  const mode = lo + (maxI + 0.5) * w;
  const cv = sampleSd / Math.max(1e-6, sampleMean);
  const [volLabel, volColor] = volatilityRating(cv);
  // Confidence score: tighter distributions relative to their own mean score
  // higher. Same underlying idea as the Props tab's percentile-based
  // confidence, just derived from this specific run's spread instead.
  const confidence = Math.max(1, Math.min(99, Math.round(100 - cv*100)));
  return {
    mean: sampleMean, median: percentile(samples,.5), mode,
    floor: percentile(samples,.1), ceil: percentile(samples,.9),
    sd: sampleSd, variance, cv, volLabel, volColor, confidence,
  };
}

// Nice round step size for threshold/alt-line generation, scaled to the
// stat's own magnitude (a Pass Yds board wants steps of 10-25; a Hits board
// wants steps of 1).
function niceStep(mean, dp){
  if (dp >= 2 || mean < 8) return mean < 3 ? 1 : Math.max(1, Math.round(mean/6));
  if (mean < 30) return 2;
  if (mean < 100) return 5;
  return Math.round(mean/12/5)*5 || 5;
}

function labThresholds(p, sim){
  const { samples } = sim;
  const n = samples.length;
  const step = niceStep(sim.mean, p._dp);
  const med = percentile(samples,.5);
  const start = Math.max(0, med - step*3);
  const rows = [];
  const e = edgeOf(p);
  for (let i=0;i<7;i++){
    const t = Math.round((start + i*step) * (p._dp>=2?2:1)) / (p._dp>=2?2:1);
    const over = samples.filter(x => x >= t).length / n;
    const fair = probToAmerican(over);
    let implied=null, edgePct=null, ev=null, kelly=null, isMarket=false;
    if (e && e.line != null && Math.abs(e.line - t) < step*0.5){
      isMarket = true;
      const price = e.odds;
      if (price != null){
        implied = 1 / americanToDecimal(price);
        // Normalize away the vig direction roughly by comparing straight up --
        // this is model prob vs. this side's own implied prob, same as the
        // Props tab's edge pill uses.
        edgePct = (over - implied) * 100;
        ev = evPer100(over, price);
        kelly = kellyPct(over, price);
      }
    }
    rows.push({ t, over, under:1-over, fair, implied, edgePct, ev, kelly, isMarket });
  }
  // Highlight whichever row has the strongest real edge (only rows with a
  // real market price are eligible -- everything else has nothing to be
  // "strong" against).
  let bestI = -1, bestV = -1;
  rows.forEach((r,i) => { if (r.kelly != null && r.kelly > bestV){ bestV = r.kelly; bestI = i; } });
  if (bestI >= 0) rows[bestI].highlight = true;
  return rows;
}

function labAltLines(p, sim){
  const { samples } = sim;
  const n = samples.length;
  const qs = [.15,.30,.45,.60,.75,.90];
  return qs.map(q => {
    const t = Math.round(percentile(samples,q) * (p._dp>=2?2:1)) / (p._dp>=2?2:1);
    const over = samples.filter(x => x >= t).length / n;
    return { t, over, under: 1-over, fair: probToAmerican(over) };
  });
}

// ── distribution chart: histogram + density line + hover tooltip ──
// Generic distribution chart -- takes raw samples plus whatever markers
// apply (mean/median always, a book line when one exists) and an id suffix
// so the player lab and the game lab can each have their own on screen
// without fighting over element ids.
function distChartSvg(samples, mean, median, bookLine, bookLabel, idSuf){
  const n = samples.length;
  const W = 320, H = 130, PB = 20, PT = 6;
  const lo = samples[0], hi = samples[n-1] || samples[0]+1;
  const bins = 22, bw = Math.max(1e-6, (hi-lo)/bins);
  const counts = new Array(bins).fill(0);
  for (const x of samples) counts[Math.max(0, Math.min(bins-1, Math.floor((x-lo)/bw)))]++;
  const maxC = Math.max(...counts) || 1;
  const x = i => (i/bins) * W;
  const y = c => H - PB - (c/maxC) * (H - PB - PT);
  const bars = counts.map((c,i) =>
    `<rect x="${x(i).toFixed(1)}" y="${y(c).toFixed(1)}" width="${(W/bins-1).toFixed(1)}"
       height="${(H-PB-y(c)).toFixed(1)}" rx="1.5" fill="url(#labGrad${idSuf})"/>`).join('');
  // Density line: smoothed bin heights connected point-to-point through bin
  // midpoints -- a real KDE is overkill for a tooltip chart; this reads the
  // same shape.
  const pts = counts.map((c,i) => `${(x(i)+W/bins/2).toFixed(1)},${y(c).toFixed(1)}`).join(' ');
  const markerX = v => ((v-lo)/(hi-lo)) * W;
  const lineMark = (bookLine != null && bookLine >= lo && bookLine <= hi)
    ? `<line x1="${markerX(bookLine).toFixed(1)}" y1="${PT}" x2="${markerX(bookLine).toFixed(1)}" y2="${H-PB}"
         stroke="var(--red)" stroke-width="1.5" stroke-dasharray="3,2"/>` : '';
  return `<div class="lab-chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" class="lab-chart-svg" id="lab-chart-svg-${idSuf}"
      data-lo="${lo}" data-hi="${hi}" data-w="${W}" data-suf="${idSuf}">
      <defs><linearGradient id="labGrad${idSuf}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--violet)" stop-opacity=".9"/>
        <stop offset="100%" stop-color="var(--violet)" stop-opacity=".25"/>
      </linearGradient></defs>
      ${bars}
      <polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="1.5" opacity=".85"/>
      <line x1="${markerX(mean).toFixed(1)}" y1="${PT}" x2="${markerX(mean).toFixed(1)}" y2="${H-PB}"
        stroke="var(--green)" stroke-width="1.5"/>
      <line x1="${markerX(median).toFixed(1)}" y1="${PT}" x2="${markerX(median).toFixed(1)}" y2="${H-PB}"
        stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="2,2"/>
      ${lineMark}
    </svg>
    <div class="lab-chart-legend">
      <span><i style="background:var(--green)"></i>Mean</span>
      <span><i style="background:var(--amber)"></i>Median</span>
      ${bookLine != null ? `<span><i style="background:var(--red)"></i>${esc(bookLabel||'Book line')}</span>` : ''}
    </div>
    <div class="lab-tooltip" id="lab-tooltip-${idSuf}"></div>
  </div>`;
}
function wireDistChart(samples, idSuf){
  const svg = $('lab-chart-svg-'+idSuf);
  if (!svg) return;
  const tip = $('lab-tooltip-'+idSuf);
  const lo = parseFloat(svg.dataset.lo), hi = parseFloat(svg.dataset.hi), W = parseFloat(svg.dataset.w);
  const n = samples.length;
  const move = clientX => {
    const rect = svg.getBoundingClientRect();
    const px = Math.max(0, Math.min(W, (clientX - rect.left) * (W / rect.width)));
    const val = lo + (px/W) * (hi-lo);
    let cum = 0; for (const s of samples) if (s <= val) cum++;
    const cumPct = cum / n;
    const near = samples.filter(s => Math.abs(s-val) <= (hi-lo)/22).length / n;
    tip.style.opacity = '1';
    tip.style.left = Math.min(78, Math.max(2, (px/W)*100)) + '%';
    tip.innerHTML = `<b>${val.toFixed(1)}</b><span>density ${(near*100).toFixed(1)}%</span>
      <span>cumulative ${(cumPct*100).toFixed(1)}%</span>`;
  };
  svg.addEventListener('pointermove', e => move(e.clientX));
  svg.addEventListener('pointerleave', () => { tip.style.opacity = '0'; });
}

function findPlayerByKey(key){
  for (const sp of SPORTS){
    const p = players(sp).find(x => x._key === key);
    if (p) return p;
  }
  return null;
}

function openSimLab(key){
  simLab = { key, trials: 5000, dist: 'normal', seed: '', ha: 'auto', mu: 'auto', adjPct: 0, controlsOpen: false };
  $('sheet-in').innerHTML = labSkeletonHtml();
  $('sheet').classList.add('on');
  // Tiny artificial delay -- real compute is a few ms, but a bare instant
  // swap reads as a glitch rather than "it just simulated 5,000 trials".
  setTimeout(renderSimLab, 220);
}

function renderSimLab(){
  if (!simLab) return;
  const p = findPlayerByKey(simLab.key);
  if (!p){ $('sheet').classList.remove('on'); return; }
  const sim = runLabSim(p, simLab);
  const summary = labSummary(sim);
  const thresholds = labThresholds(p, sim);
  const altLines = labAltLines(p, sim);
  const e = edgeOf(p);
  const cells = statCellsFor(p);
  const fmtN = n => p._dp >= 2 ? n.toFixed(1) : n.toFixed(0);

  const oddsCell = v => v == null ? '<span class="dim">\u2014</span>' : (v>0?'+':'')+v;
  const pctCell = v => v == null ? '<span class="dim">\u2014</span>' : Math.round(v*100)+'%';

  $('sheet-in').innerHTML = `
    <div class="lab-head">
      ${avatar(p._sp, p, 'sh-av')}
      <div style="min-width:0">
        <div class="sh-n">${esc(p.name)}</div>
        <div class="sh-m">${teamMark(p._sp, p._tab, 15)}<span>${esc(p._tab)}</span>
          <span class="vs">vs</span>${teamMark(p._sp, p._oab, 15)}<span>${esc(p._oab)}</span></div>
        <div class="pcard-mkt">${esc(p._market)}</div>
      </div>
    </div>

    ${labControlsHtml(simLab)}

    <h2>Projection summary</h2>
    <div class="lab-stat-grid">
      ${labStatCard('Mean', fmtN(summary.mean), 'var(--green)')}
      ${labStatCard('Median', fmtN(summary.median), 'var(--amber)')}
      ${labStatCard('Mode', fmtN(summary.mode), 'var(--cyan)')}
      ${labStatCard('Floor (P10)', fmtN(summary.floor), '#FF9A3D')}
      ${labStatCard('Ceiling (P90)', fmtN(summary.ceil), '#9B7CFF')}
      ${labStatCard('Std Dev', summary.sd.toFixed(2))}
      ${labStatCard('Variance', summary.variance.toFixed(2))}
      ${labStatCard('Confidence', summary.confidence, 'var(--ink)', 'Tighter distribution relative to its own mean = higher score')}
      ${labStatCard('Volatility', summary.volLabel, summary.volColor, 'Modeled from the same variance assumption as the distribution chart -- not measured from historical game logs, which this app does not have per-player.')}
    </div>

    <h2>Distribution</h2>
    ${distChartSvg(sim.samples, summary.mean, summary.median, e&&e.line, 'Book line', 'player')}
    <div class="lab-pctile-row">
      ${[.05,.1,.25,.5,.75,.9,.95].map(q =>
        `<div class="lab-pctile"><b>${fmtN(percentile(sim.samples,q))}</b><span>P${Math.round(q*100)}</span></div>`).join('')}
    </div>

    <h2>Probability breakdown</h2>
    <div class="lab-table">
      <div class="lab-thead"><span>Line</span><span>Over</span><span>Fair</span><span>Edge</span><span>EV</span><span>Kelly</span></div>
      ${thresholds.map(r => `<div class="lab-trow ${r.highlight?'hl':''}">
        <span>${fmtN(r.t)}+</span><span>${pctCell(r.over)}</span><span>${oddsCell(r.fair)}</span>
        <span>${r.edgePct==null?'<span class="dim">\u2014</span>':(r.edgePct>0?'+':'')+r.edgePct.toFixed(1)+'%'}</span>
        <span>${r.ev==null?'<span class="dim">\u2014</span>':(r.ev>0?'+$':'-$')+Math.abs(r.ev)}</span>
        <span>${r.kelly==null?'<span class="dim">\u2014</span>':r.kelly+'%'}</span>
      </div>`).join('')}
    </div>
    ${e && e.line != null ? `<div class="lab-note">Edge/EV/Kelly only compute against the row matching your real book line (${esc(String(e.line))}) -- the rest is simulated probability with no market to compare against.</div>`
      : `<div class="lab-note">No live book line on this player right now, so every row is simulated probability only.</div>`}

    <h2>Alternate lines</h2>
    <div class="lab-table lab-table-alt">
      <div class="lab-thead"><span>Line</span><span>Over%</span><span>Under%</span><span>Fair odds</span></div>
      ${altLines.map(r => `<div class="lab-trow">
        <span>${fmtN(r.t)}</span><span>${pctCell(r.over)}</span><span>${pctCell(r.under)}</span><span>${oddsCell(r.fair)}</span>
      </div>`).join('')}
    </div>

    <h2>Sensitivity</h2>
    <div class="lab-sens-row">
      <button class="lab-sens-btn" data-lab-adj="10">+10%</button>
      <button class="lab-sens-btn" data-lab-adj="-10">-10%</button>
      <button class="lab-sens-btn ${simLab.ha==='home'?'on':''}" data-lab-ha="home">Home</button>
      <button class="lab-sens-btn ${simLab.ha==='away'?'on':''}" data-lab-ha="away">Away</button>
      <button class="lab-sens-btn ${simLab.mu==='easy'?'on':''}" data-lab-mu="easy">Easy matchup</button>
      <button class="lab-sens-btn ${simLab.mu==='tough'?'on':''}" data-lab-mu="tough">Tough matchup</button>
      ${(simLab.adjPct || simLab.ha!=='auto' || simLab.mu!=='auto') ? `<button class="lab-sens-btn lab-reset" data-lab-reset>Reset</button>` : ''}
    </div>

    <h2>Model inputs</h2>
    <div class="lab-inputs">
      <div class="lab-input-row"><span>Base projection</span><b>${fmtN(p._val)}</b></div>
      ${simLab.adjPct || simLab.ha!=='auto' || simLab.mu!=='auto' ? `<div class="lab-input-row"><span>Adjusted projection</span><b>${fmtN(sim.mean)}</b></div>` : ''}
      ${cells.map(([l,v]) => `<div class="lab-input-row"><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join('')}
      <div class="lab-input-row"><span>Matchup</span><b>${esc(p._tab)} vs ${esc(p._oab)}</b></div>
      ${e && e.line != null ? `<div class="lab-input-row"><span>Book line</span><b>${esc(String(e.line))} ${e.odds!=null?oddsCell(e.odds):''}</b></div>` : ''}
      <div class="lab-input-row"><span>Distribution used</span><b>${{normal:'Normal',poisson:'Poisson',negbinom:'Neg. Binomial',lognormal:'Log-Normal'}[simLab.dist]}</b></div>
      <div class="lab-input-row"><span>Trials run</span><b>${sim.trials.toLocaleString()}</b></div>
    </div>
    <div class="lab-note">Volatility is modeled (\u00b142% coefficient of variation, same assumption the rest of the app's distribution chart uses), not measured from real per-player game logs -- this app doesn't have that history yet.</div>
  `;
  wireDistChart(sim.samples, 'player');
}

/* ── wiring ── */
function render(){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+view));
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if (view === 'explore') renderExplore();
  else if (view === 'games') renderGames();
  else if (view === 'sim') renderSim();
  $('league-btn').innerHTML = `<img class="lg" src="${LEAGUE_LOGO[sport]}" alt="" width="15" height="15"
      onerror="this.remove()">${sport.toUpperCase()} \u25be`;
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('.nb');
  if (!b) return;
  view = b.dataset.v; render(); window.scrollTo({top:0});
});
$('league-btn').addEventListener('click', () => {
  sport = SPORTS[(SPORTS.indexOf(sport)+1) % SPORTS.length];
  try { localStorage.setItem('slate_sport', sport); } catch(e){}
  market = null; render();
});
document.body.addEventListener('click', e => {
  const simChip = e.target.closest('[data-sim]');
  if (simChip){ simMode = simChip.dataset.sim; render(); return; }
  const simMkt = e.target.closest('[data-simmkt]');
  if (simMkt){ market = simMkt.dataset.simmkt; render(); return; }
  const simGame = e.target.closest('[data-simgame]');
  if (simGame){ openGameBox(sport, parseInt(simGame.dataset.simgame, 10)); return; }
  const resim = e.target.closest('[data-resim]');
  if (resim){ renderGameBox(); return; }
  const lab = e.target.closest('[data-lab]');
  if (lab){ openSimLab(lab.dataset.lab); return; }

  // Simulation Lab controls -- all of these just mutate simLab and re-run,
  // no full sheet reopen/reload.
  const labToggle = e.target.closest('[data-lab-toggle]');
  if (labToggle){ simLab.controlsOpen = !simLab.controlsOpen; renderSimLab(); return; }
  const labTrials = e.target.closest('[data-lab-trials]');
  if (labTrials){ simLab.trials = parseInt(labTrials.dataset.labTrials, 10); renderSimLab(); return; }
  const labDist = e.target.closest('[data-lab-dist]');
  if (labDist){ simLab.dist = labDist.dataset.labDist; renderSimLab(); return; }
  const labHaChip = e.target.closest('.lab-chip[data-lab-ha]');
  if (labHaChip){ simLab.ha = labHaChip.dataset.labHa; renderSimLab(); return; }
  const labMuChip = e.target.closest('.lab-chip[data-lab-mu]');
  if (labMuChip){ simLab.mu = labMuChip.dataset.labMu; renderSimLab(); return; }
  const labRun = e.target.closest('[data-lab-run]');
  if (labRun){
    const seedEl = $('lab-seed-input');
    simLab.seed = seedEl && seedEl.value !== '' ? seedEl.value : '';
    renderSimLab(); return;
  }
  const labAdj = e.target.closest('[data-lab-adj]');
  if (labAdj){ simLab.adjPct += parseInt(labAdj.dataset.labAdj, 10); renderSimLab(); return; }
  const labHaBtn = e.target.closest('.lab-sens-btn[data-lab-ha]');
  if (labHaBtn){ simLab.ha = simLab.ha === labHaBtn.dataset.labHa ? 'auto' : labHaBtn.dataset.labHa; renderSimLab(); return; }
  const labMuBtn = e.target.closest('.lab-sens-btn[data-lab-mu]');
  if (labMuBtn){ simLab.mu = simLab.mu === labMuBtn.dataset.labMu ? 'auto' : labMuBtn.dataset.labMu; renderSimLab(); return; }
  const labReset = e.target.closest('[data-lab-reset]');
  if (labReset){ simLab.adjPct = 0; simLab.ha = 'auto'; simLab.mu = 'auto'; renderSimLab(); return; }

  // Game Simulation Lab -- same pattern as the player lab above, mutate
  // gameLab and re-run. This is the block that was missing entirely: the
  // HTML and the simulation math both existed, but nothing was listening
  // for clicks on any of it.
  const gamelabOpen = e.target.closest('[data-gamelab]');
  if (gamelabOpen){ openGameLab(sport, parseInt(gamelabOpen.dataset.gamelab, 10)); return; }
  const gamelabToggle = e.target.closest('[data-gamelab-toggle]');
  if (gamelabToggle){ gameLab.controlsOpen = !gameLab.controlsOpen; renderGameLab(); return; }
  const gamelabTrials = e.target.closest('[data-gamelab-trials]');
  if (gamelabTrials){ gameLab.trials = parseInt(gamelabTrials.dataset.gamelabTrials, 10); renderGameLab(); return; }
  const gamelabDist = e.target.closest('[data-gamelab-dist]');
  if (gamelabDist){ gameLab.dist = gamelabDist.dataset.gamelabDist; renderGameLab(); return; }
  const gamelabView = e.target.closest('[data-gamelab-view]');
  if (gamelabView){ gameLab.view = gamelabView.dataset.gamelabView; renderGameLab(); return; }
  const gamelabBlowoutChip = e.target.closest('.lab-chip[data-gamelab-blowout]');
  if (gamelabBlowoutChip){ gameLab.blowout = !gameLab.blowout; renderGameLab(); return; }
  const gamelabCorrChip = e.target.closest('.lab-chip[data-gamelab-corr]');
  if (gamelabCorrChip){ gameLab.corr = !gameLab.corr; renderGameLab(); return; }
  const gamelabOtChip = e.target.closest('.lab-chip[data-gamelab-ot]');
  if (gamelabOtChip){ gameLab.ot = !gameLab.ot; renderGameLab(); return; }
  const gamelabRun = e.target.closest('[data-gamelab-run]');
  if (gamelabRun){
    const seedEl = $('gamelab-seed-input');
    gameLab.seed = seedEl && seedEl.value !== '' ? seedEl.value : '';
    renderGameLab(); return;
  }
  const gamelabAdj = e.target.closest('[data-gamelab-adj]');
  if (gamelabAdj){ gameLab.adjPct += parseInt(gamelabAdj.dataset.gamelabAdj, 10); renderGameLab(); return; }
  const gamelabBlowoutBtn = e.target.closest('.lab-sens-btn[data-gamelab-blowout-btn]');
  if (gamelabBlowoutBtn){ gameLab.blowout = !gameLab.blowout; renderGameLab(); return; }
  const gamelabCorrBtn = e.target.closest('.lab-sens-btn[data-gamelab-corr-btn]');
  if (gamelabCorrBtn){ gameLab.corr = !gameLab.corr; renderGameLab(); return; }
  const gamelabReset = e.target.closest('[data-gamelab-reset]');
  if (gamelabReset){ gameLab.adjPct = 0; gameLab.blowout = false; gameLab.corr = false; renderGameLab(); return; }

  const cat = e.target.closest('[data-market]');
  if (cat){ market = cat.dataset.market; view = 'explore'; render(); return; }
  const goto = e.target.closest('[data-goto]');
  if (goto){ e.preventDefault(); view = goto.dataset.goto; render(); return; }
  const k = e.target.closest('[data-key]');
  if (k){ openSheet(k.dataset.key); return; }
});
$('sheet').addEventListener('click', e => {
  if (e.target === $('sheet')){ $('sheet').classList.remove('on'); simLab = null; gameLab = null; }
});
// The refresh button only re-fetched the JSON, which never changes between
// Action runs -- so it looked like it did nothing. It now asks the Cloudflare
// Worker to dispatch the workflow, then re-polls while the run completes.
// RUN_TRIGGER_URL lives in picks.js.
let runTimer = null;
function runStatus(msg, bad){
  const el = $('run-status');
  el.textContent = msg;
  el.className = 'run-status show' + (bad ? ' bad' : '');
  clearTimeout(runTimer);
  runTimer = setTimeout(() => el.classList.remove('show'), 9000);
}
async function triggerRun(){
  let url = '';
  try { url = (typeof RUN_TRIGGER_URL === 'string' && RUN_TRIGGER_URL) || ''; } catch (e){}
  if (!url) return { skipped: true };
  try {
    const r = await fetch(url, { method: 'POST' });
    // A Worker without CORS headers throws here, which used to look identical
    // to "nothing configured" -- i.e. a button that silently does nothing.
    return r.ok ? { ok: true } : { ok: false, reason: 'HTTP ' + r.status };
  } catch (e){
    return { ok: false, reason: 'blocked \u2014 check the Worker\u2019s CORS headers' };
  }
}
$('refresh').addEventListener('click', async () => {
  const btn = $('refresh');
  btn.classList.add('spin');
  const res = await triggerRun();
  await load();
  if (res.skipped){
    runStatus('Reloaded. Set RUN_TRIGGER_URL in picks.js to run the models.', true);
  } else if (res.ok){
    runStatus('Run started \u2014 new numbers in 1\u20132 min.');
    [20, 45, 75, 110].forEach(s => setTimeout(load, s * 1000));
  } else {
    runStatus('Couldn\u2019t start a run: ' + res.reason, true);
  }
  btn.classList.remove('spin');
});

async function load(){
  await Promise.all(SPORTS.map(async sp => {
    try {
      const r = await fetch(`./data/${sp}_slate.json?t=${Date.now()}`);
      DATA[sp] = await r.json();
    } catch(e){ DATA[sp] = {games:[]}; }
  }));
  render();
}
load();
setInterval(load, 10*60*1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
