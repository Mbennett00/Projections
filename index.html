<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projex</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D13">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D13; --card:#131826; --card-hover:#171D2C; --border:#212838; --border-soft:#1A2030;
  --text-primary:#F2F4F8; --text-secondary:#8B93A7; --text-tertiary:#545D72;
  --green:#00E68A; --green-dim:rgba(0,230,138,.12);
  --amber:#FFB020; --amber-dim:rgba(255,176,32,.12);
  --red:#FF5470; --red-dim:rgba(255,84,112,.12);
  --tabbar-bg:rgba(16,20,29,.92); --track:var(--border-soft);
  --nav-h:70px;
}
html[data-theme="light"]{
  --bg:#F5F6F9; --card:#FFFFFF; --card-hover:#F0F2F6; --border:#E3E6EC; --border-soft:#EBEDF2;
  --text-primary:#14171F; --text-secondary:#666E80; --text-tertiary:#9AA1B0;
  --green:#00B368; --green-dim:rgba(0,179,104,.10);
  --amber:#C97A00; --amber-dim:rgba(201,122,0,.10);
  --red:#D6335A; --red-dim:rgba(214,51,90,.10);
  --tabbar-bg:rgba(255,255,255,.92);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-primary);
  max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
  padding:max(14px,env(safe-area-inset-top)) 0 calc(var(--nav-h) + max(14px,env(safe-area-inset-bottom)));
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.num{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 16px}
.brand{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;flex:none}
.icon-btn svg{width:16px;height:16px;stroke:currentColor}
.sport-pill{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--text-primary);
  background:var(--card);border:1px solid var(--border);border-radius:99px;padding:6px 12px 6px 6px;cursor:pointer;
  display:flex;align-items:center;gap:7px;position:relative}
.sport-pill img{width:22px;height:22px;object-fit:contain;border-radius:50%;background:var(--border-soft);padding:3px}
.sport-pill .caret{color:var(--text-tertiary);font-size:9px;transition:transform .15s}
.sport-pill.open .caret{transform:rotate(180deg)}
.sport-menu{position:absolute;top:calc(100% + 8px);left:20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:30;min-width:150px;
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .14s,transform .14s}
.sport-menu.open{opacity:1;transform:translateY(0);pointer-events:auto}
.sport-menu-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600}
.sport-menu-item:hover{background:var(--card-hover)}
.sport-menu-item.active{background:var(--green-dim);color:var(--green)}
.sport-menu-item img{width:24px;height:24px;object-fit:contain;border-radius:50%;background:var(--border-soft);padding:3px}

/* chips */
.chips{display:flex;gap:8px;padding:0 20px 18px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;font-weight:600;color:var(--text-secondary);background:var(--card);border:1px solid var(--border);
  padding:8px 14px;border-radius:10px;white-space:nowrap;cursor:pointer;flex:none}
.chip.active{border-color:var(--green);color:var(--green);background:var(--green-dim)}

.pad{padding:0 20px}
.empty{padding:60px 20px;text-align:center;color:var(--text-tertiary)}
.empty .i{font-size:28px;margin-bottom:10px;opacity:.6}
.empty .m{font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.empty .s{font-size:12.5px}

/* matchup card */
.matchup-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;cursor:pointer}
.matchup-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;width:88px}
.team-badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--border-soft);overflow:hidden}
.team-badge img{width:100%;height:100%;object-fit:contain;padding:6px}
.team-badge .tt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text-secondary)}
.team-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;text-align:center}
.team-record{font-size:11px;color:var(--text-tertiary)}
.matchup-mid{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-secondary);font-size:12px}
.proj-score{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--text-primary);margin-top:2px}
.matchup-mid .at{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--text-tertiary)}
.game-meta{text-align:center;font-size:12px;color:var(--text-secondary);padding-top:10px;border-top:1px solid var(--border-soft);
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.stat-split{display:flex;gap:12px;margin-bottom:18px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.stat-label{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.stat-value{font-weight:700;font-size:24px;color:var(--green)}
.stat-value-row{display:flex;align-items:center;gap:8px}
.stat-team-logo{width:26px;height:26px;object-fit:contain;border-radius:50%;background:var(--border-soft);padding:3px;flex:none}
.stat-sub{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.bar-track{height:5px;background:var(--track);border-radius:4px;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;background:var(--green);border-radius:4px}

.section-title{display:flex;justify-content:space-between;align-items:center;padding:4px 20px 12px}
.section-title h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-title .count{font-size:12px;color:var(--text-tertiary);font-weight:500}

.player-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:14px;margin:0 20px 10px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--card-hover);display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text-secondary);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0}
.player-name-row{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.player-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--border-soft);color:var(--text-secondary);flex:none}
.player-sub{font-size:11.5px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.tag-pill{font-size:9px;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:5px}
.curve{width:56px;height:20px;flex:none}
.player-right{text-align:right;flex:none;width:62px}
.proj-value{font-weight:700;font-size:18px}
.proj-range{font-size:10px;color:var(--text-tertiary);margin-top:1px}
.conf-pill{display:inline-block;margin-top:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.conf-high{background:var(--green-dim);color:var(--green)}
.conf-mid{background:var(--amber-dim);color:var(--amber)}
.conf-low{background:var(--red-dim);color:var(--red)}

.view-all-btn{margin:6px 20px 22px;text-align:center;padding:14px;border:1px solid var(--border);border-radius:14px;
  color:var(--text-secondary);font-size:13px;font-weight:600;background:var(--card);cursor:pointer}

.sim-card{background:var(--card-hover);border:1px solid var(--border);border-radius:18px;padding:20px;margin:0 20px 24px}
.sim-title{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--text-secondary)}
.sim-row{display:flex;align-items:center;gap:20px}
.donut{width:74px;height:74px;flex:none}
.sim-legend{flex:1}
.legend-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.legend-label{font-size:12.5px;color:var(--text-secondary);display:flex;align-items:center}
.legend-val{font-weight:700;font-size:14px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--tabbar-bg);backdrop-filter:blur(20px);border-top:1px solid var(--border);
  display:flex;padding:10px 6px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;
  color:var(--text-tertiary);cursor:pointer;background:none;border:none}
.tab.active{color:var(--green)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}

/* row (list views) */
.thead{display:flex;align-items:center;gap:10px;padding:0 20px 8px;font-size:9.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}
.thead .c1{flex:1} .thead .c2{width:56px;text-align:right} .thead .c3{width:50px;text-align:right}

/* detail sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);
  border-radius:22px 22px 0 0;z-index:41;max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);padding-bottom:30px}
.sheet.on{transform:translateY(0)}
.detail-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.back-btn,.star-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--border);color:var(--text-primary);cursor:pointer}
.back-btn svg,.star-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.player-header{display:flex;align-items:center;gap:14px;padding:14px 20px 18px}
.avatar-lg{width:60px;height:60px;border-radius:16px;background:var(--card-hover);display:grid;place-items:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--text-secondary);flex:none;overflow:hidden}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.player-header-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin-bottom:3px}
.player-header-sub{font-size:13px;color:var(--text-secondary)}
.player-header-sub .pos{color:var(--green);font-weight:600}
.player-header-vs{font-size:12px;color:var(--text-tertiary);margin-top:2px}

.detail-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:0 20px 14px}
.dc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.dc-label{font-size:12px;color:var(--text-secondary);font-weight:600}
.dc-main-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;line-height:1.1}
.dc-main-sub{font-size:11.5px;color:var(--text-tertiary)}
.dc-conf{text-align:right}
.dc-conf-label{font-size:10.5px;color:var(--text-tertiary);margin-bottom:4px}
.dc-conf-pill{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--green);
  background:var(--green-dim);padding:3px 10px;border-radius:8px;display:inline-block}
.rms-row{display:flex;margin-top:16px;border-top:1px solid var(--border-soft);padding-top:14px}
.rms-item{flex:1;text-align:center}
.rms-item:not(:last-child){border-right:1px solid var(--border-soft)}
.rms-label{font-size:10.5px;color:var(--text-tertiary);margin-bottom:4px}
.rms-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}

.dist-title{font-size:12px;color:var(--text-secondary);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.dist-chart{width:100%;height:100px}
.dist-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-tertiary);margin-top:6px}
.dist-breakdown{display:flex;gap:10px;margin-top:14px}
.dist-seg{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:var(--border-soft)}
.dist-seg-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.dist-seg-label{font-size:10px;color:var(--text-tertiary);margin-top:2px}

.insight-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.insight-row-full{border-bottom:1px solid var(--border-soft);padding-bottom:10px;margin-bottom:0}
.insight-row-full .insight-row{border-bottom:none;padding-bottom:6px}
.inline-logo{width:16px;height:16px;object-fit:contain;vertical-align:-3px;border-radius:50%}
.player-header-vs .inline-logo{width:15px;height:15px;vertical-align:-2px}
.grade-pill{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:13px;padding:2px 9px;border-radius:7px}
.basis-pill{font-size:11.5px;font-weight:700;color:var(--text-primary);background:var(--border-soft);padding:3px 9px;border-radius:7px}
.factor-track{height:4px;background:var(--border-soft);border-radius:3px;overflow:hidden;margin-top:2px}
.factor-fill{height:100%;border-radius:3px}
.insight-row:last-child{border-bottom:none}
.insight-label{color:var(--text-secondary)}
.insight-value{font-weight:600;font-family:'Space Grotesk',sans-serif}
</style>
</head>
<body>

<div class="topbar" style="position:relative">
  <div class="sport-pill" id="sport-btn"></div>
  <div class="sport-menu" id="sport-menu"></div>
  <div class="brand"><span class="dot"></span>PROJEX</div>
  <div class="icon-btn" id="theme-btn">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </div>
</div>

<div class="view" id="v-home"></div>
<div class="view" id="v-explore" style="display:none"></div>
<div class="view" id="v-games" style="display:none"></div>
<div class="view" id="v-fav" style="display:none"></div>

<div class="tabbar">
  <button class="tab active" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z"/></svg>Home</button>
  <button class="tab" data-v="explore"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-4 4"/></svg>Projections</button>
  <button class="tab" data-v="games"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Games</button>
  <button class="tab" data-v="fav"><svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"/></svg>Favorites</button>
</div>

<div class="sheet-overlay" id="sheet-overlay"></div>
<div class="sheet" id="sheet"><div id="sheet-in"></div></div>

<script>
/* ── data ── */
const SPORTS = ['nfl','nhl','nba'];
const SPORT_LABEL = {nfl:'NFL', nhl:'NHL', nba:'NBA'};
const LEAGUE_LOGO = {
  nfl:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',
  nhl:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png',
  nba:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',
};
const DATA = {};
let sport = localStorage.getItem('projex_sport') || 'nfl';
let view = 'home';
let market = null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── theme ── */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('projex_theme', t);
  $('theme-icon').innerHTML = t === 'light'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
applyTheme(localStorage.getItem('projex_theme') || 'dark');
$('theme-btn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});

/* ── team lookups (NFL/NHL/NBA only) ── */
const NFL_ABBR = {"Arizona Cardinals":"ARI","Atlanta Falcons":"ATL","Baltimore Ravens":"BAL","Buffalo Bills":"BUF","Carolina Panthers":"CAR","Chicago Bears":"CHI","Cincinnati Bengals":"CIN","Cleveland Browns":"CLE","Dallas Cowboys":"DAL","Denver Broncos":"DEN","Detroit Lions":"DET","Green Bay Packers":"GB","Houston Texans":"HOU","Indianapolis Colts":"IND","Jacksonville Jaguars":"JAX","Kansas City Chiefs":"KC","Las Vegas Raiders":"LV","Los Angeles Chargers":"LAC","Los Angeles Rams":"LAR","Miami Dolphins":"MIA","Minnesota Vikings":"MIN","New England Patriots":"NE","New Orleans Saints":"NO","New York Giants":"NYG","New York Jets":"NYJ","Philadelphia Eagles":"PHI","Pittsburgh Steelers":"PIT","San Francisco 49ers":"SF","Seattle Seahawks":"SEA","Tampa Bay Buccaneers":"TB","Tennessee Titans":"TEN","Washington Commanders":"WSH"};
function teamAbbr(sp, name){
  if (!name) return '';
  if (sp === 'nfl') return NFL_ABBR[name] || String(name).slice(0,3).toUpperCase();
  return String(name).toUpperCase();  // NHL/NBA already store abbreviations
}
function teamLogo(sp, abbr){
  if (!abbr) return '';
  const path = {nfl:'nfl', nhl:'nhl', nba:'nba'}[sp];
  return path ? `https://a.espncdn.com/i/teamlogos/${path}/500/${abbr.toLowerCase()}.png` : '';
}
function teamBadge(sp, abbr){
  const src = teamLogo(sp, abbr);
  return `<div class="team-badge">${src
    ? `<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`
    : `<span class="tt">${esc(abbr)}</span>`}</div>`;
}

/* ── player avatar: real headshot_url first, then team logo, then initials ── */
const initials = n => String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
function avatarHtml(p, cls){
  const src = p.headshot_url || '';
  const logo = teamLogo(p._sp, p._tab);
  const fallback = logo ? `<img src="${logo}" alt="" loading="lazy">` : initials(p.name);
  return src
    ? `<span class="${cls}"><img src="${src}" alt="" loading="lazy" onerror="this.outerHTML=&quot;${fallback.replace(/"/g,'&quot;')}&quot;"></span>`
    : `<span class="${cls}">${fallback}</span>`;
}

/* ── markets / pools, NFL/NHL/NBA only ── */
const MARKETS = {
  nfl: [
    ['Pass Yds', p=>p.pass_yds, 0], ['Rush Yds', p=>p.rush_yds, 0],
    ['Rec Yds', p=>p.rec_yds, 0], ['Anytime TD', p=>p.td_prob, 2],
  ],
  nhl: [
    ['Shots', p=>p.shots_pg, 1], ['Points', p=>p.pts_pg, 2], ['Goals', p=>p.goal_prob, 2],
  ],
  nba: [
    ['Points', p=>p.pts, 1], ['Rebounds', p=>p.reb, 1],
    ['Assists', p=>p.ast, 1], ['3-Pointers', p=>p.tpm, 1],
  ],
};
const POOLS = {
  nfl: ['away_skill','home_skill','away_qb_proj','home_qb_proj'],
  nhl: ['away_skaters','home_skaters'], nba: ['away_players','home_players'],
};

function gameScore(sp, g){
  if (sp === 'nfl') return [g.away_pts, g.home_pts];
  if (sp === 'nba') return [g.away_points, g.home_points];
  return [g.away_goals, g.home_goals];
}

function players(sp){
  const d = DATA[sp];
  if (!d || !d.games) return [];
  const defs = MARKETS[sp] || [];
  const m = defs.find(x => x[0] === market) || defs[0];
  if (!m) return [];
  const out = [];
  let gi = 0;
  for (const g of d.games){
    if (g.game_state === 'Final') continue;
    for (const pool of (POOLS[sp]||[])){
      const away = pool.startsWith('away');
      const team = sp === 'nfl' ? (away ? g.away_team : g.home_team) : (away ? g.away_abbr : g.home_abbr);
      const opp = sp === 'nfl' ? (away ? g.home_team : g.away_team) : (away ? g.home_abbr : g.away_abbr);
      const raw = g[pool];
      const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      arr.forEach((p, pi) => {
        const v = m[1](p);
        if (v == null || isNaN(v)) return;
        // Keyed with game index + pool + position -- a name-only key
        // collapses every player onto the same row the instant a name is
        // ever missing (stale/partial data), which silently opens the
        // wrong player's detail sheet. This stays unique even then.
        out.push({...p, _sp:sp, _team:team, _opp:opp,
                  _tab:teamAbbr(sp, team), _oab:teamAbbr(sp, opp),
                  _market:m[0], _val:v, _dp:m[2],
                  _key:`${sp}|${m[0]}|${gi}|${pool}|${pi}|${p.name||''}`, _game:g});
      });
    }
    gi++;
  }
  out.sort((a,b) => b._val - a._val);
  return out;
}

/* every player, every market, for leaguewide "top projections" ranking by confidence */
function confOf(p, arr){
  const i = arr.indexOf(p);
  const pct = arr.length > 1 ? 1 - (i / (arr.length - 1)) : 1;
  let s = 45 + pct * 45;
  const g = (p.matchup_grade || '')[0];
  if (g === 'A') s += 8; else if (g === 'B') s += 3; else if (g === 'D') s -= 6;
  return Math.max(1, Math.min(99, Math.round(s)));
}
const confColor = s => s >= 78 ? 'high' : s >= 55 ? 'mid' : 'low';
// Real-data-driven descriptors -- grade letters and opponent factor both
// come straight from the Tier Engine's actual yards-allowed numbers.
const gradeColor = g => { const l = (g||'')[0];
  return l==='A' ? 'var(--green)' : l==='B' ? '#4EA1FF' : l==='C' ? 'var(--amber)' : 'var(--red)'; };
const factorColor = v => v >= 1.05 ? 'var(--green)' : v <= 0.95 ? 'var(--red)' : 'var(--text-tertiary)';
const factorTag = v => v >= 1.05 ? 'Favorable' : v <= 0.95 ? 'Tough' : 'Neutral';

function topProjections(sp, n){
  const defs = MARKETS[sp] || [];
  let all = [];
  for (const [name] of defs){
    const oldMarket = market; market = name;
    all = all.concat(players(sp));
    market = oldMarket;
  }
  // dedupe by player (keep their best/first market appearance), rank by confidence
  const seen = new Set(), out = [];
  for (const p of all){
    const k = p.name + p._market;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(p);
  }
  const withConf = out.map(p => ({p, c: confOf(p, out)}));
  withConf.sort((a,b) => b.c - a.c);
  return withConf.slice(0, n).map(x => ({...x.p, _conf: x.c}));
}

/* ── decorative sparkline, shaped by the model's real spread (floor/ceil vs mean) -- tighter curve for a tighter distribution, not a fabricated game log ── */
/* ── decorative sparkline, shaped by the player's real confidence score
   (tighter/more-peaked curve for higher confidence) -- not a fabricated
   per-game history, since we don't carry individual past games client-side ── */
function curveSvg(conf){
  const c = conf == null ? 70 : conf;
  const peak = 12 - Math.min(10, (c / 100) * 10); // higher confidence -> sharper peak
  const color = c >= 78 ? 'var(--green)' : c >= 55 ? 'var(--amber)' : 'var(--red)';
  return `<svg class="curve" viewBox="0 0 64 22"><path d="M0 20 C 10 20, 14 ${peak}, 22 ${peak} S 38 20, 64 20" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.85"/></svg>`;
}

/* ── card renderers ── */
function tagsFor(p){
  // Real-data badges: red-zone role, target hog, workhorse back -- using
  // actual usage shares from the Player Distribution Engine where present,
  // falling back to raw counting stats for sports/pools that don't have
  // shares (NHL/NBA, or NFL QBs).
  const t = [];
  if ((p.td_prob ?? 0) >= .45) t.push(['RED ZONE', 'var(--red)']);
  if (p.target_share != null ? p.target_share >= .22 : (p.rec ?? 0) >= 6) t.push(['TARGET HOG', 'var(--green)']);
  if (p.carry_share != null ? p.carry_share >= .55 : (p.rush_yds ?? 0) >= 80) t.push(['BELLCOW', 'var(--amber)']);
  return t;
}

function playerCardHtml(p, conf){
  const tags = tagsFor(p);
  return `<div class="player-card" data-key="${esc(p._key)}">
    ${avatarHtml(p, 'avatar')}
    <div class="player-info">
      <div class="player-name-row"><span class="player-name">${esc(p.name)}</span><span class="pos-tag">${esc(p.pos||'')}</span></div>
      <div class="player-sub">${esc(p._market)} · ${p._team ? 'vs '+esc(p._oab) : ''}</div>
      ${tags.length ? `<div class="tag-row">${tags.map(([label,color]) =>
        `<span class="tag-pill" style="color:${color};background:${color}22">${label}</span>`).join('')}</div>` : ''}
    </div>
    ${curveSvg(conf)}
    <div class="player-right">
      <div class="proj-value">${p._val.toFixed(p._dp)}</div>
      <div class="conf-pill conf-${confColor(conf)}">${conf}</div>
    </div>
  </div>`;
}

function matchupCardHtml(sp, g){

  const t = g.game_time ? new Date(g.game_time) : null;
  const timeStr = t ? t.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}) : '';
  const awayWin = g.away_win_pct, homeWin = g.home_win_pct;
  return `<div class="matchup-card" data-game="${DATA[sp].games.indexOf(g)}">
    <div class="matchup-row">
      <div class="team">${teamBadge(sp,aAb)}<div class="team-name">${esc(aAb)}</div></div>
      <div class="matchup-mid"><div class="at">@</div>${projA!=null?`<div class="proj-score">${projA.toFixed(0)}–${projH.toFixed(0)}</div>`:''}</div>
      <div class="team">${teamBadge(sp,hAb)}<div class="team-name">${esc(hAb)}</div></div>
    </div>
    <div class="game-meta"><span>${esc(timeStr)}</span>${g.venue?`<span>·</span><span>${esc(g.venue)}</span>`:''}</div>
  </div>

    <div class="stat-box">
      <div class="stat-label">Win Probability</div>
      <div class="stat-value-row">
        <img class="stat-team-logo" src="${teamLogo(sp, homeWin>=awayWin?hAb:aAb)}" alt="" loading="lazy" onerror="this.style.display='none'">
        <div><div class="stat-value">${Math.round((homeWin>=awayWin?homeWin:awayWin)*100)}%</div>
        <div class="stat-sub">${homeWin>=awayWin?esc(hAb):esc(aAb)}</div></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((homeWin>=awayWin?homeWin:awayWin)*100)}%"></div></div>

      <div class="stat-label">Scoring Env.</div>
      <div class="stat-value" style="color:var(--text-primary)">${g.tier || '—'}</div>
      <div class="stat-sub">${g.target_score!=null?`Score ${g.target_score}/100`:''}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${g.target_score||0}%;background:var(--text-primary)"></div></div>
    </div>
  </div>` : ''}`;
}

function simCardHtml(sp, g){
  const awayWin = g.away_win_pct, homeWin = g.home_win_pct;
  if (awayWin == null) return '';
  const aAb = teamAbbr(sp, sp==='nfl' ? g.away_team : g.away_abbr);
  const hAb = teamAbbr(sp, sp==='nfl' ? g.home_team : g.home_abbr);
  const circ = 2*Math.PI*15.5;
  const homePct = homeWin*100;
  const lines = (g._lines || {});
  return `<div class="sim-card">
    <div class="sim-title">Game Outcome (market)</div>
    <div class="sim-row">
      <svg class="donut" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--track)" stroke-width="4"/>
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--green)" stroke-width="4"
          stroke-dasharray="${(homePct/100*circ).toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 18 18)"/>
      </svg>
      <div class="sim-legend">
        <div class="legend-item"><span class="legend-label"><span class="legend-dot" style="background:var(--green)"></span>${esc(hAb)} Win</span><span class="legend-val" style="color:var(--green)">${Math.round(homePct)}%</span></div>
        <div class="legend-item"><span class="legend-label"><span class="legend-dot" style="background:var(--text-tertiary)"></span>${esc(aAb)} Win</span><span class="legend-val">${Math.round(awayWin*100)}%</span></div>
        ${lines.total!=null?`<div class="legend-item"><span class="legend-label">Total</span><span class="legend-val">${lines.total}</span></div>`:''}
        ${lines.spread!=null?`<div class="legend-item"><span class="legend-label">Spread</span><span class="legend-val">${esc(hAb)} ${lines.spread>0?'+':''}${lines.spread}</span></div>`:''}
      </div>
    </div>
  </div>`;
}

/* ── HOME ── */
function renderHome(){
  const d = DATA[sport];
  const games = ((d && d.games) || []).filter(g => g.game_state !== 'Final');
  if (!games.length){
    $('v-home').innerHTML = `<div class="chips"><div class="chip active">${SPORT_LABEL[sport]}</div></div>
      <div class="empty"><div class="i">◎</div><div class="m">No games on the slate</div>
      <div class="s">${SPORT_LABEL[sport]} is out of season right now.</div></div>`;

/* ── EXPLORE (Projections tab: full ranked list, market chips) ── */
function renderExplore(){
  const defs = MARKETS[sport] || [];
  if (!market || !defs.find(m => m[0] === market)) market = defs[0] ? defs[0][0] : null;
  const chips = defs.map(m => `<div class="chip ${market===m[0]?'active':''}" data-market="${esc(m[0])}">${esc(m[0])}</div>`).join('');
  const arr = players(sport);
  $('v-explore').innerHTML = `

      : `<div class="empty"><div class="i">◎</div><div class="m">Nothing on the slate</div><div class="s">${SPORT_LABEL[sport]} has no projections right now.</div></div>`}

/* ── GAMES ── */
function renderGames(){
  const d = DATA[sport];
  const games = (d && d.games) || [];
  if (!games.length){
    $('v-games').innerHTML = `<div class="empty"><div class="i">◎</div><div class="m">No games on the slate</div><div class="s">${SPORT_LABEL[sport]} is out of season right now.</div></div>`;
    return;
  }
  const order = {Preview:0, Live:1, Final:2};
  const sorted = [...games].sort((a,b) => (order[a.game_state]??1)-(order[b.game_state]??1) || String(a.game_time||'').localeCompare(String(b.game_time||'')));
  $('v-games').innerHTML = `<div class="chips"><div class="chip active">${SPORT_LABEL[sport]}</div></div><div class="pad">${sorted.map(g => matchupCardHtml(sport, g)).join('')}</div>`;
}

/* ── FAVORITES ── */
const WKEY = 'projex_watchlist_v1';
const watch = {
  all: () => { try { return JSON.parse(localStorage.getItem(WKEY)) || []; } catch(e){ return []; } },
  has: k => watch.all().includes(k),
  toggle(k){ const a = watch.all(), i = a.indexOf(k); if (i>=0) a.splice(i,1); else a.push(k);
    try { localStorage.setItem(WKEY, JSON.stringify(a)); } catch(e){} return i<0; },
};
function renderFavorites(){
  const saved = watch.all();
  const found = [];
  for (const sp of SPORTS){
    for (const [name] of (MARKETS[sp]||[])){
      const oldM = market; market = name;
      for (const p of players(sp)) if (saved.includes(p._key)) found.push(p);
      market = oldM;
    }
  }
  $('v-fav').innerHTML = found.length
    ? found.map(p => { const c = confOf(p, found); p._conf = c; return playerCardHtml(p, c); }).join('')
    : `<div class="empty"><div class="i">☆</div><div class="m">No favorites yet</div><div class="s">Tap a player, then the star, to save them here.</div></div>`;
}

/* ── PLAYER DETAIL SHEET ── */
function rngNormal(mean, sd){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function simDistribution(mean, dp){
  const sd = Math.max(0.4, mean*0.4), n = 3000, s = new Array(n);
  for (let i=0;i<n;i++) s[i] = Math.max(0, rngNormal(mean, sd));
  s.sort((a,b)=>a-b);
  const pct = q => s[Math.min(n-1, Math.max(0, Math.round(q*(n-1))))];
  return { floor: pct(.1), median: pct(.5), ceil: pct(.9), sd,
    under: s.filter(v=>v<mean*0.9).length/n, over: s.filter(v=>v>mean*1.1).length/n };
}
function openPlayer(key){
  const savedMarket = market;
  let found = null, foundArr = null;
  outer:
  for (const sp of SPORTS){
    for (const [name] of (MARKETS[sp]||[])){
      market = name;
      const arr = players(sp);
      const p = arr.find(x => x._key === key);
      if (p){ found = p; foundArr = arr; break outer; }
    }
  }
  if (!found){ market = savedMarket; return; }
  const conf = confOf(found, foundArr);
  market = savedMarket;
  const p = found;
  const dist = simDistribution(p._val, p._dp);
  const starred = watch.has(p._key);
  const injuryLine = p.injury ? `${esc(p.injury.status||'Injury')} — ${esc(p.injury.body_part||'')}` : null;
  const factorVal = p.opp_factor != null ? p.opp_factor : (p._matchup_factor != null ? p._matchup_factor : null);
  const weatherNote = (p._game && p._game.weather_note) || null;
  $('sheet-in').innerHTML = `
    <div class="detail-topbar">

      </div>
    </div>

      <div>
        <div class="player-header-name">${esc(p.name)}</div>
        <div class="player-header-sub"><span class="pos">${esc(p.pos||'')}</span> ·
          <img class="inline-logo" src="${teamLogo(p._sp, p._tab)}" alt="${esc(p._tab)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(p._tab)}'))">
        </div>
        <div class="player-header-vs">vs
          <img class="inline-logo" src="${teamLogo(p._sp, p._oab)}" alt="${esc(p._oab)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(p._oab)}'))">
          ${p.matchup_grade?` (${esc(p.matchup_grade)} matchup)`:''}
        </div>
      </div>
    </div>
    <div class="detail-card">
      <div class="dc-head">
        <div><div class="dc-label">${esc(p._market)}</div><div class="dc-main-value">${p._val.toFixed(p._dp)}</div><div class="dc-main-sub">Projected</div></div>
        <div class="dc-conf"><div class="dc-conf-label">Confidence</div><div class="dc-conf-pill">${conf}/100</div></div>
      </div>
      <div class="rms-row">
        <div class="rms-item"><div class="rms-label">Range</div><div class="rms-value">${dist.floor.toFixed(p._dp)}–${dist.ceil.toFixed(p._dp)}</div></div>
        <div class="rms-item"><div class="rms-label">Median</div><div class="rms-value">${dist.median.toFixed(p._dp)}</div></div>
        <div class="rms-item"><div class="rms-label">Std Dev</div><div class="rms-value">${dist.sd.toFixed(1)}</div></div>
      </div>

    <div class="detail-card">

        </linearGradient></defs>

      ${weatherNote?`<div class="insight-row"><span class="insight-label">Weather</span><span class="insight-value">${esc(weatherNote)}</span></div>`:''}
      ${injuryLine?`<div class="insight-row"><span class="insight-label">Injury report</span><span class="insight-value">${injuryLine}</span></div>`:''}
      ${p.market_line!=null?`<div class="insight-row"><span class="insight-label">Book line (FanDuel)</span><span class="insight-value">${p.market_line}</span></div>`:''}
      ${p.edge_vs_market!=null?`<div class="insight-row"><span class="insight-label">Model vs. line</span><span class="insight-value" style="color:${p.edge_vs_market>0?'var(--green)':'var(--red)'}">${p.edge_vs_market>0?'+':''}${p.edge_vs_market}</span></div>`:''}

  `;
  $('sheet-overlay').classList.add('on');
  $('sheet').classList.add('on');
  $('sheet-back').addEventListener('click', closeSheet);
  $('sheet-star').addEventListener('click', e => {

    const on = watch.toggle(k);
    e.currentTarget.style.color = on ? 'var(--green)' : 'var(--text-tertiary)';
    e.currentTarget.querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none');
  });
}
function closeSheet(){ $('sheet').classList.remove('on'); $('sheet-overlay').classList.remove('on'); }
$('sheet-overlay').addEventListener('click', closeSheet);

/* ── wiring ── */
function render(){
  ['home','explore','games','fav'].forEach(v => $('v-'+v).style.display = v===view ? '' : 'none');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  renderSportSwitcher();
  if (view === 'home') renderHome();
  else if (view === 'explore') renderExplore();
  else if (view === 'games') renderGames();
  else if (view === 'fav') renderFavorites();
}

function renderSportSwitcher(){
  $('sport-btn').innerHTML = `<img src="${LEAGUE_LOGO[sport]}" alt="" loading="lazy" onerror="this.remove()">${SPORT_LABEL[sport]} <span class="caret">▾</span>`;
  $('sport-menu').innerHTML = SPORTS.map(sp => `<div class="sport-menu-item ${sp===sport?'active':''}" data-sport="${sp}">
    <img src="${LEAGUE_LOGO[sp]}" alt="" loading="lazy" onerror="this.remove()">${SPORT_LABEL[sp]}</div>`).join('');
}
function closeSportMenu(){
  $('sport-menu').classList.remove('open');
  $('sport-btn').classList.remove('open');
}
$('sport-btn').addEventListener('click', e => {
  e.stopPropagation();
  $('sport-menu').classList.toggle('open');
  $('sport-btn').classList.toggle('open');
});
$('sport-menu').addEventListener('click', e => {
  const item = e.target.closest('[data-sport]');
  if (!item) return;
  sport = item.dataset.sport;
  localStorage.setItem('projex_sport', sport);
  market = null;
  closeSportMenu();
  render();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.sport-pill') && !e.target.closest('.sport-menu')) closeSportMenu();
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; render(); window.scrollTo({top:0}); }));
document.body.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]');
  if (goto){ view = goto.dataset.goto; render(); window.scrollTo({top:0}); return; }
  const chip = e.target.closest('[data-market]');
  if (chip){ market = chip.dataset.market; render(); return; }
  const card = e.target.closest('[data-key]');
  if (card){ openPlayer(card.dataset.key); return; }
});

async function load(){
  await Promise.all(SPORTS.map(async sp => {
    try { const r = await fetch(`./data/${sp}_slate.json?t=${Date.now()}`); DATA[sp] = await r.json(); }
    catch(e){ DATA[sp] = {games:[]}; }
  }));
  render();
}
load();
setInterval(load, 10*60*1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
