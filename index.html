<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projex — Model Boards</title>
<meta name="theme-color" content="#17181B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17181B; --panel:#1E2023; --panel-hi:#26282C; --line:#323438;
  --g1:#93E06E; --g2:#5FA34A; --grad:linear-gradient(135deg,var(--g1),var(--g2));
  --ink:#F2F3EF; --mute:#8A8D93; --faint:#55585E;
  --r:16px; --r-sm:11px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh; display:flex; flex-direction:column; position:relative;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(560px 320px at 8% -6%, rgba(147,224,110,.09), transparent 60%),
    radial-gradient(480px 360px at 108% 8%, rgba(95,163,74,.09), transparent 60%);
}

/* ---------- header ---------- */
header{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 20px; gap:10px}
.head-left{display:flex; align-items:center; gap:9px}
.head-left img.mark{width:30px; height:30px; border-radius:8px; flex:none; display:block}
.wordmark{
  font-family:'Sora',sans-serif; font-weight:800; font-size:18px; letter-spacing:.03em; text-transform:uppercase;
  color:var(--ink); line-height:1;
}
.wordmark .x{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.head-left .today{font-size:11px; color:var(--mute); font-weight:500; margin-top:3px; font-family:'IBM Plex Mono',monospace}
.hub-refresh{
  width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
  display:grid; place-items:center; cursor:pointer; color:var(--mute); font-size:15px;
  transition:transform .2s, color .2s, border-color .2s; padding:0; flex:none;
}
.hub-refresh:active{transform:scale(.88)}
.hub-refresh:focus-visible{outline:2px solid var(--g1); outline-offset:2px}
.hub-refresh.spin{animation:spin .7s linear infinite; color:var(--g1); border-color:rgba(147,224,110,.4)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- section label ---------- */
.kicker-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.kicker{font-size:10.5px; font-weight:700; color:var(--mute); letter-spacing:.14em; text-transform:uppercase; flex:none; font-family:'IBM Plex Mono',monospace}
.kicker-line{height:1px; flex:1; background:linear-gradient(90deg, var(--line), transparent)}

/* ---------- board grid ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.board{
  display:block; text-decoration:none; color:inherit; position:relative; overflow:hidden;
  border-radius:var(--r); padding:13px 13px 12px;
  background:var(--panel);
  border:1px solid var(--line);
  transition:transform .16s cubic-bezier(.2,.8,.3,1), border-color .2s;
}
.board:active{transform:scale(.97)}
.board:focus-visible{outline:2px solid var(--g1); outline-offset:2px}
.board::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(155deg, rgba(147,224,110,.28), transparent 55%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
}
.board.quiet .board-num, .board.quiet .board-name{opacity:.4}
.board.quiet::before{opacity:.3}

.board-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.board-tag{font-size:9.5px; font-weight:700; letter-spacing:.1em; color:var(--mute); display:flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace}
.board-logo{width:13px; height:13px; object-fit:contain; flex:none}
.live-dot{display:none; align-items:center; gap:4px; font-size:8.5px; font-weight:700; color:#FF6B5E; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace}
.live-dot.on{display:flex}
.live-dot i{width:5px;height:5px;border-radius:50%;background:#FF6B5E;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.board-num{
  font-family:'Sora',sans-serif; font-weight:800;
  font-size:30px; line-height:.9; color:var(--ink); letter-spacing:-.01em;
  margin-bottom:1px; font-variant-numeric:tabular-nums;
}
.board-name{font-size:11px; color:var(--mute); margin-bottom:10px}

.board-edge{display:flex; align-items:center; gap:7px; margin-bottom:10px; min-height:20px}
.edgebars{display:flex; align-items:flex-end; gap:2px; height:16px; flex:none}
.edgebars i{width:4px; border-radius:1.5px; background:var(--line); display:block}
.edgebars.lit i{background:var(--grad)}
.board-edge-txt{font-size:10px; color:var(--mute); font-family:'IBM Plex Mono',monospace; line-height:1.35}
.board-edge-txt b{color:var(--ink); font-weight:600}

.board-foot{display:flex; align-items:center; justify-content:space-between; gap:8px}
.board-updated{font-size:9.5px; font-weight:600; color:var(--faint); font-family:'IBM Plex Mono',monospace}
.board-arrow{
  width:23px; height:23px; border-radius:50%; background:var(--panel-hi); flex:none;
  display:grid; place-items:center; color:var(--g1); font-size:12px; font-weight:700;
  transition:transform .16s ease;
}
.board:active .board-arrow{transform:translateX(2px)}

/* ---------- footer ---------- */
footer{margin-top:auto; text-align:center; font-size:11px; color:var(--faint); padding-top:26px; font-weight:500; font-family:'IBM Plex Mono',monospace}
footer b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent; font-weight:700}

@media (prefers-reduced-motion:reduce){
  .board, .hub-refresh, .board-arrow{transition:none}
  .live-dot i{animation:none}
  .hub-refresh.spin{animation:none}
}
</style>
</head>
<body>
<header>
  <div class="head-left">
    <img class="mark" src="./icon-192.png" alt="">
    <div>
      <div class="wordmark">Proj<span class="x">ex</span></div>
      <div class="today" id="today"></div>
    </div>
  </div>
  <button class="hub-refresh" id="hub-refresh" aria-label="Refresh" title="Refresh">↻</button>
</header>

<div class="kicker-row">
  <div class="kicker">Model Boards</div>
  <div class="kicker-line"></div>
</div>

<div class="grid">
  <a class="board" data-sport="mlb" href="./mlb/">
    <div class="board-top">
      <span class="board-tag"><img class="board-logo" src="https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png" alt="" loading="lazy" onerror="this.remove()">MLB · DAILY</span>
      <span class="live-dot" id="mlb-live"><i></i>LIVE</span>
    </div>
    <div class="board-num" id="mlb-games">—</div>
    <div class="board-name">games today</div>
    <div class="board-edge" id="mlb-edge-wrap" style="display:none">
      <div class="edgebars" id="mlb-edge-bars"><i></i><i></i><i></i></div>
      <div class="board-edge-txt">Top edge<br><b id="mlb-edge-txt">—</b></div>
    </div>
    <div class="board-foot">
      <span class="board-updated" id="mlb-updated">syncing…</span>
      <span class="board-arrow">→</span>
    </div>
  </a>

  <a class="board" data-sport="nfl" href="./nfl/">
    <div class="board-top">
      <span class="board-tag"><img class="board-logo" src="https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png" alt="" loading="lazy" onerror="this.remove()">NFL · WEEKLY</span>
      <span class="live-dot" id="nfl-live"><i></i>LIVE</span>
    </div>
    <div class="board-num" id="nfl-games">—</div>
    <div class="board-name">games today</div>
    <div class="board-edge" id="nfl-edge-wrap" style="display:none">
      <div class="edgebars" id="nfl-edge-bars"><i></i><i></i><i></i></div>
      <div class="board-edge-txt">Top edge<br><b id="nfl-edge-txt">—</b></div>
    </div>
    <div class="board-foot">
      <span class="board-updated" id="nfl-updated">syncing…</span>
      <span class="board-arrow">→</span>
    </div>
  </a>

  <a class="board" data-sport="nhl" href="./nhl/">
    <div class="board-top">
      <span class="board-tag"><img class="board-logo" src="https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png" alt="" loading="lazy" onerror="this.remove()">NHL · DAILY</span>
      <span class="live-dot" id="nhl-live"><i></i>LIVE</span>
    </div>
    <div class="board-num" id="nhl-games">—</div>
    <div class="board-name">games today</div>
    <div class="board-edge" id="nhl-edge-wrap" style="display:none">
      <div class="edgebars" id="nhl-edge-bars"><i></i><i></i><i></i></div>
      <div class="board-edge-txt">Top edge<br><b id="nhl-edge-txt">—</b></div>
    </div>
    <div class="board-foot">
      <span class="board-updated" id="nhl-updated">syncing…</span>
      <span class="board-arrow">→</span>
    </div>
  </a>

  <a class="board" data-sport="nba" href="./nba/">
    <div class="board-top">
      <span class="board-tag"><img class="board-logo" src="https://a.espncdn.com/i/teamlogos/leagues/500/nba.png" alt="" loading="lazy" onerror="this.remove()">NBA · DAILY</span>
      <span class="live-dot" id="nba-live"><i></i>LIVE</span>
    </div>
    <div class="board-num" id="nba-games">—</div>
    <div class="board-name">games today</div>
    <div class="board-edge" id="nba-edge-wrap" style="display:none">
      <div class="edgebars" id="nba-edge-bars"><i></i><i></i><i></i></div>
      <div class="board-edge-txt">Top edge<br><b id="nba-edge-txt">—</b></div>
    </div>
    <div class="board-foot">
      <span class="board-updated" id="nba-updated">syncing…</span>
      <span class="board-arrow">→</span>
    </div>
  </a>
</div>

<footer>Auto-updated by the model · <b>Add to Home Screen</b> to install</footer>

<script>
const rel = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
};
document.getElementById('today').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });

function setEdgeBars(sport, score){
  const bars = document.querySelectorAll(`#${sport}-edge-bars i`);
  const heights = [35, 65, 100];
  bars.forEach((b, i) => b.style.height = Math.max(18, heights[i] * Math.min(1, score/100)) + '%');
  document.getElementById(`${sport}-edge-bars`).classList.toggle('lit', score >= 25);
}

function loadHub(){
  for (const s of ['mlb','nfl','nhl','nba']) {
    fetch(`./data/${s}_slate.json?t=${Date.now()}`)
      .then(r => r.json())
      .then(d => {
        const games = d.games || [];
        const count = games.length;
        const live = games.filter(g => g.game_state === 'Live').length;
        const card = document.querySelector(`.board[data-sport="${s}"]`);
        document.getElementById(s+'-games').textContent = count;
        document.getElementById(s+'-updated').textContent = d.generated_at ? rel(d.generated_at) : 'preseason';
        document.getElementById(s+'-live').classList.toggle('on', live > 0);
        if (card) card.classList.toggle('quiet', count === 0);

        // Best Edge Confidence Score on this slate today
        const edges = games.map(g => g.edge).filter(Boolean);
        const wrap = document.getElementById(`${s}-edge-wrap`);
        if (edges.length) {
          const best = edges.reduce((a, b) => (b.score ?? 0) > (a.score ?? 0) ? b : a);
          const team = (best.team || '').split(' ').pop();
          document.getElementById(`${s}-edge-txt`).textContent = `${team} ${best.score}/100`;
          setEdgeBars(s, best.score ?? 0);
          wrap.style.display = 'flex';
        } else {
          wrap.style.display = 'none';
        }
      })
      .catch(() => { document.getElementById(s+'-updated').textContent = 'no data yet'; });
  }
}
loadHub();
const hubRefresh = document.getElementById('hub-refresh');
if (hubRefresh) hubRefresh.onclick = () => {
  hubRefresh.classList.add('spin');
  loadHub();
  setTimeout(() => hubRefresh.classList.remove('spin'), 700);
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
