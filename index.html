<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slate — Projections</title>
<meta name="theme-color" content="#07080D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07080D; --surface:#101219; --surface-2:#161923; --line:#242836;
  --green:#3DF08B; --cyan:#3DD9F0; --violet:#7C5CFF; --amber:#FFC65C; --red:#FF4E6A;
  --ink:#F4F5F8; --mute:#8E93A3; --faint:#7C8296;
  --nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--void)}
body{
  background:var(--void);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh;max-width:560px;margin:0 auto;position:relative;
  padding:max(12px,env(safe-area-inset-top)) 14px
          calc(var(--nav-h) + max(16px,env(safe-area-inset-bottom)));
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at -10% -10%, rgba(124,92,255,.20), transparent 62%),
    radial-gradient(620px 460px at 112% 4%, rgba(61,217,240,.13), transparent 60%),
    radial-gradient(760px 520px at 50% 118%, rgba(61,240,139,.09), transparent 66%);
}

/* ── top bar ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 16px}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--green),var(--cyan) 55%,var(--violet));
  font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:var(--void)}
.brand h1{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em}
.top-actions{display:flex;align-items:center;gap:7px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-size:14px;cursor:pointer;text-decoration:none;flex:none}
.icon-btn:active{transform:scale(.9)}
.league{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:99px;padding:8px 12px;cursor:pointer}

/* ── shared ── */
h2{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:20px 0 10px;display:flex;
  align-items:center;justify-content:space-between}
h2 a{color:var(--cyan);text-decoration:none;font-size:9.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.muted{color:var(--mute)}

/* ── explore list ── */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
  color:var(--mute);background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.f.on{color:var(--void);border-color:transparent;background:var(--violet);font-weight:800}

/* ── detail sheet ── */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(7,8,13,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;
  background:var(--void);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--line);padding:8px 14px max(20px,env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh-av{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--cyan)}
.sh-av img{width:100%;height:100%;object-fit:cover}
.sh-n{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.sh-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:3px}
.sh-score{margin-left:auto;text-align:center;flex:none;padding:8px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--c,var(--green)) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--green)) 38%,transparent)}
.sh-score b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:21px;color:var(--c,var(--green))}
.sh-score span{font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.hero{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;
  background:linear-gradient(160deg,rgba(124,92,255,.12),rgba(61,217,240,.05) 60%,transparent);
  border:1px solid var(--line);margin-bottom:9px}
.hero-n{font-family:'Sora',sans-serif;font-weight:800;font-size:32px;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hero-l{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.hero-c{text-align:center;flex:none;min-width:54px}
.hero-c b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums}

.cells{display:flex;gap:6px;margin-bottom:9px}
.cell{flex:1;min-width:0;text-align:center;padding:10px 5px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line)}
.cell b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums}
.cell span{display:block;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ── prop cards (Props tab, 2-up grid) ──
   Two columns instead of one long full-width row per player -- cards read
   closer to square, so a screen shows a slate at a glance instead of a
   scroll of skinny bars. Everything below is scoped to .pcard specifically
   (not the bare .sh-*/.hero/.cells classes) so the detail sheet, which
   reuses those same class names at full width, is untouched. */
.props-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pcard{padding:12px;cursor:pointer;min-width:0}
.pcard:active{background:var(--surface-2)}

.pcard .sh-head{gap:8px;margin-bottom:8px}
.pcard .sh-av{width:34px;height:34px;border-radius:10px}
.pcard .sh-n{font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sh-m{font-size:9px;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sh-score{padding:5px 7px;border-radius:9px}
.pcard .sh-score b{font-size:14px}
.pcard .sh-score span{font-size:5.5px}

.pcard-mkt{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;
  font-weight:700;color:var(--faint);letter-spacing:.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.pcard .sheet-tags{margin:8px 0;gap:3px}
.pcard .sheet-tags .tag{font-size:6.5px;padding:2px 4px}

.pcard .hero{padding:10px;border-radius:12px;gap:6px;margin-bottom:8px}
.pcard .hero-n{font-size:22px}
.pcard .hero-l{font-size:6.5px;margin-top:3px}
.pcard .hero-c{min-width:0}
.pcard .hero-c b{font-size:12px}

.pcard .cells{gap:5px;flex-wrap:wrap}
.pcard .cell{flex:1 1 calc(50% - 3px);padding:7px 4px;border-radius:10px}
.pcard .cell b{font-size:11.5px}
.pcard .cell span{font-size:6px;margin-top:2px}

.simhist{display:flex;align-items:flex-end;gap:2px;height:38px;margin:8px 0}
.simbar{flex:1;min-width:0;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#3DD9F0,#3DD9F033)}
.sim-hit{display:flex;align-items:center;justify-content:space-between;margin-top:8px;
  padding:6px 8px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.sim-hit span{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--mute);font-weight:700}
.sim-hit b{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:800}
.sim-foot{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:7px;color:var(--faint);
  text-align:center;letter-spacing:.04em}
.sim-compare{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:8px;
  color:var(--faint);text-align:center}
.simcard .gt{padding:4px 0}

/* ── Simulation Lab (opens in the bottom sheet) ── */
.lab-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.lab-controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  margin-bottom:16px;overflow:hidden}
.lab-controls-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.04em;color:var(--mute)}
.lab-controls-h i{font-style:normal;font-size:15px;color:var(--faint);width:16px;text-align:center}
.lab-controls-body{max-height:0;overflow:hidden;padding:0 14px;transition:max-height .25s ease,padding .25s ease}
.lab-controls.open .lab-controls-body{max-height:600px;padding:2px 14px 14px}
.lab-ctrl-row{margin-bottom:11px}
.lab-ctrl-l{display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.lab-ctrl-l i{font-style:normal;text-transform:none;letter-spacing:0;opacity:.7}
.lab-chips{display:flex;gap:5px;flex-wrap:wrap}
.lab-chip{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;color:var(--mute);
  background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:6px 10px;cursor:pointer}
.lab-chip.on{color:var(--void);background:var(--violet);border-color:transparent;font-weight:800}
.lab-seed{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px}
.lab-seed::placeholder{color:var(--faint)}
.lab-run-btn{width:100%;padding:11px;border-radius:11px;background:var(--green);color:var(--void);
  border:0;font-family:'Sora',sans-serif;font-weight:800;font-size:13px;cursor:pointer;margin-top:4px}
.lab-run-btn:active{transform:scale(.98)}

.lab-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:6px}
.lab-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 8px;text-align:center}
.lab-stat-v{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.lab-stat-l{margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

.lab-chart-wrap{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px;margin-bottom:8px}
.lab-chart-svg{width:100%;height:130px;display:block;touch-action:none;cursor:crosshair}
.lab-chart-legend{display:flex;gap:12px;justify-content:center;margin-top:4px}
.lab-chart-legend span{display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;
  font-size:8px;font-weight:700;color:var(--faint)}
.lab-chart-legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.lab-tooltip{position:absolute;top:8px;opacity:0;pointer-events:none;transition:opacity .1s;
  background:var(--void);border:1px solid var(--line);border-radius:9px;padding:6px 9px;
  font-family:'IBM Plex Mono',monospace;white-space:nowrap;z-index:2}
.lab-tooltip b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}
.lab-tooltip span{display:block;font-size:8.5px;color:var(--mute)}

.lab-pctile-row{display:flex;gap:4px;margin-bottom:18px}
.lab-pctile{flex:1;text-align:center;padding:8px 2px;border-radius:9px;background:var(--surface-2)}
.lab-pctile b{display:block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px}
.lab-pctile span{display:block;margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:6.5px;
  color:var(--faint);font-weight:700}

.lab-table{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:6px}
.lab-thead,.lab-trow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr;
  padding:8px 9px;text-align:right}
.lab-table-alt .lab-thead,.lab-table-alt .lab-trow{grid-template-columns:1fr 1fr 1fr 1fr}
.lab-thead span,.lab-trow span{font-family:'IBM Plex Mono',monospace;font-size:9px}
.lab-thead{background:var(--surface-2);color:var(--faint);font-weight:700;font-size:7.5px;
  letter-spacing:.06em;text-transform:uppercase}
.lab-thead span:first-child,.lab-trow span:first-child{text-align:left}
.lab-trow{border-top:1px solid var(--line);font-weight:600;color:var(--mute)}
.lab-trow span:first-child{color:var(--ink);font-weight:700}
.lab-trow.hl{background:rgba(61,240,139,.08)}
.lab-trow.hl span:first-child{color:var(--green)}
.lab-trow .dim{color:var(--faint)}
.lab-note{font-size:10.5px;color:var(--faint);line-height:1.5;margin-bottom:18px}

.lab-sens-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.lab-sens-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:var(--mute);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 12px;cursor:pointer}
.lab-sens-btn.on{color:var(--void);background:var(--cyan);border-color:transparent}
.lab-sens-btn.lab-reset{color:var(--red);border-color:rgba(255,78,106,.4)}

.lab-inputs{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:2px 13px;margin-bottom:10px}
.lab-input-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.lab-input-row:last-child{border-bottom:0}
.lab-input-row span{color:var(--faint)}
.lab-input-row b{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--ink)}

/* skeleton, shown for the brief moment between tapping a card and the
   simulation's first render */
.lab-skel{padding-top:4px}
@keyframes labpulse{0%,100%{opacity:.5}50%{opacity:1}}
.lab-skel-row{height:16px;border-radius:8px;background:var(--surface-2);margin-bottom:16px;
  animation:labpulse 1.1s ease-in-out infinite}
.lab-skel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
.lab-skel-card{height:56px;border-radius:12px;background:var(--surface-2);
  animation:labpulse 1.1s ease-in-out infinite}
.lab-skel-chart{height:150px;border-radius:14px;background:var(--surface-2);
  animation:labpulse 1.1s ease-in-out infinite}

.rings{display:flex;gap:6px}
.ring{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);position:relative}
.ring-v{position:absolute;top:24px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px}
.ring-l{margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:7.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.notes{padding:12px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;line-height:1.6;color:var(--mute)}
.notes b{color:var(--ink);font-weight:600}

/* ── bottom nav ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:70;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(12,14,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;align-items:stretch}
.nav-in{max-width:560px;margin:0 auto;width:100%;display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;cursor:pointer;color:var(--faint);font-family:inherit;padding:0}
.nb i{font-style:normal;font-size:17px;line-height:1}
.nb span{font-size:9px;font-weight:600;letter-spacing:.02em}
.nb.on{color:var(--green)}
.nb.on i{filter:drop-shadow(0 0 7px rgba(61,240,139,.55))}

/* ── logos ──
   Team marks sit inline with text at cap height. Every one degrades to its
   abbreviation rather than a broken-image icon, because a slate with four
   missing logos should still read cleanly. */
.tm{display:inline-block;vertical-align:-2px;object-fit:contain;flex:none}
.tm-t{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;
  color:var(--faint);letter-spacing:.03em}

.who-m .vs{color:var(--faint);font-size:9.5px;margin:0 1px}

.sh-m .vs{color:var(--faint)}

.av-logo{width:22px;height:22px;object-fit:contain}

.league .lg{object-fit:contain;flex:none}
.upd-badge img{object-fit:contain}

/* ── run status ── */
.run-status{max-height:0;overflow:hidden;opacity:0;transition:max-height .2s,opacity .2s;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-align:center;
  color:var(--green);border-radius:10px}
.run-status.show{max-height:60px;opacity:1;padding:9px 11px;margin-bottom:11px;
  background:rgba(61,240,139,.10);border:1px solid rgba(61,240,139,.35)}
.run-status.bad{color:var(--amber);background:rgba(255,198,92,.10);border-color:rgba(255,198,92,.35)}
#refresh.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pr-mb{flex:none;min-width:52px;padding:5px 8px}
.pr-mb .mb-l{font-size:9px}
.pr-mb .mb-p{font-size:11.5px}

.gc-edge{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace}
.gc-edge i{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint)}
.gc-edge b{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.gc-badges .gc-edge{margin-left:auto}
.gt{display:flex;align-items:center;gap:9px;padding:6px 0}
.gc-bar{height:5px;border-radius:99px;overflow:hidden;margin:8px 0 11px;background:var(--violet)}
.gc-bar div{height:100%;border-radius:99px}
.gc-stats span[title]{cursor:help;border-bottom:1px dotted var(--line)}

/* ── market badges: every priced side, one clean row ── */
.mkts{display:flex;gap:6px;flex-wrap:wrap;padding-top:11px;margin-top:2px;border-top:1px solid var(--line)}
.mb{flex:1 1 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 9px;border-radius:9px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.mb-l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.03em;
  color:var(--mute);white-space:nowrap}
.mb-p{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.mb.on{background:var(--green);border-color:var(--green)}
.mb.on .mb-l,.mb.on .mb-p{color:var(--void)}
.mb:active{transform:scale(.96)}

/* ── nfl advanced chips ── */
.adv-row{display:flex;align-items:stretch;gap:5px;flex-wrap:nowrap;margin-bottom:9px}
.adv-chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:7px 4px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line)}
.adv-chip i{font-style:normal;font-size:7.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}

/* ── tags, edge pills, distribution, game cards ── */

<div class="top">

  </div>

<script src="./picks.js"></script>
<script>
// picks.js is still loaded for RUN_TRIGGER_URL, which the refresh button uses
// to kick off a fresh model run. The bet-slip store it also defines is no
// longer used here -- this app is projections and props only.

// ── team identity ──────────────────────────────────────────────────────────
// Lifted verbatim from the boards, where these maps are already proven against
// live data. MLB needs a club id for its logo CDN; the other three key off the
// abbreviation directly.
const MLB_TEAMID = {"ARI":109,"ATH":133,"ATL":144,"BAL":110,"BOS":111,"CHC":112,"CWS":145,"CIN":113,"CLE":114,"COL":115,"DET":116,"HOU":117,"KC":118,"LAA":108,"LAD":119,"MIA":146,"MIL":158,"MIN":142,"NYM":121,"NYY":147,"PHI":143,"PIT":134,"SD":135,"SF":137,"SEA":136,"STL":138,"TB":139,"TEX":140,"TOR":141,"WSH":120};
const MLB_ABBR = {"Arizona Diamondbacks":"ARI","Athletics":"ATH","Oakland Athletics":"ATH","Atlanta Braves":"ATL","Baltimore Orioles":"BAL","Boston Red Sox":"BOS","Chicago Cubs":"CHC","Chicago White Sox":"CWS","Cincinnati Reds":"CIN","Cleveland Guardians":"CLE","Colorado Rockies":"COL","Detroit Tigers":"DET","Houston Astros":"HOU","Kansas City Royals":"KC","Los Angeles Angels":"LAA","Los Angeles Dodgers":"LAD","Miami Marlins":"MIA","Milwaukee Brewers":"MIL","Minnesota Twins":"MIN","New York Mets":"NYM","New York Yankees":"NYY","Philadelphia Phillies":"PHI","Pittsburgh Pirates":"PIT","San Diego Padres":"SD","San Francisco Giants":"SF","Seattle Mariners":"SEA","St. Louis Cardinals":"STL","Tampa Bay Rays":"TB","Texas Rangers":"TEX","Toronto Blue Jays":"TOR","Washington Nationals":"WSH"};
const NFL_ABBR = {"Arizona Cardinals":"ARI","Atlanta Falcons":"ATL","Baltimore Ravens":"BAL","Buffalo Bills":"BUF","Carolina Panthers":"CAR","Chicago Bears":"CHI","Cincinnati Bengals":"CIN","Cleveland Browns":"CLE","Dallas Cowboys":"DAL","Denver Broncos":"DEN","Detroit Lions":"DET","Green Bay Packers":"GB","Houston Texans":"HOU","Indianapolis Colts":"IND","Jacksonville Jaguars":"JAX","Kansas City Chiefs":"KC","Las Vegas Raiders":"LV","Los Angeles Chargers":"LAC","Los Angeles Rams":"LAR","Miami Dolphins":"MIA","Minnesota Vikings":"MIN","New England Patriots":"NE","New Orleans Saints":"NO","New York Giants":"NYG","New York Jets":"NYJ","Philadelphia Eagles":"PHI","Pittsburgh Steelers":"PIT","San Francisco 49ers":"SF","Seattle Seahawks":"SEA","Tampa Bay Buccaneers":"TB","Tennessee Titans":"TEN","Washington Commanders":"WSH"};

// Primary team colours, used for the win-probability bar so a card reads as
// the two clubs rather than as generic accents. MLB is filled in because it's
// the live sport; the rest fall back to the app palette until verified. A
// wrong colour is only cosmetic, but a guessed one still shouldn't ship
// pretending to be authoritative.
const TEAM_COLOR = {
  mlb: {
    ARI:'#A71930', ATL:'#CE1141', BAL:'#DF4601', BOS:'#BD3039', CHC:'#0E3386',
    CWS:'#27251F', CIN:'#C6011F', CLE:'#00385D', COL:'#333366', DET:'#0C2340',
    HOU:'#EB6E1F', KC:'#004687',  LAA:'#BA0021', LAD:'#005A9C', MIA:'#00A3E0',
    MIL:'#12284B', MIN:'#002B5C', NYM:'#FF5910', NYY:'#003087', ATH:'#003831',
    PHI:'#E81828', PIT:'#FDB827', SD:'#2F241D',  SF:'#FD5A1E',  SEA:'#0C2C56',
    STL:'#C41E3A', TB:'#092C5C',  TEX:'#003278', TOR:'#134A8E', WSH:'#AB0003',
  },
  nfl: {}, nhl: {}, nba: {},
};
function teamColor(sp, abbr, fallback){
  return (TEAM_COLOR[sp] || {})[abbr] || fallback;
}

function teamAbbr(sp, name){
  if (!name) return '';
  if (sp === 'mlb') return MLB_ABBR[name] || String(name).slice(0,3).toUpperCase();
  if (sp === 'nfl') return NFL_ABBR[name] || String(name).slice(0,3).toUpperCase();
  return String(name).toUpperCase();      // NHL and NBA already store abbreviations
}

function teamLogo(sp, abbr){
  if (!abbr) return '';
  if (sp === 'mlb'){
    const id = MLB_TEAMID[abbr];
    return id ? `https://www.mlbstatic.com/team-logos/${id}.svg` : '';
  }
  const path = {nfl:'nfl', nhl:'nhl', nba:'nba'}[sp];
  return path ? `https://a.espncdn.com/i/teamlogos/${path}/500/${abbr.toLowerCase()}.png` : '';
}

// A logo that degrades to the abbreviation rather than a broken image icon.
function teamMark(sp, abbr, size){
  const src = teamLogo(sp, abbr);
  const sz = size || 16;
  return src
    ? `<img class="tm" src="${src}" alt="${esc(abbr)}" loading="lazy" width="${sz}" height="${sz}"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'tm-t',textContent:'${esc(abbr)}'}))">`
    : `<span class="tm-t">${esc(abbr)}</span>`;
}

const SPORTS = ['mlb','nfl','nhl','nba'];
const SPORT_COLOR = {mlb:'#3DF08B', nfl:'#7C5CFF', nhl:'#3DD9F0', nba:'#FFC65C'};
const LEAGUE_LOGO = {
  mlb:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',
  nfl:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',
  nhl:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png',
  nba:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',
};
const DATA = {};
let sport = localStorage.getItem('slate_sport') || 'mlb';
let market = null;
let view = 'games';
let simMode = 'games';

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = id => document.getElementById(id);

/* ── watchlist ─────────────────────────────────────────────────────────────
   Kept separate from the bet slip on purpose. A watchlist is "show me this
   again"; the slip is "I backed this". Merging them would make the record
   meaningless. */
const WKEY = 'slate_watchlist_v1';
const watch = {
  all: () => { try { return JSON.parse(localStorage.getItem(WKEY)) || []; } catch(e){ return []; } },
  has: k => watch.all().includes(k),
  toggle(k){
    const a = watch.all(), i = a.indexOf(k);
    if (i >= 0) a.splice(i,1); else a.push(k);
    try { localStorage.setItem(WKEY, JSON.stringify(a)); } catch(e){}
    return i < 0;
  },
};

/* ── market definitions per sport ── */
const MARKETS = {
  mlb: [
    ['H+R+RBI', p=>p.expected_hrr, 2], ['Total Bases', p=>p.expected_tb, 2],
    ['Hits', p=>p.expected_hits, 2], ['Home Runs', p=>p.expected_hr, 2],
    ['RBI', p=>p.expected_rbi, 2], ['Runs', p=>p.expected_runs, 2],
  ],
  nfl: [
    ['Pass Yds', p=>p.pass_yds, 0], ['Rec Yds', p=>p.rec_yds, 0], ['Rush Yds', p=>p.rush_yds, 0],
    ['Targets', p=>p.targets, 1], ['Anytime TD', p=>p.td_prob, 2],
  ],
  nhl: [
    ['Shots', p=>p.shots_pg, 1], ['Points', p=>p.pts_pg, 2], ['Goals', p=>p.goal_prob, 2],
  ],
  nba: [
    ['Points', p=>p.pts, 1], ['Rebounds', p=>p.reb, 1],
    ['Assists', p=>p.ast, 1], ['3-Pointers', p=>p.tpm, 1],
  ],
};
const POOLS = {
  mlb: ['away_lineup','home_lineup'], nfl: ['away_skill','home_skill','away_qb_proj','home_qb_proj'],
  nhl: ['away_skaters','home_skaters'], nba: ['away_players','home_players'],
};

function headshot(sp, p){
  if (!p.player_id) return '';
  if (sp === 'mlb') return `https://midfield.mlbstatic.com/v1/people/${p.player_id}/spots/60`;
  const path = {nfl:'nfl', nhl:'nhl', nba:'nba'}[sp];
  return `https://a.espncdn.com/i/headshots/${path}/players/full/${p.player_id}.png`;
}
const initials = n => String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';

// Headshot first, then the team logo, then initials. A missing portrait
// shouldn't leave a grey disc where every other row has a face.
function avatar(sp, p, cls){
  const src = headshot(sp, p);
  const logo = teamLogo(sp, p._tab || teamAbbr(sp, p._team));
  const fallback = logo
    ? `<img src='${logo}' alt='' loading='lazy' class='av-logo'>`
    : initials(p.name);
  return src
    ? `<span class="${cls}"><img src="${src}" alt="" loading="lazy"
         onerror="this.outerHTML=&quot;${fallback.replace(/"/g,'&quot;')}&quot;"></span>`
    : `<span class="${cls}">${fallback}</span>`;
}

/* ── player tags ───────────────────────────────────────────────────────────
   The same archetypes the classic boards assign, on the same thresholds, so a
   player reads identically in both places. Each keeps its own hue -- the tag
   colour IS the information, which is why they aren't flattened to one accent. */
function tagsFor(p){
  const t = [];
  if (p._sp === 'mlb'){
    if ((p.hr_prob ?? 0) >= .07) t.push(['HR THREAT','#FF6B84']);
    if ((p.xwoba ?? 0) >= .380) t.push(['BARREL KING','#FFE24A']);
    if ((p.offense_quality ?? 0) >= 75) t.push(['HARD HIT','#FF9A3D']);
    if ((p.k_rate ?? 1) <= .15) t.push(['CONTACT','#3DE8D0']);
    if ((p.order ?? 9) === 4) t.push(['CLEANUP','#9B7CFF']);
    if ((p.order ?? 9) <= 2 && (p.hit_rate ?? 0) >= .26) t.push(['TABLE SETTER','#3DF08B']);
  } else if (p._sp === 'nfl'){
    if (posOf(p) === 'QB'){
      if ((p.pass_yds ?? 0) >= 260) t.push(['GUNSLINGER','#3DD9F0']);
      if ((p.pass_td ?? 0) >= 2) t.push(['TD MACHINE','#FF6B84']);
      if ((p.int ?? 0) >= 1) t.push(['TURNOVER RISK','#FF9A3D']);
    } else {
      if ((p.td_prob ?? 0) >= .45) t.push(['RED ZONE','#FF6B84']);
      if ((p.targets ?? 0) >= 7) t.push(['TARGET HOG','#3DD9F0']);
      if ((p.rush_att ?? 0) >= 15) t.push(['BELLCOW','#FF9A3D']);
      if ((p.rec_yds ?? 0) >= 70) t.push(['WR1','#3DF08B']);
      if ((p.opp_factor ?? 1) >= 1.05) t.push(['HIGH USAGE','#FFE24A']);
    }
  } else if (p._sp === 'nhl'){
    if ((p.goal_prob ?? 0) >= .45) t.push(['SNIPER','#FFE24A']);
    if ((p.shots_pg ?? 0) >= 3.5) t.push(['VOLUME','#FF9A3D']);
    if ((p.pts_pg ?? 0) >= 1.0) t.push(['TOP LINE','#3DF08B']);
  } else if (p._sp === 'nba'){
    if ((p.pts ?? 0) >= 25) t.push(['BUCKET GETTER','#3DF08B']);
    if ((p.reb ?? 0) >= 10) t.push(['GLASS CLEANER','#3DE8D0']);
    if ((p.ast ?? 0) >= 7) t.push(['FLOOR GENERAL','#9B7CFF']);
    if ((p.tpm ?? 0) >= 3) t.push(['SNIPER','#FFE24A']);
    if ((p.min ?? 0) >= 34) t.push(['WORKHORSE','#FF9A3D']);
  }
  if (p.matchup_grade && /^A/.test(p.matchup_grade)) t.push(['SMASH SPOT','#3DF08B']);
  return t;
}
const tagHtml = t => t.map(([l,c]) =>
  `<span class="tag" style="color:${c};background:${c}18;border-color:${c}55">${l}</span>`).join('');

/* ── edge vs the market ────────────────────────────────────────────────────
   Only computed against a REAL book price. MLB carries prop lines when FanDuel
   has posted them; everything else has no market to measure against, and an
   edge against an assumed price is a number nobody should act on. */
const PROP_LABEL = {
  'H+R+RBI':'H+R+RBI', 'Total Bases':'Total Bases', 'Hits':'Hits',
  'Home Runs':'Home Run', 'RBI':'RBI',
};
function edgeOf(p){
  const g = p._game, want = PROP_LABEL[p._market];
  if (!g || !want) return null;
  for (const pl of (g.prop_plays || []))
    if (pl.name === p.name && pl.market === want && pl.book_src === 'FanDuel')
      return { edge: pl.edge, line: pl.line, side: pl.side, odds: pl.book_odds };
  return null;
}
const APP_EDGE_BANDS = [
  [2,   '#8A8D93', 'inside the noise'],
  [4,   '#3DF08B', 'plausible size for a real edge'],
  [8,   '#FFC65C', 'unusually big \u2014 worth a look'],
  [1e9, '#FF4E6A', 'implausible \u2014 likely a stale line'],
];
// Named apart from picks.js's edgeBand so neither shadows the other. Same
// bands, but this one returns the note too, for the pill tooltip.
function appEdgeBand(v){
  const a = Math.abs(v || 0);
  return APP_EDGE_BANDS.find(b => a < b[0]) || APP_EDGE_BANDS[APP_EDGE_BANDS.length-1];
}

/* ── distribution: floor, median, ceiling ──────────────────────────────────
   A single projection hides its own uncertainty. Counting stats behave close
   enough to Poisson to draw a real distribution; continuous ones (yards,
   points) use a normal with a sport-typical spread. The curve is the honest
   part -- two players can share a median and have completely different floors. */
function poisPmf(k, l){
  if (l <= 0) return k === 0 ? 1 : 0;
  let lf = 0; for (let i = 2; i <= k; i++) lf += Math.log(i);
  return Math.exp(-l + k * Math.log(l) - lf);
}
function distribution(p){
  const v = p._val;
  const counting = p._dp >= 2 || v < 12;
  const pts = [];
  if (counting){
    const max = Math.max(4, Math.ceil(v * 3));
    for (let k = 0; k <= max; k++) pts.push([k, poisPmf(k, v)]);
  } else {
    const sd = Math.max(1, v * 0.42);
    for (let i = -3; i <= 3; i += 0.25){
      const x = v + i * sd;
      if (x < 0) continue;
      pts.push([x, Math.exp(-0.5 * i * i)]);
    }
    const tot = pts.reduce((a,b)=>a+b[1],0) || 1;
    pts.forEach(pt => pt[1] /= tot);
  }
  // percentiles off the cumulative curve
  let cum = 0; const q = {};
  for (const [x, pr] of pts){
    const prev = cum; cum += pr;
    for (const t of [0.25, 0.5, 0.9]) if (q[t] == null && cum >= t && prev < t) q[t] = x;
  }
  return { pts, floor: q[0.25] ?? 0, med: q[0.5] ?? v, ceil: q[0.9] ?? v };
}
function distChart(p){
  const d = distribution(p);
  const maxP = Math.max(...d.pts.map(x => x[1])) || 1;
  const W = 300, H = 90;
  const xs = d.pts.map(x => x[0]);
  const lo = Math.min(...xs), hi = Math.max(...xs) || 1;
  const sx = x => ((x - lo) / (hi - lo || 1)) * W;
  const sy = pr => H - (pr / maxP) * (H - 8);
  const line = d.pts.map(([x,pr],i) => `${i?'L':'M'}${sx(x).toFixed(1)},${sy(pr).toFixed(1)}`).join(' ');
  const area = `${line} L${W},${H} L0,${H} Z`;
  const mark = (x, col, w) =>
    `<line x1="${sx(x).toFixed(1)}" y1="4" x2="${sx(x).toFixed(1)}" y2="${H}"
       stroke="${col}" stroke-width="${w}" stroke-dasharray="${w>1?'':'3 3'}" opacity="${w>1?1:.7}"/>`;
  const fmt = n => p._dp >= 2 ? n.toFixed(1) : n.toFixed(0);
  return `<div class="dist">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="dist-svg">
      <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3DD9F0" stop-opacity=".38"/>
        <stop offset="100%" stop-color="#3DD9F0" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#dg)"/>
      <path d="${line}" fill="none" stroke="#3DD9F0" stroke-width="2" stroke-linejoin="round"/>
      ${mark(d.floor, '#FF9A3D', 1)}${mark(d.med, '#3DF08B', 2)}${mark(d.ceil, '#9B7CFF', 1)}
    </svg>
    <div class="fmc">
      <div class="fmc-c"><b style="color:#FF9A3D">${fmt(d.floor)}</b><span>Floor</span></div>
      <div class="fmc-c"><b style="color:#3DF08B">${fmt(d.med)}</b><span>Median</span></div>
      <div class="fmc-c"><b style="color:#9B7CFF">${fmt(d.ceil)}</b><span>Ceiling</span></div>
    </div>
  </div>`;
}

/* ── build a flat, ranked list of every projection for a sport ── */
function players(sp){
  const d = DATA[sp];
  if (!d || !d.games) return [];
  const defs = MARKETS[sp] || [];
  const m = defs.find(x => x[0] === market) || defs[0];
  if (!m) return [];
  const out = [];
  for (const g of d.games){
    if (g.game_state === 'Final') continue;
    for (const pool of POOLS[sp]){
      const away = pool.startsWith('away');
      const team = sp === 'mlb' || sp === 'nfl'
        ? (away ? g.away_team : g.home_team) : (away ? g.away_abbr : g.home_abbr);
      const opp = sp === 'mlb' || sp === 'nfl'
        ? (away ? g.home_team : g.away_team) : (away ? g.home_abbr : g.away_abbr);
      // Most pools are arrays (the skill-position lineup). QB projections
      // are a single object per team, not a list -- normalized here so the
      // rest of the function doesn't need to know the difference.
      const raw = g[pool];
      const poolArr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      for (const p of poolArr){
        const v = m[1](p);
        if (v == null || isNaN(v)) continue;
        out.push({...p, _sp:sp, _team:team, _opp:opp,
                  _tab:teamAbbr(sp, team), _oab:teamAbbr(sp, opp),
                  _market:m[0], _val:v, _dp:m[2],
                  _key:`${sp}|${m[0]}|${p.name}`, _game:g});
      }
    }
  }
  out.sort((a,b) => b._val - a._val);
  return out;
}

/* Confidence: a transparent composite, not a black box. Percentile within the
   slate, nudged by the matchup grade the model already assigns. */
function confOf(p, arr){
  const i = arr.indexOf(p);
  const pct = arr.length > 1 ? 1 - (i / (arr.length - 1)) : 1;
  let s = 45 + pct * 45;
  const g = (p.matchup_grade || '')[0];
  if (g === 'A') s += 8; else if (g === 'B') s += 3; else if (g === 'D') s -= 6;
  return Math.max(1, Math.min(99, Math.round(s)));
}
const confColor = s => s >= 80 ? '#3DF08B' : s >= 65 ? '#3DD9F0' : s >= 50 ? '#FFC65C' : '#FF4E6A';

function ring(v, pct, label, color, size){
  const sz = size || 52, r = sz/2 - 4, c = 2*Math.PI*r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<div class="ring">
    <svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 ${sz/2} ${sz/2})"/>
    </svg>
    <div class="ring-v" style="color:${color}">${v}</div>
    <div class="ring-l">${label}</div>
  </div>`;
}

// QB position lives under adv.pos in the raw data (QB projections don't
// carry a top-level pos field the way skill players do) -- this reads
// whichever is there so callers don't need to know which shape they got.
const posOf = p => p.pos || (p.adv && p.adv.pos) || '';

// The same stat breakdown used on both the Props card and the detail
// sheet, so the two never drift apart. NFL splits by position -- a QB's
// relevant numbers (pass yards, completion%) have nothing to do with a
// receiver's (targets, catches), so one fixed set of four fields was
// either blank or misleading depending who you were looking at.
function statCellsFor(p){
  const cells = [];
  if (p._sp === 'mlb'){
    if (p.pa != null) cells.push(['PA', p.pa.toFixed(1)]);
    if (p.xwoba != null) cells.push(['xwOBA', p.xwoba.toFixed(3)]);
    if (p.hr_prob != null) cells.push(['HR/PA', (p.hr_prob*100).toFixed(1)+'%']);
    if (p.k_rate != null) cells.push(['K%', (p.k_rate*100).toFixed(0)+'%']);
  } else if (p._sp === 'nfl'){
    const pos = posOf(p);
    if (pos === 'QB'){
      if (p.pass_yds != null) cells.push(['PASS YDS', p.pass_yds.toFixed(0)]);
      if (p.comp_pct != null) cells.push(['COMP%', p.comp_pct.toFixed(1)+'%']);
      if (p.pass_td != null) cells.push(['PASS TD', p.pass_td.toFixed(1)]);
      if (p.int != null) cells.push(['INT', p.int.toFixed(1)]);
    } else if (pos === 'RB'){
      if (p.rush_att != null) cells.push(['ATT', p.rush_att.toFixed(1)]);
      if (p.rush_yds != null) cells.push(['RUSH YDS', p.rush_yds.toFixed(0)]);
      if (p.targets != null) cells.push(['TGT', p.targets.toFixed(1)]);
      if (p.td_prob != null) cells.push(['TD%', (p.td_prob*100).toFixed(0)+'%']);
    } else {
      if (p.targets != null) cells.push(['TGT', p.targets.toFixed(1)]);
      if (p.rec != null) cells.push(['REC', p.rec.toFixed(1)]);
      if (p.rec_yds != null) cells.push(['REC YDS', p.rec_yds.toFixed(0)]);
      if (p.td_prob != null) cells.push(['TD%', (p.td_prob*100).toFixed(0)+'%']);
    }
  } else if (p._sp === 'nhl'){
    if (p.shots_pg != null) cells.push(['SPG', p.shots_pg.toFixed(1)]);
    if (p.pts_pg != null) cells.push(['PTS/GP', p.pts_pg.toFixed(2)]);
    if (p.goal_prob != null) cells.push(['GOAL%', (p.goal_prob*100).toFixed(1)+'%']);
  } else if (p._sp === 'nba'){
    if (p.min != null) cells.push(['MIN', p.min.toFixed(1)]);
    if (p.pts != null) cells.push(['PTS', p.pts.toFixed(1)]);
    if (p.reb != null) cells.push(['REB', p.reb.toFixed(1)]);
    if (p.ast != null) cells.push(['AST', p.ast.toFixed(1)]);
  }
  return cells;
}

/* ── EXPLORE ── */
// Each prop is its own full card now -- headshot, matchup, confidence,
// tags, the projection itself, and the stat line behind it, all visible
// without a tap. The old version packed the same information into a
// compact row and hid the rest behind the detail sheet; that traded away
// readability for density this list didn't actually need. Tapping a card
// still opens the sheet, for the distribution chart and matchup rings that
// don't fit here.
function propCardHtml(p, arr){
  const c = confOf(p, arr), col = confColor(c);
  const e = edgeOf(p);
  const tags = tagsFor(p).slice(0, 3);
  const cells = statCellsFor(p);
  return `<div class="card pcard" data-key="${esc(p._key)}">
    <div class="sh-head">
      ${avatar(p._sp, p, 'sh-av')}
      <div style="min-width:0">
        <div class="sh-n">${esc(p.name)}</div>
        <div class="sh-m">${teamMark(p._sp, p._tab, 11)}<span>${esc(p._tab)}</span>
          <span class="vs">vs</span>${teamMark(p._sp, p._oab, 11)}<span>${esc(p._oab)}</span></div>
        <div class="pcard-mkt">${esc(p._market)}</div>
      </div>
      <div class="sh-score" style="--c:${col}"><b>${c}</b><span>Confidence</span></div>
    </div>
    ${tags.length ? `<div class="tags sheet-tags">${tagHtml(tags)}</div>` : ''}
    <div class="hero">
      <div style="flex:1;min-width:0">
        <div class="hero-n">${p._val.toFixed(p._dp)}</div>
        <div class="hero-l">Projected</div>
      </div>
      ${e && e.line != null ? `<div class="hero-c"><b>${esc(String(e.line))}</b><div class="hero-l">Line</div></div>` : ''}
      ${e && e.edge != null ? `<div class="hero-c"><b style="color:${appEdgeBand(e.edge)[1]}">${e.edge>0?'+':''}${e.edge.toFixed(1)}%</b><div class="hero-l">Edge</div></div>` : ''}
    </div>
    ${cells.length ? `<div class="cells">${cells.map(([l,v])=>`<div class="cell"><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}
  </div>`;
}
function renderExplore(){
  const arr = players(sport);
  const defs = MARKETS[sport] || [];
  const chips = defs.map(m =>
    `<div class="f ${(market||defs[0][0])===m[0]?'on':''}" data-market="${esc(m[0])}">${esc(m[0])}</div>`).join('');
  $('v-explore').innerHTML = `
    <div class="filters">${chips}</div>
    ${arr.length ? `<div class="props-grid">${arr.slice(0,120).map(p=>propCardHtml(p,arr)).join('')}</div>`
      : `<div class="empty"><div class="i">◎</div><div class="m">Nothing on the slate</div>
         <div class="s">${sport.toUpperCase()} has no games right now.</div></div>`}`;
}

/* ── GAMES ──
   Everything the classic board showed on a game card: projected score, win
   probabilities, the total, and the matchup context line. Nothing from the old
   view should be missing here just because the shell changed. */
function gameScore(sp, g){
  if (sp === 'mlb') return [g.away_runs, g.home_runs];
  if (sp === 'nfl') return [g.away_pts, g.home_pts];
  if (sp === 'nba') return [g.away_points, g.home_points];
  return [g.away_goals, g.home_goals];
}
function gameMeta(sp, g){
  const bits = [g.venue];
  if (sp === 'mlb' && g.away_pitcher) bits.push(`${g.away_pitcher} vs ${g.home_pitcher}`);
  if (sp === 'nhl' && g.away_goalie) bits.push(`${g.away_goalie} vs ${g.home_goalie || 'TBD'}`);
  if (sp === 'nfl' && g.away_qb) bits.push(`${g.away_qb} vs ${g.home_qb}`);
  return bits.filter(Boolean).join(' \u00b7 ');
}
function stateLabel(g){
  const st = g.game_state;
  if (st === 'Final') return ['FINAL', '#8E93A3'];
  if (st === 'Live') return [`LIVE${g.inning ? ' ' + (g.inning_half === 'Top' ? '\u25b2' : '\u25bc') + g.inning : ''}`, '#FF4E6A'];
  const t = g.game_time ? new Date(g.game_time) : null;
  return [t ? t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '—', '#8E93A3'];
}
// The edge belongs to a side, so it says which. A bare "+6.6%" leaves you
// working out who it's on from the rest of the card.
// Every priced market on the game, as one clean row of badges: both
// moneylines, both sides of the spread, both sides of the total. Same
// American-odds format the sportsbooks use. Nothing here is invented -- a
// market only gets a badge when FanDuel has actually posted it, via _lines
// (spread/total/moneyline together) or the older standalone `moneylines`.
function fmtOdds(v){ return v == null ? '' : (v > 0 ? '+' + v : String(v)); }
function marketBadges(sp, g){
  const L = g._lines || {};
  const ml = g.moneylines || (L.ml_away != null ? {away:L.ml_away, home:L.ml_home, book:L.book} : null);
  const aAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
  const hAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
  const gkey = `${aAb}@${hAb}|${g.game_time||''}`;
  const live = g.game_state !== 'Final';
  if (!live) return '';

  const badge = (label, price) => {
    return `<span class="mb">
      <span class="mb-l">${esc(label)}</span>
      <span class="mb-p">${price!=null?fmtOdds(price):'\u2014'}</span>
    </span>`;
  };

  const parts = [];
  if (ml){
    parts.push(badge(`${aAb} ML`, ml.away));
    parts.push(badge(`${hAb} ML`, ml.home));
  }
  if (L.spread != null){
    parts.push(badge(`${aAb} ${(-L.spread>0?'+':'')}${(-L.spread)}`, L.spread_away_price));
    parts.push(badge(`${hAb} ${(L.spread>0?'+':'')}${L.spread}`, L.spread_home_price));
  }
  if (L.total != null){
    parts.push(badge(`O ${L.total}`, L.over_price));
    parts.push(badge(`U ${L.total}`, L.under_price));
  }
  if (!parts.length) return '';
  return `<div class="mkts">${parts.join('')}</div>`;
}

// The edge object's `team` field is always a full team name (all four sports
// agree on that), but NHL and NBA's OWN game fields already use abbreviations
// everywhere else. Rather than hardcode a second 60-team name map and risk it
// drifting from the real one, this resolves against the SAME game object's
// away_team/home_team so it can never disagree with what the card already shows.
function resolveTeamAbbr(sp, g, name){
  if (!name) return '';
  const aFull = sp==='mlb'||sp==='nfl' ? g.away_team : (g.away_team || g.away_abbr);
  const hFull = sp==='mlb'||sp==='nfl' ? g.home_team : (g.home_team || g.home_abbr);
  if (name === aFull) return teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
  if (name === hFull) return teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
  return teamAbbr(sp, name);   // fallback: static map (mlb/nfl) or best-effort
}

// LEAN / STRONG / ELITE / PASS -- the model's own read on how strong a signal
// this game is, independent of the numeric edge. Shown as its own pill so a
// LEAN-tier edge doesn't read with the same weight as an ELITE one.
const TIER_COLOR = { ELITE:'#3DF08B', STRONG:'#3DD9F0', LEAN:'#FFC65C', PASS:'#7C8296' };
function tierPill(sp, g, favAb){
  const t = (g.tier || '').toUpperCase();
  if (!t || t === 'PASS') return '';
  const c = TIER_COLOR[t] || '#7C8296';
  return `<span class="tier-pill" style="color:${c}">
    ${favAb ? teamMark(sp, favAb, 13) : ''}<b>${esc(t)}</b>
  </span>`;
}

function edgeTeamPill(sp, g, edge){
  if (!edge || edge.edge_pct == null || g.game_state === 'Final') return '';
  const team = edge.team || '';
  const ab = resolveTeamAbbr(sp, g, team);
  const col = appEdgeBand(edge.edge_pct)[1];
  const v = Number(edge.edge_pct);
  return `<span class="gc-edge" style="color:${col}">
    ${teamMark(sp, ab, 13)}<i>Edge</i><b>${v>0?'+':''}${v.toFixed(1)}%</b>
  </span>`;
}

function renderGames(){
  const d = DATA[sport], sp = sport;
  const games = (d && d.games) || [];
  if (!games.length){
    $('v-games').innerHTML = `<div class="empty"><div class="i">◎</div>
      <div class="m">No games on the slate</div>
      <div class="s">${sp.toUpperCase()} is out of season.</div></div>`;
    return;
  }
  const order = {Preview:0, Live:1, Final:2};
  const sorted = [...games].sort((a,b) =>
    (order[a.game_state] ?? 1) - (order[b.game_state] ?? 1) ||
    String(a.game_time||'').localeCompare(String(b.game_time||'')));

  $('v-games').innerHTML = sorted.map(g => {
    const aAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
    const hAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
    const [as, hs] = gameScore(sp, g);
    const [lab, lcol] = stateLabel(g);
    const aw = g.away_win_pct, hw = g.home_win_pct;
    const total = (as != null && hs != null) ? (as + hs) : null;
    const dim = g.game_state === 'Final' ? 'dim' : g.game_state === 'Live' ? 'live' : '';
    const aCol = teamColor(sp, aAb, '#3DF08B'), hCol = teamColor(sp, hAb, '#7C5CFF');
    const favAb = (aw != null && hw != null) ? (aw >= hw ? aAb : hAb) : null;
    const edge = g.edge;
    const row = (ab, name, score, win, fav) => `
      <div class="gt">
        ${teamMark(sp, ab, 22)}
        <span class="gt-n ${fav?'fav':''}">${esc(name)}</span>
        <span class="gt-s">${score != null ? Number(score).toFixed(sp==='mlb'||sp==='nhl'?1:0) : '–'}</span>
        <span class="gt-w">${win != null ? Math.round(win*100)+'%' : '–'}</span>
      </div>`;
    return `<div class="gc ${dim}">
      <div class="gc-h">
        <span class="gc-m">${teamMark(sp,aAb,15)}${esc(aAb)} <span class="vs">@</span> ${teamMark(sp,hAb,15)}${esc(hAb)}</span>
        <span class="gc-state" style="color:${lcol};border-color:${lcol}44;background:${lcol}14">${lab}</span>
      </div>
      ${row(aAb, sp==='mlb'||sp==='nfl' ? g.away_team : aAb, as, aw, aw>hw)}
      ${row(hAb, sp==='mlb'||sp==='nfl' ? g.home_team : hAb, hs, hw, hw>aw)}
      ${marketBadges(sp, g)}
      ${aw != null ? `<div class="gc-bar" style="background:${hCol}">
        <div style="width:${(aw*100).toFixed(0)}%;background:${aCol}"></div></div>` : ''}
      <div class="gc-stats">
        ${total != null ? `<span><i>Total</i><b>${total.toFixed(1)}</b></span>` : ''}
        ${g.p_over_8_5 != null ? `<span><i>O8.5</i><b>${Math.round(g.p_over_8_5*100)}%</b></span>` : ''}
        ${g.p_over_total != null ? `<span><i>Over</i><b>${Math.round(g.p_over_total*100)}%</b></span>` : ''}
        ${g.p_over_6_5 != null ? `<span><i>O6.5</i><b>${Math.round(g.p_over_6_5*100)}%</b></span>` : ''}
        ${g.target_score != null
          ? `<span title="Scoring environment, 0\u2013100. Blends projected runs, the over probability, and how likely both sides are to score. High = a good game for overs and hitter props.">
              <i>Scoring env</i><b>${g.target_score}</b></span>` : ''}
      </div>
      ${(tierPill(sp, g, favAb) || edgeTeamPill(sp, g, edge)) ? `<div class="gc-badges">${tierPill(sp, g, favAb)}${edgeTeamPill(sp, g, edge)}</div>` : ''}
      ${gameMeta(sp,g) ? `<div class="gc-meta">${esc(gameMeta(sp,g))}</div>` : ''}
    </div>`;
  }).join('');
}

/* ── DETAIL SHEET ── */
function openSheet(key){
  let found = null, arr = [];
  for (const sp of SPORTS){
    const a = players(sp);
    const p = a.find(x => x._key === key);
    if (p){ found = p; arr = a; break; }
  }
  if (!found) return;

// nflverse advanced metrics -- EPA+CPOE for passers, WOPR/target share for
// receivers. Existed on the old NFL board and was dropped when the app
// replaced it; the model still emits it, this just displays it again.
function nflAdvHtml(p){
  if (p._sp !== 'nfl' || !p.adv) return '';
  const a = p.adv, isQB = p._market === undefined ? false : (p.pass_yds != null || p._market === 'Pass Yds');
  const qb = a.dakota != null;
  const items = qb
    ? [['EPA+CPOE', a.dakota.toFixed(3)], ['PASS EPA', (a.pass_epa??0).toFixed(1)], ['SACKS', (a.sacks_taken??0).toFixed(1)]]
    : [['WOPR', (a.wopr??0).toFixed(2)], ['TGT%', ((a.target_share??0)*100).toFixed(0)],
       ['EPA', (a.rec_epa??0).toFixed(1)], ['AIR', (a.air_yards??0).toFixed(0)]];
  const f = qb ? p.eff_factor : p.opp_factor;
  const dir = f > 1.001 ? 'up' : f < 0.999 ? 'dn' : '';
  const chips = items.map(([l,v]) => `<span class="adv-chip"><i>${l}</i><b>${v}</b></span>`).join('');
  const fx = f == null ? '' : `<span class="adv-factor ${dir}">${f>1?'+':''}${((f-1)*100).toFixed(1)}%</span>`;
  return `<h2>Advanced \u00b7 nflverse ${a.weeks}w</h2><div class="adv-row">${chips}${fx}</div>`;
}
  const p = found, c = confOf(p, arr), col = confColor(c);
  const sheetEdge = edgeOf(p), sheetTags = tagsFor(p);
  const g = p._game, ctx = g && g._context;

  const cells = statCellsFor(p);

  let rings = '';
  if (ctx){
    const away = g && (g.away_team === p._team);
    const pq = away ? ctx.pitcher_quality : ctx.opp_pitcher_quality;
    const pen = away ? ctx.bullpen_home : ctx.bullpen_away;
    const r = [];
    if (pq != null) r.push(ring(pq, pq/100, 'Pitcher', '#3DF08B'));
    if (pen != null) r.push(ring(pen.toFixed(2), (pen-0.85)/0.3, 'Bullpen', '#FFC65C'));
    if (ctx.park_run_factor != null) r.push(ring(Math.round(ctx.park_run_factor*100), (ctx.park_run_factor-0.9)/0.28, 'Park', '#7C5CFF'));
    if (ctx.weather_hr_factor != null) r.push(ring((ctx.weather_hr_factor>1?'+':'')+Math.round((ctx.weather_hr_factor-1)*100)+'%', Math.abs(ctx.weather_hr_factor-1)/0.25, 'Weather', '#3DD9F0'));
    if (r.length) rings = `<h2>Matchup analysis</h2><div class="rings">${r.join('')}</div>`;
  }

  const notes = [];
  if (p.matchup_grade) notes.push(`Matchup graded <b>${esc(p.matchup_grade)}</b> against ${esc(p._opp)}.`);
  if (p._sp==='mlb' && p.order) notes.push(`Batting <b>${p.order}${p.order===1?'st':p.order===2?'nd':p.order===3?'rd':'th'}</b>.`);
  if (ctx && ctx.park_run_factor && ctx.park_run_factor !== 1)
    notes.push(`Park plays <b>${ctx.park_run_factor > 1 ? 'up' : 'down'}</b> at ${Math.round(Math.abs(ctx.park_run_factor-1)*100)}%.`);
  if (ctx && ctx.umpire) notes.push(`Home plate: ${esc(ctx.umpire)}.`);
  notes.push(`Confidence is this projection's rank within today's ${esc(p._market)} board, adjusted for matchup grade \u2014 not a hit-rate.`);

  $('sheet-in').innerHTML = `
    <div class="grab"></div>
    <div class="sh-head">
      ${avatar(p._sp, p, 'sh-av')}
      <div><div class="sh-n">${esc(p.name)}</div>
        <div class="sh-m">${teamMark(p._sp, p._tab, 15)}<span>${esc(p._team)}</span>
          <span class="vs">vs</span>${teamMark(p._sp, p._oab, 15)}<span>${esc(p._opp)}</span></div></div>
      <div class="sh-score" style="--c:${col}"><b>${c}</b><span>Confidence</span></div>
    </div>
    <div class="hero">
      <div style="flex:1">
        <div class="hero-n">${p._val.toFixed(p._dp)}</div>
        <div class="hero-l">Projected ${esc(p._market)}</div>
      </div>
      ${sheetEdge && sheetEdge.line != null ? `<div class="hero-c"><b>${esc(String(sheetEdge.line))}</b><div class="hero-l">Line</div></div>` : ''}
      ${sheetEdge && sheetEdge.edge != null ? `<div class="hero-c"><b style="color:${appEdgeBand(sheetEdge.edge)[1]}">${sheetEdge.edge>0?'+':''}${sheetEdge.edge.toFixed(1)}%</b><div class="hero-l">Edge</div></div>` : ''}
    </div>
    ${sheetTags.length ? `<div class="tags sheet-tags">${tagHtml(sheetTags)}</div>` : ''}
    ${cells.length ? `<div class="cells">${cells.map(([l,v])=>`<div class="cell"><b>${v}</b><span>${l}</span></div>`).join('')}</div>` : ''}
    ${nflAdvHtml(p)}
    <h2>Range of outcomes</h2>
    ${distChart(p)}
    ${rings}
    <h2>Model notes</h2>
    <div class="notes">${notes.join(' ')}</div>`;
  $('sheet').classList.add('on');
}

/* ── MONTE CARLO SIM ──────────────────────────────────────────────────────
   Not a new model -- it draws from the exact same assumptions the analytical
   distribution() chart already uses (Poisson for counting stats, Normal with
   a sport-typical spread for continuous ones). The difference is honest work
   instead of a formula: actual random trials, thousands of them, tallied up.
   That's worth doing even though the closed-form math converges to the same
   place, because it's the same technique used for game outcomes below, where
   there ISN'T a clean closed form for "probability the score ends up X-Y". */
function rngPoisson(lambda, rand){
  rand = rand || Math.random;
  if (lambda <= 0) return 0;
  // Knuth's algorithm. Fine up to moderate lambda, which covers every
  // counting stat here -- nothing in this app averages above ~15.
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rand(); } while (p > L);
  return k - 1;
}
function rngNormal(mean, sd, rand){
  rand = rand || Math.random;
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
// Marsaglia-Tsang for Gamma, then a Gamma-Poisson mixture for Negative
// Binomial (which is what "Poisson, but more overdispersed than its own
// mean" actually IS mathematically) -- and a log-space Normal for Log-Normal,
// parameterized so its mean lands on the target mean rather than its median.
// These three plus the two above are the four distribution choices the Sim
// Lab's control panel offers.
function rngGamma(shape, scale, rand){
  rand = rand || Math.random;
  if (shape < 1){
    const u = rand();
    return rngGamma(1 + shape, scale, rand) * Math.pow(u, 1/shape);
  }
  const d = shape - 1/3, c = 1/Math.sqrt(9*d);
  for (;;){
    let x, v;
    do { x = rngNormal(0, 1, rand); v = 1 + c*x; } while (v <= 0);
    v = v*v*v;
    const u = rand();
    if (u < 1 - 0.0331*x*x*x*x) return d*v*scale;
    if (Math.log(u) < 0.5*x*x + d*(1 - v + Math.log(v))) return d*v*scale;
  }
}
function rngNegBinom(mean, sd, rand){
  rand = rand || Math.random;
  const variance = Math.max(mean + 0.05, sd*sd);
  const r = (mean*mean) / Math.max(1e-6, variance - mean);
  const lambda = rngGamma(r, mean/r, rand);
  return rngPoisson(lambda, rand);
}
function rngLogNormal(mean, sd, rand){
  rand = rand || Math.random;
  const cv = sd / Math.max(1e-6, mean);
  const sigma2 = Math.log(1 + cv*cv);
  const mu = Math.log(Math.max(1e-6, mean)) - 0.5*sigma2;
  return Math.exp(rngNormal(mu, Math.sqrt(sigma2), rand));
}
function sampleFor(dist, mean, sd, rand){
  if (dist === 'poisson') return rngPoisson(mean, rand);
  if (dist === 'negbinom') return rngNegBinom(mean, sd, rand);
  if (dist === 'lognormal') return rngLogNormal(mean, sd, rand);
  return Math.max(0, rngNormal(mean, sd, rand));
}
// Mulberry32 -- small, fast, good enough for "reproducible if you want it"
// rather than cryptographic. Only used when the Lab's seed field is filled
// in; every other simulation in the app still uses Math.random.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function percentile(sortedArr, q){
  const i = Math.min(sortedArr.length - 1, Math.max(0, Math.round(q * (sortedArr.length - 1))));
  return sortedArr[i];
}
function simHistogram(samples){
  const lo = samples[0], hi = samples[samples.length - 1];
  const bins = 12, w = Math.max(1e-6, (hi - lo) / bins);
  const counts = new Array(bins).fill(0);
  for (const x of samples){
    let idx = Math.floor((x - lo) / w);
    counts[Math.max(0, Math.min(bins - 1, idx))]++;
  }
  const max = Math.max(...counts) || 1;
  return `<div class="simhist">${counts.map(c =>
    `<div class="simbar" style="height:${Math.max(4, Math.round((c/max)*100))}%"></div>`).join('')}</div>`;
}

const SIM_TRIALS_PLAYER = 3000;
function simPlayer(p){
  const v = p._val;
  const counting = p._dp >= 2 || v < 12;
  const sd = Math.max(1, v * 0.42);
  const samples = new Array(SIM_TRIALS_PLAYER);
  for (let i = 0; i < SIM_TRIALS_PLAYER; i++)
    samples[i] = counting ? rngPoisson(v) : Math.max(0, rngNormal(v, sd));
  samples.sort((a,b) => a-b);
  const e = edgeOf(p);
  let hitRate = null;
  if (e && e.line != null){
    const overShare = samples.filter(x => x >= e.line).length / samples.length;
    hitRate = e.side === 'under' ? 1 - overShare : overShare;
  }
  return { samples, floor: percentile(samples,.25), median: percentile(samples,.5),
    ceil: percentile(samples,.90), edge: e, hitRate };
}

function simPlayerCardHtml(p){
  const s = simPlayer(p);
  const fmt = n => p._dp >= 2 ? n.toFixed(1) : n.toFixed(0);
  return `<div class="card pcard simcard" data-lab="${esc(p._key)}">
    <div class="sh-head">

      <div class="cell"><b style="color:#3DF08B">${fmt(s.median)}</b><span>Median</span></div>
      <div class="cell"><b style="color:#9B7CFF">${fmt(s.ceil)}</b><span>Ceiling</span></div>
    </div>

    </div>` : ''}
    <div class="sim-foot">${SIM_TRIALS_PLAYER.toLocaleString()} simulated trials \u00b7 tap for full lab</div>
  </div>`;
}

const SIM_TRIALS_GAME = 5000;
// NFL and NBA scores are close enough to normal to simulate that way; MLB
// and NHL are low-scoring counting stats, so Poisson fits them better --
// same split the player-prop sim uses, just applied per team instead of
// per player.
//
// away_score_sd/home_score_sd come from each team's own last-season game
// log (nfl_projections.py / nba_projections.py) when the pipeline has them.
// The flat fallback below only kicks in for a team with too short a sample
// (new franchise relocation, missing data, etc.) -- most games by now
// should be using the real per-team number, not the league average.
const SIM_SCORE_SD_FALLBACK = { nfl: 10, nba: 11.5 };
function simGame(sp, g){
  const [projA, projH] = gameScore(sp, g);
  if (projA == null || projH == null) return null;
  const fallback = SIM_SCORE_SD_FALLBACK[sp];
  const sdA = g.away_score_sd ?? fallback;
  const sdH = g.home_score_sd ?? fallback;
  let aWins = 0, hWins = 0, aSum = 0, hSum = 0;
  for (let i = 0; i < SIM_TRIALS_GAME; i++){
    const a = sdA ? Math.max(0, rngNormal(projA, sdA)) : rngPoisson(projA);
    const h = sdH ? Math.max(0, rngNormal(projH, sdH)) : rngPoisson(projH);
    aSum += a; hSum += h;
    if (a === h) { if (Math.random() < 0.5) aWins++; else hWins++; }
    else if (a > h) aWins++; else hWins++;
  }
  return { awayWinPct: aWins/SIM_TRIALS_GAME, homeWinPct: hWins/SIM_TRIALS_GAME,
    avgAway: aSum/SIM_TRIALS_GAME, avgHome: hSum/SIM_TRIALS_GAME };
}

  const model = g.away_win_pct != null

       \u00b7 Sim ${Math.round(s.awayWinPct*100)}/${Math.round(s.homeWinPct*100)}</div>` : '';
  return `<div class="card pcard simcard" data-simgame="${idx}">
    <div class="gc-h"><span class="gc-m">${teamMark(sp,aAb,15)}${esc(aAb)}

    ${row(aAb, aName, s.awayWinPct, s.avgAway, s.awayWinPct>s.homeWinPct)}

    <div class="gc-bar" style="background:#7C5CFF">
      <div style="width:${(s.awayWinPct*100).toFixed(0)}%;background:#3DF08B"></div></div>
    ${model}
    <div class="sim-tap">\u25b8 Tap to run the game \u2014 final score + box score</div>

// ── box score (single trial) ──
// Everything above runs thousands of trials and reports the odds. This runs
// exactly ONE -- one random draw for the final score, one random draw per
// player off their own distribution -- and presents it like a real result,
// because that's what a person asking to "simulate the game" actually wants
// to see: a score, not a percentage. Re-rolling is just running it again.
function primaryMarketFor(sp, p){
  if (sp === 'nfl'){
    const pos = posOf(p);
    if (pos === 'QB') return p.pass_yds != null ? ['Pass Yds', p.pass_yds, 0] : null;
    if (pos === 'RB') return p.rush_yds != null ? ['Rush Yds', p.rush_yds, 0] : null;
    return p.rec_yds != null ? ['Rec Yds', p.rec_yds, 0] : null;
  }
  const m = (MARKETS[sp] || [])[0];
  if (!m) return null;
  const v = m[1](p);
  return v == null || isNaN(v) ? null : [m[0], v, m[2]];
}
function simGameOnce(sp, g){
  const [projA, projH] = gameScore(sp, g);
  if (projA == null || projH == null) return null;
  const fallback = SIM_SCORE_SD_FALLBACK[sp];
  const sdA = g.away_score_sd ?? fallback, sdH = g.home_score_sd ?? fallback;
  const scoreA = Math.round(sdA ? Math.max(0, rngNormal(projA, sdA)) : rngPoisson(projA));
  const scoreH = Math.round(sdH ? Math.max(0, rngNormal(projH, sdH)) : rngPoisson(projH));
  return { scoreA, scoreH };
}
function simBoxScore(sp, g){
  const once = simGameOnce(sp, g);
  if (!once) return null;
  const rows = [];
  for (const pool of POOLS[sp]){
    const away = pool.startsWith('away');
    const raw = g[pool];
    const poolArr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
    for (const p of poolArr){
      const pm = primaryMarketFor(sp, p);
      if (!pm) continue;
      const [label, mean, dp] = pm;
      const counting = dp >= 2 || mean < 12;
      const sd = Math.max(1, mean * 0.42);
      const value = Math.max(0, counting ? rngPoisson(mean) : rngNormal(mean, sd));
      rows.push({ name: p.name, side: away ? 'away' : 'home', label, dp, value });
    }
  }
  return { ...once, rows };
}

let curSimGame = null; // {sp, idx} for whichever box score is open in the sheet
function openGameBox(sp, idx){
  const d = DATA[sp];
  const g = d && d.games && d.games[idx];
  if (!g) return;
  curSimGame = { sp, idx };
  renderGameBox();
  $('sheet').classList.add('on');
}
function renderGameBox(){
  if (!curSimGame) return;
  const { sp, idx } = curSimGame;
  const g = DATA[sp].games[idx];
  const box = simBoxScore(sp, g);
  if (!box){ $('sheet').classList.remove('on'); return; }
  const aAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.away_team : g.away_abbr);
  const hAb = teamAbbr(sp, sp==='mlb'||sp==='nfl' ? g.home_team : g.home_abbr);
  const fmt = r => r.dp >= 2 ? r.value.toFixed(1) : Math.round(r.value);
  const list = side => box.rows.filter(r => r.side === side).sort((a,b) => b.value - a.value)
    .map(r => `<div class="boxrow"><span class="boxrow-n">${esc(r.name)}</span>
      <span class="boxrow-l">${esc(r.label)}</span>
      <span class="boxrow-v">${fmt(r)}</span></div>`).join('')
    || '<div class="boxrow boxrow-empty">No players projected</div>';
  $('sheet-in').innerHTML = `
    <div class="boxscore-head">
      <div class="boxscore-team">${teamMark(sp,aAb,28)}<b>${box.scoreA}</b><span>${esc(aAb)}</span></div>
      <div class="boxscore-vs">FINAL<br><i>simulated</i></div>
      <div class="boxscore-team">${teamMark(sp,hAb,28)}<b>${box.scoreH}</b><span>${esc(hAb)}</span></div>
    </div>
    <h2>${esc(aAb)}</h2>
    <div class="boxlist">${list('away')}</div>
    <h2>${esc(hAb)}</h2>
    <div class="boxlist">${list('home')}</div>
    <button class="resim-btn" data-resim>\u21bb Run it again</button>
    <button class="lab-open-link" data-gamelab="${idx}">\u2192 Open full game simulation lab</button>`;
}

/* ── GAME SIMULATION LAB ──────────────────────────────────────────────────
   Same instrument panel as the player lab, aimed at the game instead of a
   stat line: pick a distribution, pick a trial count, toggle blowout risk /
   score correlation / overtime, and see win%, the total, and the spread all
   redraw from the same batch of trials. Two views share one chart --
   Total (combined score) and Margin (home minus away) -- since those are
   the two numbers an actual book posts a line on. */
let gameLab = null; // { sp, idx, trials, dist, seed, adjPct, blowout, corr, ot, view, controlsOpen }

function runGameLabSim(sp, g, opts){
  const [projA, projH] = gameScore(sp, g);
  if (projA == null || projH == null) return null;
  const rand = (opts.seed !== '' && opts.seed != null && !isNaN(opts.seed))
    ? mulberry32(Number(opts.seed) >>> 0) : Math.random;
  const mult = 1 + (opts.adjPct || 0) / 100;
  const meanA = Math.max(0.05, projA * mult), meanH = Math.max(0.05, projH * mult);
  const fallback = SIM_SCORE_SD_FALLBACK[sp];
  let sdA = g.away_score_sd ?? fallback, sdH = g.home_score_sd ?? fallback;
  if (opts.blowout){ sdA *= 1.3; sdH *= 1.3; } // wider spread = more blowout / more upset risk both ways
  const trials = opts.trials || 5000;
  const awaySamples = new Array(trials), homeSamples = new Array(trials);
  const totalSamples = new Array(trials), marginSamples = new Array(trials);
  let aWins = 0, hWins = 0, ties = 0;
  for (let i = 0; i < trials; i++){
    // Correlation: a shared "environment" multiplier applied to both teams
    // before their own noise -- pace-up games push both scores together,
    // which is why real totals and real margins aren't independent draws.
    const env = opts.corr ? Math.max(0.6, rngNormal(1, 0.08, rand)) : 1;
    let a = sdA ? Math.max(0, rngNormal(meanA*env, sdA, rand)) : rngPoisson(meanA*env, rand);
    let h = sdH ? Math.max(0, rngNormal(meanH*env, sdH, rand)) : rngPoisson(meanH*env, rand);
    if (!sdA) a = Math.round(a); if (!sdH) h = Math.round(h);
    if (a === h){
      if (opts.ot){
        // Sudden-death-style resolution: coin flip decides it, small bump
        // to the winner's score so the box still reads like a final.
        if (rand() < 0.5) a += (sp==='nfl'?3:sp==='nba'?2:1); else h += (sp==='nfl'?3:sp==='nba'?2:1);
      } else {
        ties++;
      }
    }
    if (a > h) aWins++; else if (h > a) hWins++;
    awaySamples[i] = a; homeSamples[i] = h;
    totalSamples[i] = a + h; marginSamples[i] = h - a;
  }
  awaySamples.sort((x,y)=>x-y); homeSamples.sort((x,y)=>x-y);
  totalSamples.sort((x,y)=>x-y); marginSamples.sort((x,y)=>x-y);
  return { awaySamples, homeSamples, totalSamples, marginSamples, trials,
    awayWinPct: aWins/trials, homeWinPct: hWins/trials, tiePct: ties/trials };
}

function basicStats(samples){
  const n = samples.length;
  const mean = samples.reduce((a,b)=>a+b,0)/n;
  const variance = samples.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n;
  return { mean, median: percentile(samples,.5), floor: percentile(samples,.1),
    ceil: percentile(samples,.9), sd: Math.sqrt(variance) };
}

function gameLabThresholds(samples, dp, bookLine, priceOver, priceUnder, isMargin, homeAb){
  const n = samples.length;
  const step = niceStep(basicStats(samples).mean, dp);
  const med = percentile(samples,.5);
  const start = med - step*3;
  const rows = [];
  for (let i=0;i<7;i++){
    const t = Math.round(start + i*step);
    const over = samples.filter(x => x >= t).length / n;
    const fair = probToAmerican(over);
    let edgePct=null, ev=null, kelly=null, isMarket=false;
    if (bookLine != null && Math.abs(bookLine - t) < step*0.5){
      isMarket = true;
      const price = isMargin ? priceUnder : priceOver; // home-covers price for margin view
      if (price != null){
        const implied = 1/americanToDecimal(price);
        edgePct = (over - implied) * 100;
        ev = evPer100(over, price);
        kelly = kellyPct(over, price);
      }
    }
    rows.push({ t, over, under:1-over, fair, edgePct, ev, kelly, isMarket });
  }
  let bestI=-1, bestV=-1;
  rows.forEach((r,i) => { if (r.kelly != null && r.kelly > bestV){ bestV = r.kelly; bestI = i; } });
  if (bestI >= 0) rows[bestI].highlight = true;
  return rows;
}
function gameLabAltLines(samples, dp){
  const n = samples.length;
  return [.15,.30,.45,.60,.75,.90].map(q => {
    const t = Math.round(percentile(samples,q));
    const over = samples.filter(x => x >= t).length / n;
    return { t, over, under: 1-over, fair: probToAmerican(over) };
  });
}

function findGame(sp, idx){ return DATA[sp] && DATA[sp].games && DATA[sp].games[idx]; }

function openGameLab(sp, idx){
  gameLab = { sp, idx, trials: 5000, dist: 'normal', seed: '', adjPct: 0,

  $('sheet-in').innerHTML = `

    </div>

    <div class="lab-controls ${gameLab.controlsOpen ? 'open':''}">

      </div>
      <div class="lab-controls-body">
        <div class="lab-ctrl-row"><span class="lab-ctrl-l">Trials</span>
          <div class="lab-chips">${[1000,5000,10000,25000,50000].map(t =>
            chip(t, gameLab.trials, t.toLocaleString(), 'gamelab-trials')).join('')}</div></div>
        <div class="lab-ctrl-row"><span class="lab-ctrl-l">Distribution</span>
          <div class="lab-chips">
            ${chip('normal', gameLab.dist, 'Normal', 'gamelab-dist')}

          </div></div>
        <div class="lab-ctrl-row"><span class="lab-ctrl-l">Toggles</span>
